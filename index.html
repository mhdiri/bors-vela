<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vela Pro | حرفه‌ای ترادینگ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg-main: #0a0e27;
    --bg-panel: #111827;
    --bg-input: #1a1f3a;
    --border: #2d3447;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --blue: #3b82f6;
    --blue-hover: #2563eb;
    --green: #10b981;
    --red: #ef4444;
    --orange: #f97316;
    --accent: #06b6d4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-main);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    -webkit-font-smoothing: antialiased;
    line-height: 1.4;
  }

  .app {
    display: grid;
    grid-template-rows: 40px 1fr 28px;
    grid-template-columns: 56px 280px 1fr;
    height: 100vh;
    gap: 0;
  }

  /* ===== HEADER ===== */
  .header {
    grid-column: 1 / 4;
    background: linear-gradient(180deg, var(--bg-panel) 0%, rgba(17,24,39,0.95) 100%);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    z-index: 50;
    overflow-x: auto;
    overflow-y: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .header::-webkit-scrollbar { height: 4px; }
  .header::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .logo {
    font-weight: 800;
    font-size: 14px;
    background: linear-gradient(135deg, var(--blue), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    letter-spacing: 2px;
    flex-shrink: 0;
  }

  .symbol-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    height: 32px;
    flex-shrink: 0;
  }
  .symbol-box select {
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-weight: 600;
    font-size: 12px;
    outline: none;
    cursor: pointer;
    min-width: 80px;
  }
  .symbol-box select:hover { color: var(--blue); }
  .symbol-box .divider {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 300;
  }

  .tf-selector {
    display: flex;
    gap: 0;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .tf-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    border-right: 1px solid var(--border);
  }
  .tf-btn:last-child { border-right: none; }
  .tf-btn:hover { color: var(--text-primary); background: rgba(59,130,246,0.1); }
  .tf-btn.active { background: var(--blue); color: #fff; }

  .header-spacer { flex: 1; }

  .header-info {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-left: 12px;
    border-left: 1px solid var(--border);
  }
  .header-info-item {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    font-size: 10px;
  }
  .header-info-label { color: var(--text-muted); }
  .header-info-value { color: var(--text-primary); font-weight: 600; }

  .header-button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .header-button:hover { background: var(--bg-input); color: var(--text-primary); }
  .header-button.primary {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }
  .header-button.primary:hover { background: var(--blue-hover); }

  /* ===== LEFT TOOLBAR ===== */
  .toolbar {
    grid-row: 2;
    grid-column: 1;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 4px;
    overflow-y: auto;
    z-index: 40;
  }
  .toolbar::-webkit-scrollbar { width: 4px; }
  .toolbar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .tool-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.2s ease;
    flex-shrink: 0;
    position: relative;
    tooltip: "";
  }
  .tool-btn:hover {
    background: rgba(59,130,246,0.1);
    color: var(--text-primary);
  }
  .tool-btn.active {
    background: rgba(59,130,246,0.25);
    color: var(--blue);
    box-shadow: inset 0 0 0 1px var(--blue);
  }
  .tool-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
  }

  .tool-divider {
    width: 24px;
    height: 1px;
    background: var(--border);
    margin: 6px 0;
    flex-shrink: 0;
  }

  /* ===== LEFT SIDEBAR ===== */
  .sidebar {
    grid-row: 2;
    grid-column: 2;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    z-index: 35;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sidebar-section {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar-section:last-child { border-bottom: none; }

  .section-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .input-label {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .select-input, .toggle-btn {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .select-input:hover, .toggle-btn:hover {
    border-color: var(--blue);
    background: rgba(59,130,246,0.05);
  }
  .select-input:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
  }
  .toggle-btn.active {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }

  .indicator-btn {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
  }
  .indicator-btn:hover {
    background: rgba(59,130,246,0.1);
    color: var(--text-primary);
    border-color: var(--blue);
  }

  .indicators-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
  }

  .indicator-item {
    background: rgba(59,130,246,0.1);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 4px;
    padding: 6px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

  .indicator-name { color: var(--text-secondary); flex: 1; }
  .indicator-value {
    color: var(--blue);
    font-weight: 600;
    margin: 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .indicator-remove {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    padding: 0;
    transition: color 0.2s;
  }
  .indicator-remove:hover { color: var(--red); }

  .range-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .range-btn {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px;
    border-radius: 4px;
    font-size: 10px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  .range-btn:hover {
    border-color: var(--blue);
    background: rgba(59,130,246,0.05);
  }
  .range-btn.active {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }

  .info-box {
    background: rgba(59,130,246,0.1);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 4px;
    padding: 8px;
    font-size: 10px;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  /* ===== CHART AREA ===== */
  .chart-wrapper {
    grid-row: 2;
    grid-column: 3;
    position: relative;
    background: var(--bg-main);
    overflow: hidden;
  }

  #chart {
    width: 100%;
    height: 100%;
  }

  .chart-controls {
    position: absolute;
    top: 12px;
    left: 12px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    display: flex;
    gap: 6px;
    z-index: 20;
  }

  .chart-control-btn {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 28px;
    height: 28px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 12px;
  }
  .chart-control-btn:hover {
    background: rgba(59,130,246,0.1);
    color: var(--blue);
  }

  .crosshair-display {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    z-index: 20;
    font-size: 11px;
    min-width: 200px;
    display: none;
  }
  .crosshair-display.active { display: block; }

  .crosshair-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0;
  }
  .crosshair-label { color: var(--text-muted); }
  .crosshair-value { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

  .loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10,14,39,0.95);
    z-index: 100;
    gap: 12px;
    color: var(--text-secondary);
  }
  .loader.hidden { display: none; }

  .spinner {
    width: 28px;
    height: 28px;
    border: 2.5px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* ===== STATUSBAR ===== */
  .statusbar {
    grid-column: 1 / 4;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 20px;
    font-size: 10px;
    color: var(--text-muted);
    z-index: 30;
  }

  .status-group {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .status-label { color: var(--text-muted); }
  .status-value { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

  .status-spacer { flex: 1; }

  .status-price { color: var(--green); }
  .status-price.down { color: var(--red); }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ===== UTILITY ===== */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .gap-4 { gap: 4px; }
  .mb-4 { margin-bottom: 4px; }
  .text-center { text-align: center; }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@luxalgo/vela@latest/dist/vela.global.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);

  // ===== DATA & STATE =====
  const SYMBOLS = [
    { name: 'خساپا', file: 'khasapa.csv' },
    { name: 'خودرو', file: 'khodro.csv' }
  ];
  const BASE = 'https://raw.githubusercontent.com/mhdiri/bors-vela/main/';

  let raw1 = null, raw2 = null;
  let allBars = [], curBars = [];
  let curTF = '1W', curRange = 0;
  let isLog = false, isDark = true;
  let priceStyle = 'candles';
  let velaChart = null;

  const indicators = new Map();
  const styleNames = { candles:'کندل', bars:'میله', line:'خط', area:'ناحیه', baseline:'بیس‌لاین' };
  const styleCycle = ['candles','bars','line','area','baseline'];

  // ===== UTILITY FUNCTIONS =====
  function parseCSV(text){
    const lines = text.trim().split(/\r?\n/);
    const out = [];
    for(let i=1; i<lines.length; i++){
      const p = lines[i].split(',');
      if(p.length < 7) continue;
      const ts = new Date(p[2].trim().split(' ')[0]).getTime();
      if(isNaN(ts)) continue;
      const c = parseFloat(p[6]);
      if(c <= 0) continue;
      out.push({ time:ts, open:+p[3], high:+p[4], low:+p[5], close:c, volume:p[7]?+p[7]:0 });
    }
    return out;
  }

  function aggregate(bars, tf){
    if(!bars.length) return bars;
    if(bars.length > 2){
      const gap = (bars[bars.length-1].time - bars[0].time) / (bars.length-1) / 86400000;
      if(gap >= 5) return bars.slice();
    }
    const out = []; let bucket = null;
    for(const b of bars){
      const d = new Date(b.time);
      let key;
      if(tf === '1W'){
        const day = d.getUTCDay() || 7;
        const mon = new Date(d);
        mon.setUTCDate(d.getUTCDate() - day + 1);
        mon.setUTCHours(0,0,0,0);
        key = mon.getTime();
      } else if(tf === '1D'){
        key = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
      } else {
        key = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
      }
      if(!bucket || bucket.time !== key){
        if(bucket) out.push(bucket);
        bucket = { time:key, open:b.open, high:b.high, low:b.low, close:b.close, volume:b.volume||0 };
      } else {
        if(b.high > bucket.high) bucket.high = b.high;
        if(b.low < bucket.low) bucket.low = b.low;
        bucket.close = b.close;
        bucket.volume += b.volume||0;
      }
    }
    if(bucket) out.push(bucket);
    return out;
  }

  function buildRatio(b1, b2){
    const m1={}, m2={};
    b1.forEach(x => m1[x.time]=x);
    b2.forEach(x => m2[x.time]=x);
    const ts = Object.keys(m1).filter(t=>m2[t]).map(Number).sort((a,b)=>a-b);
    const out=[]; let pc=null;
    ts.forEach(t=>{
      const x1=m1[t], x2=m2[t];
      if(!x1||!x2||x1.close<=0||x2.close<=0) return;
      const rOpen = pc!==null ? pc : x1.open/x2.open;
      const rClose = x1.close/x2.close;
      const rHigh = Math.max(x1.high/x2.low, x1.high/x2.close, x1.close/x2.low, rOpen, rClose);
      const rLow  = Math.min(x1.low/x2.high, x1.low/x2.close, x1.close/x2.high, rOpen, rClose);
      out.push({ time:t, open:rOpen, high:rHigh, low:rLow, close:rClose, volume:0 });
      pc = rClose;
    });
    return out;
  }

  function applyRange(){
    if(!allBars.length){ curBars=[]; return; }
    if(curRange===0){ curBars=allBars.slice(); return; }
    const lastT = allBars[allBars.length-1].time;
    curBars = allBars.filter(b => b.time >= lastT - curRange*86400000);
  }

  // ===== UI UPDATES =====
  function updateHeader(){
    if(curBars.length === 0){
      $('headerRatio').textContent = '—';
      $('headerChange').textContent = '—';
      return;
    }
    const last = curBars[curBars.length-1];
    const prev = curBars.length > 1 ? curBars[curBars.length-2].close : last.open;
    const chg = ((last.close - prev) / prev * 100);
    $('headerRatio').textContent = last.close.toFixed(4);
    $('headerChange').textContent = (chg > 0 ? '+' : '') + chg.toFixed(2) + '%';
  }

  function updateStatusBar(){
    $('barCount').textContent = curBars.length;
    if(curBars.length > 0){
      const last = curBars[curBars.length-1];
      const date = new Date(last.time);
      $('lastBar').textContent = date.toLocaleDateString('fa-IR');
      $('volume').textContent = (last.volume || 0).toLocaleString();
    }
  }

  function updateIndicators(){
    const list = $('activeIndicators');
    list.innerHTML = '';
    indicators.forEach((item, id) => {
      const div = document.createElement('div');
      div.className = 'indicator-item';
      div.innerHTML = `
        <span class="indicator-name">${item.name}</span>
        <span class="indicator-value">${item.values || '—'}</span>
        <button class="indicator-remove" onclick="removeIndicator('${id}')">✕</button>
      `;
      list.appendChild(div);
    });
  }

  function showLoader(show = true){
    const loader = $('loader');
    if(show){
      loader.classList.remove('hidden');
      loader.innerHTML = '<div class="spinner"></div><span>درحال بارگذاری...</span>';
      $('status').textContent = '⏳ درحال بارگذاری...';
    } else {
      loader.classList.add('hidden');
      $('status').textContent = '✅ آماده';
    }
  }

  // ===== CHART FUNCTIONS =====
  function renderVela(){
    const el = $('chart');
    if(velaChart){
      try{ velaChart.destroy && velaChart.destroy(); }catch(e){}
      velaChart = null;
    }
    indicators.clear();
    updateIndicators();
    el.innerHTML = '';

    if(typeof window.Vela === 'undefined'){
      el.innerHTML = '<div style="padding:40px;color:#ef4444;text-align:center;font-size:16px;">❌ Vela لود نشد</div>';
      return;
    }

    const VC = window.Vela.Vela || window.Vela;
    if(typeof VC !== 'function' || !curBars.length) return;

    try{
      velaChart = new VC('#chart', {
        data: curBars,
        timeframe: curTF,
        theme: isDark ? 'dark' : 'light',
        priceStyle,
        logScale: isLog,
        currentPriceLine: true,
        upColor: '#10b981',
        downColor: '#ef4444',
        drawings: true,
        animations: true
      });

      if(velaChart.renderer){
        try{ velaChart.renderer.set('gridlines', false); }catch(e){}
      }
    }catch(e){
      console.error(e);
      el.innerHTML = '<div style="padding:40px;color:#ef4444;text-align:center;">❌ ' + e.message + '</div>';
    }
  }

  // ===== MAIN FUNCTIONS =====
  function analyze(){
    showLoader(true);
    const f1 = SYMBOLS[+$('sym1').value].file;
    const f2 = SYMBOLS[+$('sym2').value].file;

    Promise.all([
      fetch(BASE + f1).then(r => r.text()),
      fetch(BASE + f2).then(r => r.text())
    ]).then(([t1, t2]) => {
      raw1 = parseCSV(t1);
      raw2 = parseCSV(t2);
      if(!raw1.length || !raw2.length) throw new Error('داده خالی');
      allBars = buildRatio(aggregate(raw1, curTF), aggregate(raw2, curTF));
      if(allBars.length < 2) throw new Error('داده کافی نیست');
      applyRange();
      renderVela();
      updateHeader();
      updateStatusBar();
      showLoader(false);
    }).catch(e => {
      $('loader').innerHTML = '<span style="color:#ef4444;">❌ خطا: ' + e.message + '</span>';
    });
  }

  function setTF(tf){
    curTF = tf;
    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if(!raw1 || !raw2) return;
    allBars = buildRatio(aggregate(raw1, tf), aggregate(raw2, tf));
    applyRange();
    renderVela();
    updateHeader();
    updateStatusBar();
  }

  function setRange(days, btn){
    curRange = days;
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if(!allBars.length) return;
    applyRange();
    renderVela();
    updateHeader();
    updateStatusBar();
  }

  function toggleLog(){
    isLog = !isLog;
    $('logBtn').classList.toggle('active', isLog);
    if(velaChart?.renderer){
      try{ velaChart.renderer.set('logScale', isLog); }catch(e){ renderVela(); }
    } else renderVela();
  }

  function cycleStyle(){
    const i = styleCycle.indexOf(priceStyle);
    priceStyle = styleCycle[(i+1) % styleCycle.length];
    $('styleLabel').textContent = styleNames[priceStyle];
    if(velaChart?.renderer){
      try{ velaChart.renderer.set('priceStyle', priceStyle); }catch(e){ renderVela(); }
    } else renderVela();
  }

  function toggleTheme(){
    isDark = !isDark;
    $('themeIcon').textContent = isDark ? '🌙' : '☀️';
    renderVela();
  }

  function addIndicator(type){
    if(!velaChart) return;
    let handle = null, name = '';
    try{
      if(type === 'sma'){
        handle = velaChart.addNativeIndicator('sma', { inputs: { length: 20 } });
        name = 'SMA 20';
      } else if(type === 'ema'){
        handle = velaChart.addNativeIndicator('ema', { inputs: { length: 20 } });
        name = 'EMA 20';
      } else if(type === 'rsi'){
        handle = velaChart.addNativeIndicator('rsi', { inputs: { length: 14 } });
        name = 'RSI 14';
      } else if(type === 'bb'){
        handle = velaChart.addNativeIndicator('bb', { inputs: { length: 20 } });
        name = 'Bollinger';
      }
    }catch(e){
      console.warn('Indicator failed:', e);
      return;
    }
    if(handle){
      const id = Date.now() + Math.random();
      indicators.set(id, { handle, name, values: '—' });
      updateIndicators();
    }
  }

  function removeIndicator(id){
    const item = indicators.get(id);
    if(!item) return;
    try{
      if(item.handle?.remove) item.handle.remove();
      else if(item.handle?.destroy) item.handle.destroy();
    }catch(e){}
    indicators.delete(id);
    updateIndicators();
  }

  function clearDrawings(){
    if(velaChart?.drawings) try{ velaChart.drawings.clear(); }catch(e){}
  }

  // ===== INITIALIZATION =====
  setInterval(() => {
    $('clock').textContent = new Date().toLocaleTimeString('fa-IR');
  }, 1000);

  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if(!btn.title.includes('Delete') && !btn.title.includes('پاک')){
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
    });
  });

  (function(){
    const s1 = $('sym1'), s2 = $('sym2');
    SYMBOLS.forEach((s,i) => {
      s1.innerHTML += `<option value="${i}">${s.name}</option>`;
      s2.innerHTML += `<option value="${i}">${s.name}</option>`;
    });
    s1.value = 0;
    s2.value = 1;
    setTimeout(analyze, 300);
  })();

  // ===== EXPOSE GLOBALS =====
  window.analyze = analyze;
  window.setTF = setTF;
  window.setRange = setRange;
  window.toggleLog = toggleLog;
  window.cycleStyle = cycleStyle;
  window.toggleTheme = toggleTheme;
  window.addIndicator = addIndicator;
  window.removeIndicator = removeIndicator;
  window.clearDrawings = clearDrawings;
})();
</script>
</body>
</html>
