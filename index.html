<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Vela - Bors Ratio</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#131722;color:#d1d4dc;font-family:Tahoma}
  #chart{width:100%;height:100vh}
  #log{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.9);padding:10px;border-radius:6px;
    font-size:11px;font-family:monospace;max-width:400px;z-index:99;white-space:pre-wrap;
    color:#aed581;direction:ltr}
</style>
</head>
<body>
<div id="chart"></div>
<div id="log">loading...</div>

<script src="https://cdn.jsdelivr.net/npm/@luxalgo/vela@latest/dist/vela.global.min.js"></script>

<script>
(function(){
  var log = function(m){ document.getElementById('log').innerHTML += '\n' + m; };
  var KEY = 'BQLj8R6NUAQyZjFykZNZW7MU7W7sz8fA';

  function fetchBrsApi(symbol){
    var url = 'https://Api.BrsApi.ir/Tsetmc/History.php?key=' + KEY + '&type=0&l18=' + encodeURIComponent(symbol);
    log('fetch: ' + symbol);
    return fetch(url).then(function(r){ return r.json(); });
  }

  function buildRatio(s1, s2){
    var d1, d2;
    return fetchBrsApi(s1).then(function(x){ d1 = x; return fetchBrsApi(s2); })
      .then(function(x){
        d2 = x;
        log('d1 keys: ' + (d1 && d1[0] ? Object.keys(d1[0]).join(',') : 'none'));
        log('d1: ' + (d1 ? d1.length : 0) + ' | d2: ' + (d2 ? d2.length : 0));
        log('sample: ' + JSON.stringify(d1 && d1[0]).substring(0, 250));
        if (!d1 || !d1.length || !d2 || !d2.length) throw new Error('no data');

        var m1 = {}, m2 = {};
        d1.forEach(function(x){
          var c = x.pc || x.pl || x.pf || x.close;
          if (c > 0) m1[String(x.date)] = c;
        });
        d2.forEach(function(x){
          var c = x.pc || x.pl || x.pf || x.close;
          if (c > 0) m2[String(x.date)] = c;
        });

        var dates = Object.keys(m1).filter(function(d){ return m2[d]; }).sort();
        log('common: ' + dates.length);

        var bars = [], pc = null;
        for (var i = 0; i < dates.length; i++){
          var d = dates[i];
          var ts = new Date(d).getTime();
          if (isNaN(ts)) continue;
          var rc = m1[d] / m2[d];
          var ro = pc !== null ? pc : rc;
          bars.push({ time: ts, open: ro, high: Math.max(ro, rc), low: Math.min(ro, rc), close: rc, volume: 0 });
          pc = rc;
        }
        log('bars: ' + bars.length);
        return bars;
      });
  }

  window.addEventListener('DOMContentLoaded', function(){
    if (typeof window.Vela === 'undefined'){ log('NO VELA'); return; }
    var VC = window.Vela.Vela || window.Vela;

    buildRatio('شیراز', 'شپدیس').then(function(bars){
      if (!bars.length){ log('NO DATA'); return; }
      log('init chart...');
      new VC('#chart', { data: bars, timeframe: '1D', theme: 'dark', priceStyle: 'candles' });
      log('DONE');
    }).catch(function(e){
      log('ERR: ' + e.message);
    });
  });
})();
</script>
</body>
</html>
