<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نسبت‌سنجی بورس ایران</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#131722;color:#d1d4dc;font-family:Tahoma}
  
  .app{display:grid;grid-template-rows:44px 1fr;height:100vh}
  
  /* نوار بالا - اضافه شده */
  .topbar{
    display:flex;align-items:center;gap:6px;padding:0 12px;
    background:#1e222d;border-bottom:1px solid #2a2e39;
    overflow-x:auto;white-space:nowrap;
  }
  .topbar::-webkit-scrollbar{height:0}
  .logo{font-weight:700;font-size:14px;color:#d1d4dc}
  
  .symbox{display:flex;align-items:center;gap:4px;padding:4px 8px;background:#2a2e39;border-radius:4px}
  .symbox select{
    background:transparent;border:none;color:#d1d4dc;font-family:inherit;
    font-size:12px;font-weight:600;cursor:pointer;outline:none;padding:3px 6px;
  }
  .symbox select option{background:#1e222d;color:#d1d4dc}
  .symbox .vs{color:#787b86;font-size:12px;padding:0 3px}
  .symbox .go{
    background:#2962FF;color:#fff;border:none;padding:4px 12px;
    border-radius:3px;font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;
  }
  .symbox .go:hover{background:#1e4fd8}
  
  .divider{width:1px;height:20px;background:#2a2e39;margin:0 4px;flex-shrink:0}
  
  .btn{
    background:none;border:none;color:#d1d4dc;font-family:inherit;font-size:11px;
    padding:6px 10px;border-radius:3px;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{background:#2a2e39}
  .btn.on{background:#2962FF;color:#fff}
  
  .sep-mini{width:1px;height:14px;background:#3a3e4a;margin:0 2px;display:inline-block;vertical-align:middle}
  
  /* چارت Vela - بدون تغییر */
  #chart{width:100%;height:100%;overflow:hidden}
  
  /* پنل اطلاعات گوشه - اضافه شده */
  #info{
    position:fixed;top:56px;left:12px;
    background:rgba(30,34,45,.92);
    padding:10px 14px;border-radius:6px;
    font-size:11px;font-family:monospace;color:#aed581;
    z-index:99;border:1px solid #2a2e39;
    backdrop-filter:blur(6px);max-width:280px;
  }
  #info .row{margin:3px 0}
  #info .v{color:#2962FF;font-weight:700}
  
  /* پنل آمار - اضافه شده */
  #stats{
    position:fixed;top:56px;right:12px;
    background:rgba(30,34,45,.92);
    padding:12px 15px;border-radius:6px;
    font-size:11px;font-family:monospace;color:#d1d4dc;
    z-index:99;border:1px solid #2a2e39;
    backdrop-filter:blur(6px);min-width:220px;display:none;
  }
  #stats.on{display:block}
  #stats .h{font-weight:700;font-size:12px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #2a2e39}
  #stats .r{display:flex;justify-content:space-between;padding:3px 0;gap:16px}
  #stats .k{color:#787b86}
  #stats .val{font-weight:700}
  
  /* سیگنال - اضافه شده */
  #sig{
    position:fixed;bottom:20px;left:12px;
    padding:8px 14px;border-radius:4px;
    font-size:12px;font-weight:700;font-family:monospace;
    z-index:99;display:none;
  }
  #sig.on{display:block}
  #sig.buy{background:rgba(38,166,154,.2);color:#26a69a;border:1px solid #26a69a}
  #sig.sell{background:rgba(239,83,80,.2);color:#ef5350;border:1px solid #ef5350}
  #sig.neu{background:rgba(247,182,0,.15);color:#f7b600;border:1px solid #f7b600}
  
  /* لودینگ */
  #load{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(19,23,34,.9);color:#787b86;font-size:14px;z-index:200;gap:12px;
  }
  #load.off{display:none}
  .spin{width:30px;height:30px;border:2px solid #2a2e39;border-top-color:#2962FF;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="app">

  <!-- نوار بالا: انتخاب نماد + تنظیمات -->
  <div class="topbar">
    <span class="logo">📊 نسبت‌سنجی</span>
    
    <div class="symbox">
      <select id="sym1"></select>
      <span class="vs">÷</span>
      <select id="sym2"></select>
      <button class="go" onclick="analyze()">تحلیل</button>
    </div>
    
    <div class="divider"></div>
    
    <button class="btn" onclick="setTF('1W',this)" id="tfW">هفتگی</button>
    <button class="btn" onclick="setTF('1M',this)" id="tfM">ماهانه</button>
    
    <div class="divider"></div>
    
    <button class="btn" onclick="setRange(30,this)">۱م</button>
    <button class="btn" onclick="setRange(180,this)">۶م</button>
    <button class="btn" onclick="setRange(365,this)">۱س</button>
    <button class="btn" onclick="setRange(1825,this)">۵س</button>
    <button class="btn" onclick="setRange(0,this)">همه</button>
    
    <div class="divider"></div>
    
    <button class="btn" onclick="toggleLog(this)" id="logBtn">لگاریتمی</button>
    <button class="btn" onclick="toggleStats(this)" id="statsBtn">📊 آمار</button>
    <button class="btn" onclick="exportCSV()">📥 CSV</button>
  </div>
  
  <!-- چارت Vela -->
  <div id="chart"></div>
  
  <!-- پنل اطلاعات کوچک -->
  <div id="info">
    <div class="row">وضعیت: <span class="v" id="stStatus">در حال بارگذاری...</span></div>
    <div class="row">تعداد نقاط: <span class="v" id="stCount">-</span></div>
  </div>
  
  <!-- پنل آمار -->
  <div id="stats">
    <div class="h">📊 تحلیل نسبت</div>
    <div class="r"><span class="k">نسبت فعلی</span><span class="val" id="vCur" style="color:#2962FF">-</span></div>
    <div class="r"><span class="k">تغییر کل</span><span class="val" id="vChg">-</span></div>
    <div class="r"><span class="k">میانگین</span><span class="val" id="vMean">-</span></div>
    <div class="r"><span class="k">انحراف معیار</span><span class="val" id="vStd">-</span></div>
    <div class="r"><span class="k">Z-Score</span><span class="val" id="vZ" style="color:#f7b600">-</span></div>
    <div class="r"><span class="k">صدک</span><span class="val" id="vPct">-</span></div>
    <div class="r"><span class="k">نیمه‌عمر</span><span class="val" id="vHl" style="color:#9C27B0">-</span></div>
    <div class="r"><span class="k">Hurst</span><span class="val" id="vHurst">-</span></div>
  </div>
  
  <!-- سیگنال -->
  <div id="sig"></div>
  
  <!-- لودینگ -->
  <div id="load" class="off"></div>
  
</div>

<!-- کتابخانه Vela -->
<script src="https://cdn.jsdelivr.net/npm/@luxalgo/vela@latest/dist/vela.global.min.js"></script>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  
  /* ========== لیست نمادها ==========
     هر فایل CSV رو در پوشه اصلی مخزن آپلود کن با اسم انگلیسی
     بعد اینجا اضافه کن: { name: 'فولاد', file: 'folad.csv' }
  */
  var SYMBOLS = [
    { name: 'خساپا', file: 'khasapa.csv' },
    { name: 'خودرو', file: 'khodro.csv' }
  ];
  
  var BASE = 'https://raw.githubusercontent.com/mhdiri/bors-vela/main/';
  
  var raw1 = null, raw2 = null;
  var allBars = [], curBars = [];
  var curTF = '1W';
  var curRange = 0;
  var isLog = false;
  var velaChart = null;
  
  /* ========== پارس CSV ========== */
  function parseCSV(text){
    var lines = text.trim().split(/\r?\n/);
    var out = [];
    for(var i = 1; i < lines.length; i++){
      var p = lines[i].split(',');
      if(p.length < 7) continue;
      var ds = p[2].trim().split(' ')[0];
      var ts = new Date(ds).getTime();
      if(isNaN(ts)) continue;
      var c = parseFloat(p[6]);
      if(c <= 0) continue;
      out.push({
        time: ts,
        open: parseFloat(p[3]),
        high: parseFloat(p[4]),
        low: parseFloat(p[5]),
        close: c,
        volume: p[7] ? parseFloat(p[7]) : 0
      });
    }
    return out;
  }
  
  /* ========== تجمیع ========== */
  function aggregate(bars, tf){
    if(!bars.length) return bars;
    // چک کنیم نیاز به تجمیع داره یا نه
    if(bars.length > 2){
      var gap = (bars[bars.length-1].time - bars[0].time) / (bars.length-1) / 86400000;
      if(gap < 5) { /* روزانه - نیاز به تجمیع */ }
      else return bars.slice();
    }
    var out = [], bucket = null;
    for(var i = 0; i < bars.length; i++){
      var b = bars[i];
      var d = new Date(b.time);
      var key;
      if(tf === '1W'){
        var day = d.getUTCDay() || 7;
        var mon = new Date(d);
        mon.setUTCDate(d.getUTCDate() - day + 1);
        mon.setUTCHours(0,0,0,0);
        key = mon.getTime();
      } else {
        key = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
      }
      if(!bucket || bucket.time !== key){
        if(bucket) out.push(bucket);
        bucket = { time: key, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume };
      } else {
        if(b.high > bucket.high) bucket.high = b.high;
        if(b.low < bucket.low) bucket.low = b.low;
        bucket.close = b.close;
        bucket.volume += b.volume;
      }
    }
    if(bucket) out.push(bucket);
    return out;
  }
  
  /* ========== ساخت نسبت ========== */
  function buildRatio(b1, b2){
    var m1 = {}, m2 = {};
    b1.forEach(function(x){ m1[x.time] = x; });
    b2.forEach(function(x){ m2[x.time] = x; });
    var ts = Object.keys(m1).filter(function(t){ return m2[t]; }).map(Number).sort(function(a,b){ return a-b; });
    var out = [], pc = null;
    ts.forEach(function(t){
      var x1 = m1[t], x2 = m2[t];
      if(!x1 || !x2 || x1.close <= 0 || x2.close <= 0) return;
      var rc = x1.close / x2.close;
      var ro = pc !== null ? pc : rc;
      out.push({
        time: t,
        open: ro,
        high: Math.max(ro, rc),
        low: Math.min(ro, rc),
        close: rc,
        volume: 0
      });
      pc = rc;
    });
    return out;
  }
  
  /* ========== فیلتر بازه ========== */
  function applyRange(){
    if(!allBars.length){ curBars = []; return; }
    if(curRange === 0){ curBars = allBars.slice(); return; }
    var lastT = allBars[allBars.length-1].time;
    curBars = allBars.filter(function(b){ return b.time >= lastT - curRange*86400000; });
  }
  
  /* ========== آمار ========== */
  function calcStats(d){
    var v = d.map(function(b){ return b.close; });
    var n = v.length;
    if(!n) return null;
    var mean = 0;
    for(var i = 0; i < n; i++) mean += v[i];
    mean /= n;
    var vp = 0;
    for(var i = 0; i < n; i++) vp += Math.pow(v[i]-mean, 2);
    var sd = Math.sqrt(vp/n);
    var sorted = v.slice().sort(function(a,b){ return a-b; });
    var cur = v[n-1];
    var z = sd > 0 ? (cur-mean)/sd : 0;
    var pct = (sorted.filter(function(x){ return x <= cur; }).length / n * 100).toFixed(1);
    return { mean: mean, std: sd, cur: cur, z: z, pct: pct, n: n, first: v[0] };
  }
  
  function calcHalfLife(d){
    var n = d.length;
    if(n < 10) return null;
    var dr = [], rl = [];
    for(var i = 1; i < n; i++){ dr.push(d[i].close - d[i-1].close); rl.push(d[i-1].close); }
    var m = dr.length;
    var mx = 0, my = 0;
    for(var i = 0; i < m; i++){ mx += rl[i]; my += dr[i]; }
    mx /= m; my /= m;
    var sxy = 0, sxx = 0;
    for(var i = 0; i < m; i++){ sxy += (rl[i]-mx)*(dr[i]-my); sxx += Math.pow(rl[i]-mx, 2); }
    var beta = sxx > 0 ? sxy/sxx : 0;
    if(beta >= 0) return { hl: Infinity };
    return { hl: -Math.log(2)/Math.log(1+beta) };
  }
  
  function calcHurst(d){
    var v = d.map(function(b){ return b.close; });
    var n = v.length;
    if(n < 20) return null;
    var sizes = [];
    for(var s = 8; s <= Math.floor(n/2); s *= 2) sizes.push(s);
    if(sizes.length < 2) return null;
    var logRS = [], logN = [];
    for(var si = 0; si < sizes.length; si++){
      var size = sizes[si];
      var chunks = Math.floor(n/size);
      var rsSum = 0, cnt = 0;
      for(var c = 0; c < chunks; c++){
        var ch = v.slice(c*size, (c+1)*size);
        var mn = 0;
        for(var i = 0; i < size; i++) mn += ch[i];
        mn /= size;
        var cum = 0, mnC = 0, mxC = 0;
        for(var i = 0; i < size; i++){
          cum += ch[i] - mn;
          if(cum < mnC) mnC = cum;
          if(cum > mxC) mxC = cum;
        }
        var R = mxC - mnC;
        var vv = 0;
        for(var i = 0; i < size; i++) vv += Math.pow(ch[i]-mn, 2);
        var S = Math.sqrt(vv/size);
        if(S > 0){ rsSum += R/S; cnt++; }
      }
      if(cnt > 0){ logRS.push(Math.log(rsSum/cnt)); logN.push(Math.log(size)); }
    }
    if(logN.length < 2) return null;
    var m = logN.length;
    var mx = 0, my = 0;
    for(var i = 0; i < m; i++){ mx += logN[i]; my += logRS[i]; }
    mx /= m; my /= m;
    var sxy = 0, sxx = 0;
    for(var i = 0; i < m; i++){ sxy += (logN[i]-mx)*(logRS[i]-my); sxx += Math.pow(logN[i]-mx, 2); }
    return sxx > 0 ? sxy/sxx : null;
  }
  
  function updateStats(){
    if(!curBars.length) return;
    var st = calcStats(curBars);
    var chg = ((st.cur - st.first) / st.first * 100).toFixed(2);
    
    $('vCur').textContent = st.cur.toFixed(4);
    var vc = $('vChg');
    vc.textContent = (chg >= 0 ? '+' : '') + chg + '%';
    vc.style.color = chg >= 0 ? '#26a69a' : '#ef5350';
    $('vMean').textContent = st.mean.toFixed(4);
    $('vStd').textContent = st.std.toFixed(4);
    $('vZ').textContent = st.z.toFixed(2);
    $('vPct').textContent = st.pct + '%';
    
    var hl = calcHalfLife(curBars);
    if(hl) $('vHl').textContent = hl.hl === Infinity ? '∞' : hl.hl.toFixed(1);
    
    var h = calcHurst(curBars);
    if(h !== null){
      var lbl = h.toFixed(3);
      if(h > 0.55) lbl += ' (روند)';
      else if(h < 0.45) lbl += ' (بازگشت)';
      else lbl += ' (تصادفی)';
      $('vHurst').textContent = lbl;
    }
    
    // سیگنال
    var sig = $('sig');
    sig.classList.add('on');
    var t, c;
    if(st.z > 2){ t = '🔴 اشباع خرید | Z=' + st.z.toFixed(2); c = 'sell'; }
    else if(st.z < -2){ t = '🟢 اشباع فروش | Z=' + st.z.toFixed(2); c = 'buy'; }
    else if(st.z > 1){ t = '🟠 بالاتر از میانگین'; c = 'neu'; }
    else if(st.z < -1){ t = '🟡 پایین‌تر از میانگین'; c = 'neu'; }
    else { t = '⚪ نرمال | Z=' + st.z.toFixed(2); c = 'neu'; }
    sig.textContent = t;
    sig.className = 'on ' + c;
    
    $('stCount').textContent = curBars.length;
  }
  
  /* ========== راه‌اندازی Vela ========== */
  function renderVela(){
    var el = $('chart');
    el.innerHTML = '';
    velaChart = null;
    
    if(typeof window.Vela === 'undefined'){
      el.innerHTML = '<div style="padding:40px;color:#ef5350;text-align:center">❌ Vela لود نشد</div>';
      return;
    }
    var VC = window.Vela.Vela || window.Vela;
    if(typeof VC !== 'function'){
      el.innerHTML = '<div style="padding:40px;color:#ef5350;text-align:center">❌ Vela constructor پیدا نشد</div>';
      return;
    }
    
    try {
      velaChart = new VC('#chart', {
        data: curBars,
        timeframe: curTF === '1W' ? '1W' : '1M',
        theme: 'dark',
        priceStyle: 'candles',
        logScale: isLog
      });
    } catch(e){
      console.error('Vela error:', e);
      el.innerHTML = '<div style="padding:40px;color:#ef5350;text-align:center">❌ ' + e.message + '</div>';
    }
  }
  
  /* ========== تحلیل ========== */
  function analyze(){
    $('load').classList.remove('off');
    $('load').innerHTML = '<div class="spin"></div><span>در حال دریافت داده...</span>';
    $('stStatus').textContent = 'دریافت...';
    
    var f1 = SYMBOLS[+$('sym1').value].file;
    var f2 = SYMBOLS[+$('sym2').value].file;
    
    Promise.all([
      fetch(BASE + f1).then(function(r){ return r.text(); }),
      fetch(BASE + f2).then(function(r){ return r.text(); })
    ]).then(function(res){
      raw1 = parseCSV(res[0]);
      raw2 = parseCSV(res[1]);
      if(!raw1.length || !raw2.length) throw new Error('داده خالی');
      
      var a1 = aggregate(raw1, curTF);
      var a2 = aggregate(raw2, curTF);
      allBars = buildRatio(a1, a2);
      if(allBars.length < 2) throw new Error('داده کافی نیست');
      
      applyRange();
      renderVela();
      updateStats();
      
      $('load').classList.add('off');
      $('stStatus').textContent = 'آماده';
    }).catch(function(e){
      $('load').innerHTML = '<span style="color:#ef5350">خطا: ' + e.message + '</span>';
      $('stStatus').textContent = 'خطا';
    });
  }
  
  /* ========== تنظیمات ========== */
  function setTF(tf, btn){
    curTF = tf;
    document.querySelectorAll('.btn').forEach(function(b){ b.classList.remove('on'); });
    if(btn) btn.classList.add('on');
    if(!raw1 || !raw2) return;
    var a1 = aggregate(raw1, tf);
    var a2 = aggregate(raw2, tf);
    allBars = buildRatio(a1, a2);
    applyRange();
    renderVela();
    updateStats();
  }
  
  function setRange(days, btn){
    curRange = days;
    document.querySelectorAll('.btn').forEach(function(b){ b.classList.remove('on'); });
    if(btn) btn.classList.add('on');
    if(!allBars.length) return;
    applyRange();
    renderVela();
    updateStats();
  }
  
  function toggleLog(btn){
    isLog = !isLog;
    btn.classList.toggle('on', isLog);
    btn.textContent = isLog ? 'خطی' : 'لگاریتمی';
    if(allBars.length) renderVela();
  }
  
  function toggleStats(btn){
    $('stats').classList.toggle('on');
    btn.classList.toggle('on');
  }
  
  function exportCSV(){
    if(!curBars.length){ alert('ابتدا تحلیل کنید'); return; }
    var s1 = SYMBOLS[+$('sym1').value].name;
    var s2 = SYMBOLS[+$('sym2').value].name;
    var csv = 'date,open,high,low,close\n';
    curBars.forEach(function(r){
      csv += new Date(r.time).toISOString().slice(0,10) + ',' + r.open + ',' + r.high + ',' + r.low + ',' + r.close + '\n';
    });
    var b = new Blob([csv], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = s1 + '_' + s2 + '.csv';
    a.click();
  }
  
  /* ========== شروع ========== */
  (function init(){
    var s1 = $('sym1'), s2 = $('sym2');
    SYMBOLS.forEach(function(s, i){
      s1.innerHTML += '<option value="' + i + '">' + s.name + '</option>';
      s2.innerHTML += '<option value="' + i + '">' + s.name + '</option>';
    });
    s1.value = 0;
    s2.value = 1;
    $('tfW').classList.add('on');
    setTimeout(analyze, 500);
  })();
  
})();
</script>
</body>
</html>
