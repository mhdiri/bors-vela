<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسبت‌سنجی | Vela Pro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #131722;
    --bg-panel: #1e222d;
    --border: #2a2e39;
    --text-primary: #d1d4dc;
    --text-secondary: #787b86;
    --text-muted: #565b66;
    --blue: #2962ff;
    --green: #089981;
    --red: #f23645;
    --orange: #ff9800;
    --hover: #2a2e39;
    --active: #1e3a5f;
    --trading-bg: #0e1117;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--trading-bg);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .app {
    display: grid;
    grid-template-rows: 32px 1fr 24px;
    grid-template-columns: 48px 220px 1fr;
    height: 100vh;
    gap: 0;
  }

  /* ===== Header ===== */
  .header {
    grid-column: 1 / 4;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 12px;
    z-index: 40;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .header::-webkit-scrollbar { height: 3px; }
  .header::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .logo {
    font-weight: 700; font-size: 12px; color: var(--blue);
    text-transform: uppercase; letter-spacing: 1px;
    flex-shrink: 0;
  }

  .symbol-selector {
    display: flex; align-items: center; gap: 4px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px; height: 26px;
    flex-shrink: 0;
  }
  .symbol-selector select {
    background: transparent; border: none; color: var(--text-primary);
    font-weight: 600; font-size: 11px; outline: none; cursor: pointer;
    min-width: 70px;
  }
  .symbol-selector .divider { color: var(--text-muted); font-size: 10px; }

  .tf-tabs {
    display: flex; gap: 2px; flex-shrink: 0;
  }
  .tf-tab {
    background: transparent; border: none; color: var(--text-secondary);
    padding: 4px 12px; font-size: 11px; font-weight: 600;
    cursor: pointer; border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tf-tab:hover { color: var(--text-primary); }
  .tf-tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  .header-spacer { flex: 1; }

  .header-button {
    background: transparent; border: none; color: var(--text-secondary);
    padding: 4px 8px; font-size: 11px; cursor: pointer;
    border-radius: 3px; transition: all 0.15s;
  }
  .header-button:hover { background: var(--hover); color: var(--text-primary); }
  .header-button.active { background: var(--active); color: var(--blue); }

  /* ===== Left Toolbar ===== */
  .toolbar-left {
    grid-row: 2;
    grid-column: 1;
    background: var(--bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 2px;
    overflow-y: auto;
    z-index: 30;
  }
  .toolbar-left::-webkit-scrollbar { width: 3px; }
  .toolbar-left::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .tool-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent;
    border-radius: 4px; cursor: pointer;
    color: var(--text-secondary); transition: all 0.15s;
    flex-shrink: 0;
    position: relative;
  }
  .tool-btn:hover { background: var(--hover); color: var(--text-primary); }
  .tool-btn.active { background: var(--active); color: var(--blue); }
  .tool-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  .tool-sep { width: 20px; height: 1px; background: var(--border); margin: 4px 0; flex-shrink: 0; }

  /* ===== Left Sidebar (Chart Settings) ===== */
  .sidebar-left {
    grid-row: 2;
    grid-column: 2;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px 0;
    gap: 2px;
    overflow-y: auto;
    z-index: 25;
    font-size: 11px;
  }
  .sidebar-left::-webkit-scrollbar { width: 3px; }
  .sidebar-left::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sidebar-section {
    padding: 0 8px; display: flex; flex-direction: column; gap: 4px;
  }

  .sidebar-title {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    color: var(--text-muted); letter-spacing: 0.5px; padding: 8px 8px 4px;
  }

  .sidebar-item {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 3px; padding: 6px 8px; cursor: pointer;
    transition: all 0.15s; display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-item:hover { background: var(--hover); }
  .sidebar-item.active { background: var(--active); color: var(--blue); border-color: var(--blue); }

  .indicator-item {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 3px; padding: 6px 8px; margin-bottom: 4px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10px;
  }
  .indicator-name { flex: 1; color: var(--text-secondary); }
  .indicator-value { color: var(--blue); font-weight: 600; margin: 0 6px; font-variant-numeric: tabular-nums; }
  .indicator-remove { background: transparent; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 12px; padding: 0 2px; transition: color 0.15s; }
  .indicator-remove:hover { color: var(--red); }

  .range-group {
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .range-btn {
    flex: 1; min-width: 40px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 3px; padding: 4px; font-size: 10px; cursor: pointer;
    color: var(--text-secondary); transition: all 0.15s;
  }
  .range-btn:hover { background: var(--hover); }
  .range-btn.active { background: var(--active); color: var(--blue); border-color: var(--blue); }

  .toggle-btn {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 3px; padding: 6px 8px; width: 100%;
    color: var(--text-secondary); cursor: pointer; font-size: 10px;
    transition: all 0.15s;
  }
  .toggle-btn:hover { background: var(--hover); }
  .toggle-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  .divider { width: 100%; height: 1px; background: var(--border); margin: 8px 0; }

  /* ===== Chart Area ===== */
  .chart-container {
    grid-row: 2;
    grid-column: 3;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }
  #chart { width: 100%; height: 100%; }

  .chart-overlay {
    position: absolute; top: 12px; right: 12px;
    z-index: 20; pointer-events: none;
  }

  .crosshair-info {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 10px;
    font-size: 10px; color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .crosshair-value { color: var(--text-primary); font-weight: 600; margin: 2px 0; }

  /* Loading spinner */
  #loader {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(14,17,23,0.92); z-index: 60; gap: 12px;
    color: var(--text-secondary);
  }
  #loader.hidden { display: none; }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Bottom Bar ===== */
  .statusbar {
    grid-column: 1 / 4;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 12px; gap: 12px;
    font-size: 10px; color: var(--text-muted);
  }

  .status-item { display: flex; gap: 4px; align-items: center; }
  .status-value { color: var(--text-primary); font-weight: 600; }

  .statusbar-spacer { flex: 1; }

  /* Scroll styling */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">Vela Pro</div>

    <div class="symbol-selector">
      <select id="sym1"></select>
      <span class="divider">÷</span>
      <select id="sym2"></select>
    </div>

    <div class="tf-tabs">
      <button class="tf-tab" onclick="setTF('1D')">1D</button>
      <button class="tf-tab active" onclick="setTF('1W')">1W</button>
      <button class="tf-tab" onclick="setTF('1M')">1M</button>
    </div>

    <div class="header-spacer"></div>

    <button class="header-button" onclick="analyze()" style="background: var(--blue); color: #fff; font-weight: 600; padding: 4px 12px; border-radius: 3px;">
      📊 تحلیل
    </button>
    <button class="header-button" id="themeBtn" onclick="toggleTheme()" title="Theme">
      🌙
    </button>
  </div>

  <!-- Left Toolbar (Drawing Tools) -->
  <div class="toolbar-left">
    <button class="tool-btn active" title="Cursor"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M3 21l18-18"/></svg></button>
    <button class="tool-btn" title="Trend"><svg viewBox="0 0 24 24"><path d="M4 18L20 6"/></svg></button>
    <button class="tool-btn" title="H Line"><svg viewBox="0 0 24 24"><path d="M3 12h18"/></svg></button>
    <button class="tool-btn" title="V Line"><svg viewBox="0 0 24 24"><path d="M12 3v18"/></svg></button>
    <button class="tool-btn" title="Ray"><svg viewBox="0 0 24 24"><path d="M4 18L14 8M14 8h5M14 8v5"/></svg></button>
    <div class="tool-sep"></div>
    <button class="tool-btn" title="Fib"><svg viewBox="0 0 24 24"><path d="M4 19h16M4 15h12M4 11h8M4 7h4"/></svg></button>
    <button class="tool-btn" title="Box"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <div class="tool-sep"></div>
    <button class="tool-btn" title="Zoom"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <div class="tool-sep"></div>
    <button class="tool-btn" title="Delete" onclick="clearDrawings()"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 12h10l1-12"/></svg></button>
  </div>

  <!-- Left Sidebar (Settings & Indicators) -->
  <div class="sidebar-left">
    <!-- Chart Type -->
    <div class="sidebar-section">
      <div class="sidebar-title">📈 نمودار</div>
      <button class="sidebar-item" id="styleBtn" onclick="cycleStyle()">
        <span id="styleLabel">کندل</span>
        <span style="font-size: 10px; color: var(--text-muted);">⚙️</span>
      </button>
    </div>

    <div class="divider"></div>

    <!-- Indicators -->
    <div class="sidebar-section">
      <div class="sidebar-title">📊 اندیکاتور</div>
      <button class="sidebar-item" onclick="addIndicator('sma')" title="SMA">SMA 20</button>
      <button class="sidebar-item" onclick="addIndicator('ema')" title="EMA">EMA 20</button>
      <button class="sidebar-item" onclick="addIndicator('rsi')" title="RSI">RSI 14</button>
      <button class="sidebar-item" onclick="addIndicator('bb')" title="Bollinger">BB 20</button>
      <div id="activeIndicators" style="margin-top: 6px;"></div>
    </div>

    <div class="divider"></div>

    <!-- Time Range -->
    <div class="sidebar-section">
      <div class="sidebar-title">⏱️ بازه</div>
      <div class="range-group">
        <button class="range-btn" onclick="setRange(30,this)">1M</button>
        <button class="range-btn" onclick="setRange(180,this)">6M</button>
        <button class="range-btn" onclick="setRange(365,this)">1Y</button>
        <button class="range-btn" onclick="setRange(0,this)">ALL</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Scale -->
    <div class="sidebar-section">
      <div class="sidebar-title">📏 مقیاس</div>
      <button class="toggle-btn" id="logBtn" onclick="toggleLog()">Log Scale</button>
    </div>
  </div>

  <!-- Chart -->
  <div class="chart-container">
    <div id="chart"></div>
    <div class="chart-overlay" id="chartOverlay" style="display:none;">
      <div class="crosshair-info">
        <div class="crosshair-value" id="crosshairPrice">—</div>
        <div style="font-size: 9px; color: var(--text-muted);" id="crosshairDate">—</div>
      </div>
    </div>
    <div id="loader" class="hidden"></div>
  </div>

  <!-- Status Bar -->
  <div class="statusbar">
    <div class="status-item">
      <span>بار:</span>
      <span class="status-value" id="barCount">—</span>
    </div>
    <div class="status-item">
      <span>نسبت:</span>
      <span class="status-value" id="currentRatio">—</span>
    </div>

    <div class="statusbar-spacer"></div>

    <div class="status-item">
      <span id="clock">--:--:--</span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@luxalgo/vela@latest/dist/vela.global.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);

  const SYMBOLS = [
    { name: 'خساپا', file: 'khasapa.csv' },
    { name: 'خودرو', file: 'khodro.csv' }
  ];
  const BASE = 'https://raw.githubusercontent.com/mhdiri/bors-vela/main/';

  let raw1 = null, raw2 = null;
  let allBars = [], curBars = [];
  let curTF = '1W';
  let curRange = 0;
  let isLog = false;
  let priceStyle = 'candles';
  let isDark = true;
  let velaChart = null;

  const indicators = new Map();
  const styleNames = { candles:'کندل', bars:'میله', line:'خط', area:'ناحیه', baseline:'بیس‌لاین' };
  const styleCycle = ['candles','bars','line','area','baseline'];

  function parseCSV(text){
    const lines = text.trim().split(/\r?\n/);
    const out = [];
    for(let i=1; i<lines.length; i++){
      const p = lines[i].split(',');
      if(p.length < 7) continue;
      const ts = new Date(p[2].trim().split(' ')[0]).getTime();
      if(isNaN(ts)) continue;
      const c = parseFloat(p[6]);
      if(c <= 0) continue;
      out.push({ time:ts, open:+p[3], high:+p[4], low:+p[5], close:c, volume:p[7]?+p[7]:0 });
    }
    return out;
  }

  function aggregate(bars, tf){
    if(!bars.length) return bars;
    if(bars.length > 2){
      const gap = (bars[bars.length-1].time - bars[0].time) / (bars.length-1) / 86400000;
      if(gap >= 5) return bars.slice();
    }
    const out = []; let bucket = null;
    for(const b of bars){
      const d = new Date(b.time);
      let key;
      if(tf === '1W'){
        const day = d.getUTCDay() || 7;
        const mon = new Date(d);
        mon.setUTCDate(d.getUTCDate() - day + 1);
        mon.setUTCHours(0,0,0,0);
        key = mon.getTime();
      } else if(tf === '1D'){
        key = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
      } else {
        key = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
      }
      if(!bucket || bucket.time !== key){
        if(bucket) out.push(bucket);
        bucket = { time:key, open:b.open, high:b.high, low:b.low, close:b.close, volume:b.volume||0 };
      } else {
        if(b.high > bucket.high) bucket.high = b.high;
        if(b.low < bucket.low) bucket.low = b.low;
        bucket.close = b.close;
        bucket.volume += b.volume||0;
      }
    }
    if(bucket) out.push(bucket);
    return out;
  }

  function buildRatio(b1, b2){
    const m1={}, m2={};
    b1.forEach(x => m1[x.time]=x);
    b2.forEach(x => m2[x.time]=x);
    const ts = Object.keys(m1).filter(t=>m2[t]).map(Number).sort((a,b)=>a-b);
    const out=[]; let pc=null;
    ts.forEach(t=>{
      const x1=m1[t], x2=m2[t];
      if(!x1||!x2||x1.close<=0||x2.close<=0) return;
      const rOpen = pc!==null ? pc : x1.open/x2.open;
      const rClose = x1.close/x2.close;
      const rHigh = Math.max(x1.high/x2.low, x1.high/x2.close, x1.close/x2.low, rOpen, rClose);
      const rLow  = Math.min(x1.low/x2.high, x1.low/x2.close, x1.close/x2.high, rOpen, rClose);
      out.push({ time:t, open:rOpen, high:rHigh, low:rLow, close:rClose, volume:0 });
      pc = rClose;
    });
    return out;
  }

  function applyRange(){
    if(!allBars.length){ curBars=[]; return; }
    if(curRange===0){ curBars=allBars.slice(); return; }
    const lastT = allBars[allBars.length-1].time;
    curBars = allBars.filter(b => b.time >= lastT - curRange*86400000);
  }

  function updateStatus(){
    $('barCount').textContent = curBars.length;
    if(curBars.length > 0){
      const last = curBars[curBars.length-1];
      $('currentRatio').textContent = last.close.toFixed(4);
    }
  }

  function updateIndicators(){
    const list = $('activeIndicators');
    list.innerHTML = '';
    indicators.forEach((item, id) => {
      const div = document.createElement('div');
      div.className = 'indicator-item';
      div.innerHTML = `<span class="indicator-name">${item.name}</span>
        <span class="indicator-value">${item.values || '—'}</span>
        <button class="indicator-remove" onclick="removeIndicator(${id})">×</button>`;
      list.appendChild(div);
    });
  }

  function renderVela(){
    const el = $('chart');
    if(velaChart){
      try{ velaChart.destroy && velaChart.destroy(); }catch(e){}
      velaChart = null;
    }
    indicators.clear();
    updateIndicators();
    el.innerHTML = '';

    if(typeof window.Vela === 'undefined'){
      el.innerHTML = '<div style="padding:40px;color:#f23645;text-align:center">Vela لود نشد</div>';
      return;
    }
    const VC = window.Vela.Vela || window.Vela;
    if(typeof VC !== 'function' || !curBars.length) return;

    try{
      velaChart = new VC('#chart', {
        data: curBars,
        timeframe: curTF,
        theme: 'dark',
        priceStyle,
        logScale: isLog,
        currentPriceLine: true,
        upColor: '#089981',
        downColor: '#f23645',
        drawings: true,
        animations: true
      });

      if(velaChart.renderer){
        try{ velaChart.renderer.set('gridlines', false); }catch(e){}
      }
    }catch(e){
      console.error(e);
      el.innerHTML = '<div style="padding:40px;color:#f23645;text-align:center">'+e.message+'</div>';
    }
  }

  function analyze(){
    $('loader').classList.remove('hidden');
    $('loader').innerHTML = '<div class="spinner"></div><span>درحال بارگذاری...</span>';

    const f1 = SYMBOLS[+$('sym1').value].file;
    const f2 = SYMBOLS[+$('sym2').value].file;

    Promise.all([
      fetch(BASE + f1).then(r => r.text()),
      fetch(BASE + f2).then(r => r.text())
    ]).then(([t1, t2]) => {
      raw1 = parseCSV(t1);
      raw2 = parseCSV(t2);
      if(!raw1.length || !raw2.length) throw new Error('داده خالی');
      allBars = buildRatio(aggregate(raw1, curTF), aggregate(raw2, curTF));
      if(allBars.length < 2) throw new Error('داده کافی نیست');
      applyRange();
      renderVela();
      updateStatus();
      $('loader').classList.add('hidden');
    }).catch(e => {
      $('loader').innerHTML = '<span style="color:#f23645">خطا: ' + e.message + '</span>';
    });
  }

  function setTF(tf){
    curTF = tf;
    document.querySelectorAll('.tf-tab').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if(!raw1 || !raw2) return;
    allBars = buildRatio(aggregate(raw1, tf), aggregate(raw2, tf));
    applyRange();
    renderVela();
    updateStatus();
  }

  function setRange(days, btn){
    curRange = days;
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if(!allBars.length) return;
    applyRange();
    renderVela();
    updateStatus();
  }

  function toggleLog(){
    isLog = !isLog;
    $('logBtn').classList.toggle('active', isLog);
    if(velaChart?.renderer){
      try{ velaChart.renderer.set('logScale', isLog); }catch(e){ renderVela(); }
    } else renderVela();
  }

  function cycleStyle(){
    const i = styleCycle.indexOf(priceStyle);
    priceStyle = styleCycle[(i+1) % styleCycle.length];
    $('styleLabel').textContent = styleNames[priceStyle];
    if(velaChart?.renderer){
      try{ velaChart.renderer.set('priceStyle', priceStyle); }catch(e){ renderVela(); }
    } else renderVela();
  }

  function toggleTheme(){
    isDark = !isDark;
    document.body.classList.toggle('dark', isDark);
    renderVela();
  }

  function addIndicator(type){
    if(!velaChart) return;
    let handle = null, name = '';
    try{
      if(type === 'sma'){
        handle = velaChart.addNativeIndicator('sma', { inputs: { length: 20 } });
        name = 'SMA 20';
      } else if(type === 'ema'){
        handle = velaChart.addNativeIndicator('ema', { inputs: { length: 20 } });
        name = 'EMA 20';
      } else if(type === 'rsi'){
        handle = velaChart.addNativeIndicator('rsi', { inputs: { length: 14 } });
        name = 'RSI 14';
      } else if(type === 'bb'){
        handle = velaChart.addNativeIndicator('bb', { inputs: { length: 20 } });
        name = 'BB 20';
      }
    }catch(e){
      console.warn('addNativeIndicator failed', e);
      return;
    }
    if(handle){
      const id = Date.now() + Math.random();
      indicators.set(id, { handle, name, values: '—' });
      updateIndicators();
    }
  }

  function removeIndicator(id){
    const item = indicators.get(id);
    if(!item) return;
    try{
      if(item.handle?.remove) item.handle.remove();
      else if(item.handle?.destroy) item.handle.destroy();
    }catch(e){}
    indicators.delete(id);
    updateIndicators();
  }

  function clearDrawings(){
    if(velaChart?.drawings) try{ velaChart.drawings.clear(); }catch(e){}
  }

  setInterval(() => {
    $('clock').textContent = new Date().toLocaleTimeString('en-GB', {hour12:false});
  }, 1000);

  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if(!btn.title.includes('Delete')) {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
    });
  });

  (function(){
    const s1 = $('sym1'), s2 = $('sym2');
    SYMBOLS.forEach((s,i) => {
      s1.innerHTML += `<option value="${i}">${s.name}</option>`;
      s2.innerHTML += `<option value="${i}">${s.name}</option>`;
    });
    s1.value = 0;
    s2.value = 1;
    setTimeout(analyze, 300);
  })();

  window.analyze = analyze;
  window.setTF = setTF;
  window.setRange = setRange;
  window.toggleLog = toggleLog;
  window.cycleStyle = cycleStyle;
  window.toggleTheme = toggleTheme;
  window.addIndicator = addIndicator;
  window.removeIndicator = removeIndicator;
  window.clearDrawings = clearDrawings;
})();
</script>
</body>
</html>
