<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسبت‌سنجی بورس | Vela</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  
  :root {
    --tv-bg: #ffffff;
    --tv-panel: #f8f9fd;
    --tv-border: #e0e3eb;
    --tv-text: #131722;
    --tv-text-secondary: #787b86;
    --tv-blue: #2962ff;
    --tv-blue-hover: #1e53e4;
    --tv-green: #089981;
    --tv-red: #f23645;
    --tv-hover: #f0f3fa;
    --tv-active: #e3effd;
    --toolbar-width: 48px;
    --topbar-height: 42px;
    --bottombar-height: 32px;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--tv-bg);
    color: var(--tv-text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  
  .app {
    display: grid;
    grid-template-rows: var(--topbar-height) 1fr var(--bottombar-height);
    grid-template-columns: var(--toolbar-width) 1fr;
    height: 100vh;
    width: 100vw;
  }
  
  /* ========== LEFT TOOLBAR ========== */
  .left-toolbar {
    grid-row: 1 / 3;
    grid-column: 1;
    background: var(--tv-bg);
    border-right: 1px solid var(--tv-border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 0;
    gap: 2px;
    z-index: 20;
  }
  
  .tool-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent;
    border-radius: 6px;
    cursor: pointer;
    color: var(--tv-text-secondary);
    transition: all 0.15s ease;
    position: relative;
  }
  
  .tool-btn:hover {
    background: var(--tv-hover);
    color: var(--tv-text);
  }
  
  .tool-btn.active {
    background: var(--tv-active);
    color: var(--tv-blue);
  }
  
  .tool-btn svg {
    width: 20px; height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  
  .tool-btn .fill-icon {
    fill: currentColor;
    stroke: none;
  }
  
  .tool-divider {
    width: 24px;
    height: 1px;
    background: var(--tv-border);
    margin: 4px 0;
  }
  
  /* ========== TOP BAR ========== */
  .topbar {
    grid-column: 2;
    grid-row: 1;
    background: var(--tv-bg);
    border-bottom: 1px solid var(--tv-border);
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 4px;
    overflow-x: auto;
    z-index: 30;
  }
  
  .topbar::-webkit-scrollbar { height: 0; }
  
  .symbol-box {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px 4px 8px;
    background: var(--tv-panel);
    border: 1px solid var(--tv-border);
    border-radius: 6px;
    min-width: 220px;
    height: 30px;
  }
  
  .symbol-box .search-icon {
    color: var(--tv-text-secondary);
    flex-shrink: 0;
  }
  
  .symbol-box select {
    background: transparent;
    border: none;
    color: var(--tv-text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    padding: 0;
    max-width: 90px;
  }
  
  .symbol-box select option { background: #fff; }
  
  .symbol-box .vs {
    color: var(--tv-text-secondary);
    font-size: 12px;
    font-weight: 500;
  }
  
  .symbol-box .go {
    background: var(--tv-blue);
    color: #fff;
    border: none;
    padding: 3px 10px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    margin-right: 2px;
  }
  
  .symbol-box .go:hover { background: var(--tv-blue-hover); }
  
  .tf-group {
    display: flex;
    align-items: center;
    gap: 1px;
    background: var(--tv-panel);
    border: 1px solid var(--tv-border);
    border-radius: 6px;
    padding: 2px;
    height: 30px;
  }
  
  .tf-btn {
    border: none;
    background: transparent;
    color: var(--tv-text-secondary);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s;
  }
  
  .tf-btn:hover { background: var(--tv-hover); color: var(--tv-text); }
  .tf-btn.active { background: var(--tv-blue); color: #fff; }
  
  .top-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    border: none;
    background: transparent;
    color: var(--tv-text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    height: 30px;
    transition: background 0.12s;
  }
  
  .top-btn:hover { background: var(--tv-hover); }
  .top-btn.active { background: var(--tv-active); color: var(--tv-blue); }
  
  .top-btn svg {
    width: 16px; height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
  }
  
  .divider-v {
    width: 1px;
    height: 20px;
    background: var(--tv-border);
    margin: 0 4px;
    flex-shrink: 0;
  }
  
  .spacer { flex: 1; }
  
  /* ========== CHART AREA ========== */
  .chart-wrap {
    grid-column: 2;
    grid-row: 2;
    position: relative;
    overflow: hidden;
    background: var(--tv-bg);
  }
  
  #chart {
    width: 100%;
    height: 100%;
  }
  
  /* ========== BOTTOM BAR ========== */
  .bottombar {
    grid-column: 2;
    grid-row: 3;
    background: var(--tv-bg);
    border-top: 1px solid var(--tv-border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 12px;
    font-size: 11px;
    color: var(--tv-text-secondary);
  }
  
  .bottombar .tf-mini {
    display: flex;
    gap: 2px;
  }
  
  .bottombar .tf-mini button {
    border: none;
    background: transparent;
    color: var(--tv-text-secondary);
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 3px;
    cursor: pointer;
  }
  
  .bottombar .tf-mini button:hover,
  .bottombar .tf-mini button.active {
    color: var(--tv-blue);
    background: var(--tv-active);
  }
  
  .bottombar .clock {
    margin-right: auto;
    font-variant-numeric: tabular-nums;
  }
  
  /* ========== FLOATING PANELS ========== */
  #info {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(255,255,255,0.94);
    border: 1px solid var(--tv-border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    z-index: 40;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    min-width: 200px;
    backdrop-filter: blur(8px);
  }
  
  #info .row { margin: 3px 0; display: flex; justify-content: space-between; gap: 16px; }
  #info .label { color: var(--tv-text-secondary); }
  #info .val { font-weight: 600; color: var(--tv-text); font-variant-numeric: tabular-nums; }
  
  #stats {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(255,255,255,0.96);
    border: 1px solid var(--tv-border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 12px;
    z-index: 40;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    min-width: 220px;
    display: none;
    backdrop-filter: blur(8px);
  }
  
  #stats.on { display: block; }
  #stats .h {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--tv-border);
  }
  #stats .r { display: flex; justify-content: space-between; padding: 4px 0; gap: 20px; }
  #stats .k { color: var(--tv-text-secondary); }
  #stats .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  
  #sig {
    position: absolute;
    bottom: 16px;
    left: 12px;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    z-index: 40;
    display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  #sig.on { display: block; }
  #sig.buy { background: #e8f7f3; color: var(--tv-green); border: 1px solid #b8e6d9; }
  #sig.sell { background: #fdecec; color: var(--tv-red); border: 1px solid #f5c2c5; }
  #sig.neu { background: #fff8e6; color: #e6a700; border: 1px solid #ffe08a; }
  
  #load {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.92);
    z-index: 100;
    gap: 12px;
    color: var(--tv-text-secondary);
    font-size: 14px;
  }
  #load.off { display: none; }
  
  .spin {
    width: 28px; height: 28px;
    border: 2.5px solid var(--tv-border);
    border-top-color: var(--tv-blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  /* Tooltip */
  .tool-btn[title]:hover::after {
    content: attr(title);
    position: absolute;
    right: 46px;
    top: 50%;
    transform: translateY(-50%);
    background: #131722;
    color: #fff;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 50;
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@luxalgo/vela@latest/dist/vela.global.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  
  const SYMBOLS = [
    { name: 'خساپا', file: 'khasapa.csv' },
    { name: 'خودرو', file: 'khodro.csv' }
  ];
  
  const BASE = 'https://raw.githubusercontent.com/mhdiri/bors-vela/main/';
  let raw1 = null, raw2 = null;
  let allBars = [], curBars = [];
  let curTF = '1W';
  let curRange = 0;
  let isLog = false;
  let priceStyle = 'candles';
  const styleNames = { candles: 'کندل', bars: 'میله', line: 'خط', area: 'ناحیه', baseline: 'بیس‌لاین' };
  const styleCycle = ['candles','bars','line','area','baseline'];
  let velaChart = null;
  
  // ========== CSV PARSE ==========
  function parseCSV(text){
    const lines = text.trim().split(/\r?\n/);
    const out = [];
    for(let i = 1; i < lines.length; i++){
      const p = lines[i].split(',');
      if(p.length < 7) continue;
      const ds = p[2].trim().split(' ')[0];
      const ts = new Date(ds).getTime();
      if(isNaN(ts)) continue;
      const c = parseFloat(p[6]);
      if(c <= 0) continue;
      out.push({
        time: ts,
        open: parseFloat(p[3]),
        high: parseFloat(p[4]),
        low: parseFloat(p[5]),
        close: c,
        volume: p[7] ? parseFloat(p[7]) : 0
      });
    }
    return out;
  }
  
  // ========== AGGREGATE ==========
  function aggregate(bars, tf){
    if(!bars.length) return bars;
    if(bars.length > 2){
      const gap = (bars[bars.length-1].time - bars[0].time) / (bars.length-1) / 86400000;
      if(gap >= 5) return bars.slice();
    }
    const out = [];
    let bucket = null;
    for(const b of bars){
      const d = new Date(b.time);
      let key;
      if(tf === '1W'){
        const day = d.getUTCDay() || 7;
        const mon = new Date(d);
        mon.setUTCDate(d.getUTCDate() - day + 1);
        mon.setUTCHours(0,0,0,0);
        key = mon.getTime();
      } else {
        key = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
      }
      if(!bucket || bucket.time !== key){
        if(bucket) out.push(bucket);
        bucket = { time: key, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume||0 };
      } else {
        if(b.high > bucket.high) bucket.high = b.high;
        if(b.low < bucket.low) bucket.low = b.low;
        bucket.close = b.close;
        bucket.volume += (b.volume||0);
      }
    }
    if(bucket) out.push(bucket);
    return out;
  }
  
  // ========== BUILD RATIO ==========
  function buildRatio(b1, b2){
    const m1 = {}, m2 = {};
    b1.forEach(x => m1[x.time] = x);
    b2.forEach(x => m2[x.time] = x);
    const ts = Object.keys(m1).filter(t => m2[t]).map(Number).sort((a,b) => a-b);
    const out = [];
    let pc = null;
    ts.forEach(t => {
      const x1 = m1[t], x2 = m2[t];
      if(!x1 || !x2 || x1.close <= 0 || x2.close <= 0) return;
      
      const rOpen = pc !== null ? pc : (x1.open / x2.open);
      const rClose = x1.close / x2.close;
      const rHigh = Math.max(x1.high/x2.low, x1.high/x2.close, x1.close/x2.low, rOpen, rClose);
      const rLow  = Math.min(x1.low/x2.high, x1.low/x2.close, x1.close/x2.high, rOpen, rClose);
      
      out.push({ time: t, open: rOpen, high: rHigh, low: rLow, close: rClose, volume: 0 });
      pc = rClose;
    });
    return out;
  }
  
  function applyRange(){
    if(!allBars.length){ curBars = []; return; }
    if(curRange === 0){ curBars = allBars.slice(); return; }
    const lastT = allBars[allBars.length-1].time;
    curBars = allBars.filter(b => b.time >= lastT - curRange*86400000);
  }
  
  // ========== STATS ==========
  function calcStats(d){
    const v = d.map(b => b.close);
    const n = v.length;
    if(!n) return null;
    let mean = 0;
    for(const x of v) mean += x;
    mean /= n;
    let vp = 0;
    for(const x of v) vp += Math.pow(x-mean, 2);
    const sd = Math.sqrt(vp/n);
    const sorted = v.slice().sort((a,b) => a-b);
    const cur = v[n-1];
    const z = sd > 0 ? (cur-mean)/sd : 0;
    const pct = (sorted.filter(x => x <= cur).length / n * 100).toFixed(1);
    return { mean, std: sd, cur, z, pct, n, first: v[0] };
  }
  
  function calcHalfLife(d){
    const n = d.length;
    if(n < 10) return null;
    const dr = [], rl = [];
    for(let i = 1; i < n; i++){ dr.push(d[i].close - d[i-1].close); rl.push(d[i-1].close); }
    const m = dr.length;
    let mx = 0, my = 0;
    for(let i = 0; i < m; i++){ mx += rl[i]; my += dr[i]; }
    mx /= m; my /= m;
    let sxy = 0, sxx = 0;
    for(let i = 0; i < m; i++){ sxy += (rl[i]-mx)*(dr[i]-my); sxx += Math.pow(rl[i]-mx, 2); }
    const beta = sxx > 0 ? sxy/sxx : 0;
    if(beta >= 0) return { hl: Infinity };
    return { hl: -Math.log(2)/Math.log(1+beta) };
  }
  
  function calcHurst(d){
    const v = d.map(b => b.close);
    const n = v.length;
    if(n < 20) return null;
    const sizes = [];
    for(let s = 8; s <= Math.floor(n/2); s *= 2) sizes.push(s);
    if(sizes.length < 2) return null;
    const logRS = [], logN = [];
    for(const size of sizes){
      const chunks = Math.floor(n/size);
      let rsSum = 0, cnt = 0;
      for(let c = 0; c < chunks; c++){
        const ch = v.slice(c*size, (c+1)*size);
        let mn = 0;
        for(const x of ch) mn += x;
        mn /= size;
        let cum = 0, mnC = 0, mxC = 0;
        for(const x of ch){
          cum += x - mn;
          if(cum < mnC) mnC = cum;
          if(cum > mxC) mxC = cum;
        }
        const R = mxC - mnC;
        let vv = 0;
        for(const x of ch) vv += Math.pow(x-mn, 2);
        const S = Math.sqrt(vv/size);
        if(S > 0){ rsSum += R/S; cnt++; }
      }
      if(cnt > 0){ logRS.push(Math.log(rsSum/cnt)); logN.push(Math.log(size)); }
    }
    if(logN.length < 2) return null;
    const m = logN.length;
    let mx = 0, my = 0;
    for(let i = 0; i < m; i++){ mx += logN[i]; my += logRS[i]; }
    mx /= m; my /= m;
    let sxy = 0, sxx = 0;
    for(let i = 0; i < m; i++){ sxy += (logN[i]-mx)*(logRS[i]-my); sxx += Math.pow(logN[i]-mx, 2); }
    return sxx > 0 ? sxy/sxx : null;
  }
  
  function updateStats(){
    if(!curBars.length) return;
    const st = calcStats(curBars);
    const chg = ((st.cur - st.first) / st.first * 100).toFixed(2);
    $('vCur').textContent = st.cur.toFixed(4);
    const vc = $('vChg');
    vc.textContent = (chg >= 0 ? '+' : '') + chg + '%';
    vc.style.color = chg >= 0 ? 'var(--tv-green)' : 'var(--tv-red)';
    $('vMean').textContent = st.mean.toFixed(4);
    $('vStd').textContent = st.std.toFixed(4);
    $('vZ').textContent = st.z.toFixed(2);
    $('vPct').textContent = st.pct + '%';
    
    const hl = calcHalfLife(curBars);
    if(hl) $('vHl').textContent = hl.hl === Infinity ? '∞' : hl.hl.toFixed(1);
    
    const h = calcHurst(curBars);
    if(h !== null){
      let lbl = h.toFixed(3);
      if(h > 0.55) lbl += ' (روند)';
      else if(h < 0.45) lbl += ' (بازگشت)';
      else lbl += ' (تصادفی)';
      $('vHurst').textContent = lbl;
    }
    
    const sig = $('sig');
    sig.classList.add('on');
    let t, c;
    if(st.z > 2){ t = 'اشباع خرید | Z=' + st.z.toFixed(2); c = 'sell'; }
    else if(st.z < -2){ t = 'اشباع فروش | Z=' + st.z.toFixed(2); c = 'buy'; }
    else if(st.z > 1){ t = 'بالاتر از میانگین'; c = 'neu'; }
    else if(st.z < -1){ t = 'پایین‌تر از میانگین'; c = 'neu'; }
    else { t = 'نرمال | Z=' + st.z.toFixed(2); c = 'neu'; }
    sig.textContent = t;
    sig.className = 'on ' + c;
    $('stCount').textContent = curBars.length;
    
    if(curBars.length){
      const last = curBars[curBars.length-1];
      const prev = curBars.length > 1 ? curBars[curBars.length-2].close : last.open;
      const ch = ((last.close - prev)/prev*100).toFixed(2);
      const cls = ch >= 0 ? 'var(--tv-green)' : 'var(--tv-red)';
      $('ohlcLine').innerHTML = 
        `O <b>${last.open.toFixed(4)}</b> &nbsp; H <b>${last.high.toFixed(4)}</b> &nbsp; L <b>${last.low.toFixed(4)}</b> &nbsp; C <b style="color:${cls}">${last.close.toFixed(4)}</b> <span style="color:${cls}">(${ch>=0?'+':''}${ch}%)</span>`;
    }
  }
  
  // ========== RENDER VELA ==========
  function renderVela(){
    const el = $('chart');
    if(velaChart){
      try { velaChart.destroy && velaChart.destroy(); } catch(e){}
      velaChart = null;
    }
    el.innerHTML = '';
    
    if(typeof window.Vela === 'undefined'){
      el.innerHTML = '<div style="padding:40px;color:#f23645;text-align:center">Vela لود نشد</div>';
      return;
    }
    const VC = window.Vela.Vela || window.Vela;
    if(typeof VC !== 'function'){
      el.innerHTML = '<div style="padding:40px;color:#f23645;text-align:center">Constructor پیدا نشد</div>';
      return;
    }
    if(!curBars.length){
      el.innerHTML = '<div style="padding:40px;color:#787b86;text-align:center">داده وجود ندارد</div>';
      return;
    }
    
    try {
      velaChart = new VC('#chart', {
        data: curBars,
        timeframe: curTF === '1W' ? '1W' : '1M',
        theme: 'light',
        priceStyle: priceStyle,
        logScale: isLog,
        currentPriceLine: true,
        upColor: '#089981',
        downColor: '#f23645',
        drawings: true,
        animations: true
      });
    } catch(e){
      console.error(e);
      el.innerHTML = '<div style="padding:40px;color:#f23645;text-align:center">' + (e.message||e) + '</div>';
    }
  }
  
  // ========== ANALYZE ==========
  function analyze(){
    $('load').classList.remove('off');
    $('load').innerHTML = '<div class="spin"></div><span>در حال دریافت داده...</span>';
    $('stStatus').textContent = 'دریافت...';
    
    const f1 = SYMBOLS[+$('sym1').value].file;
    const f2 = SYMBOLS[+$('sym2').value].file;
    
    Promise.all([
      fetch(BASE + f1).then(r => r.text()),
      fetch(BASE + f2).then(r => r.text())
    ]).then(res => {
      raw1 = parseCSV(res[0]);
      raw2 = parseCSV(res[1]);
      if(!raw1.length || !raw2.length) throw new Error('داده خالی');
      const a1 = aggregate(raw1, curTF);
      const a2 = aggregate(raw2, curTF);
      allBars = buildRatio(a1, a2);
      if(allBars.length < 2) throw new Error('داده کافی نیست');
      applyRange();
      renderVela();
      updateStats();
      $('load').classList.add('off');
      $('stStatus').textContent = 'آماده';
    }).catch(e => {
      $('load').innerHTML = '<span style="color:#f23645">خطا: ' + e.message + '</span>';
      $('stStatus').textContent = 'خطا';
    });
  }
  
  // ========== CONTROLS ==========
  function setTF(tf, btn){
    curTF = tf;
    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    if(!raw1 || !raw2) return;
    const a1 = aggregate(raw1, tf);
    const a2 = aggregate(raw2, tf);
    allBars = buildRatio(a1, a2);
    applyRange();
    renderVela();
    updateStats();
  }
  
  function setRange(days, btn){
    curRange = days;
    document.querySelectorAll('.top-btn').forEach(b => {
      if(['۱م','۶م','۱س','۵س','همه'].includes(b.textContent.trim())) b.classList.remove('active');
    });
    if(btn) btn.classList.add('active');
    if(!allBars.length) return;
    applyRange();
    renderVela();
    updateStats();
  }
  
  function toggleLog(btn){
    isLog = !isLog;
    btn.classList.toggle('active', isLog);
    if(velaChart?.renderer){
      try { velaChart.renderer.set('logScale', isLog); } catch(e){ renderVela(); }
    } else if(allBars.length) renderVela();
  }
  
  function cycleStyle(btn){
    const idx = styleCycle.indexOf(priceStyle);
    priceStyle = styleCycle[(idx + 1) % styleCycle.length];
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 18l4-8 4 4 4-10 4 6"/></svg> ${styleNames[priceStyle]}`;
    if(velaChart?.renderer){
      try { velaChart.renderer.set('priceStyle', priceStyle); } catch(e){ renderVela(); }
    } else if(allBars.length) renderVela();
  }
  
  function addNative(type){
    if(!velaChart) return;
    try {
      if(type === 'sma') velaChart.addNativeIndicator('sma', { inputs: { length: 20 } });
      else if(type === 'ema') velaChart.addNativeIndicator('ema', { inputs: { length: 20 } });
      else if(type === 'rsi') velaChart.addNativeIndicator('rsi', { inputs: { length: 14 } });
      else if(type === 'bb') velaChart.addNativeIndicator('bb', { inputs: { length: 20 } });
    } catch(e) {
      console.warn(e);
    }
  }
  
  function clearDrawings(){
    if(velaChart?.drawings){
      try { velaChart.drawings.clear(); } catch(e){}
    }
  }
  
  function toggleStats(btn){
    $('stats').classList.toggle('on');
    btn.classList.toggle('active');
  }
  
  function exportCSV(){
    if(!curBars.length){ alert('ابتدا تحلیل کنید'); return; }
    const s1 = SYMBOLS[+$('sym1').value].name;
    const s2 = SYMBOLS[+$('sym2').value].name;
    let csv = 'date,open,high,low,close\n';
    curBars.forEach(r => {
      csv += new Date(r.time).toISOString().slice(0,10) + ',' + r.open + ',' + r.high + ',' + r.low + ',' + r.close + '\n';
    });
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${s1}_${s2}_ratio.csv`;
    a.click();
  }
  
  // Clock
  function updateClock(){
    const now = new Date();
    $('clock').textContent = now.toLocaleTimeString('en-GB', { hour12: false }) + ' UTC+3:30';
  }
  setInterval(updateClock, 1000);
  updateClock();
  
  // Left toolbar visual only (Vela handles real tools)
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.dataset.tool === 'trash') return;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  
  // Init
  (function init(){
    const s1 = $('sym1'), s2 = $('sym2');
    SYMBOLS.forEach((s, i) => {
      s1.innerHTML += `<option value="${i}">${s.name}</option>`;
      s2.innerHTML += `<option value="${i}">${s.name}</option>`;
    });
    s1.value = 0;
    s2.value = 1;
    setTimeout(analyze, 300);
  })();
  
  // Expose
  window.analyze = analyze;
  window.setTF = setTF;
  window.setRange = setRange;
  window.toggleLog = toggleLog;
  window.cycleStyle = cycleStyle;
  window.addNative = addNative;
  window.clearDrawings = clearDrawings;
  window.toggleStats = toggleStats;
  window.exportCSV = exportCSV;
})();
</script>
</body>
</html>
