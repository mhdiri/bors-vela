<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131722" id="metaThemeColor">
<title>MHDI Ratio</title>
<style>
:root{color-scheme:dark;--bg:#131722;--panel:#1e222d;--border:#2a2e39;--text:#d1d4dc;--muted:#787b86;--accent:#2962ff;--danger:#ef5350}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,Tahoma,Arial,sans-serif;font-size:12px}
body{touch-action:none;overscroll-behavior:none}
button,input,select{font:inherit}
button{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:3px}
button:hover{background:rgba(255,255,255,.06);color:var(--text)}
button.active{background:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
input{outline:none}
.app{height:100vh;display:grid;grid-template-rows:44px 1fr;background:var(--bg)}
.topbar{height:46px;display:flex;align-items:center;gap:3px;padding:0 8px;border-bottom:1px solid var(--border);background:#131722;direction:ltr;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.topbar::-webkit-scrollbar{display:none}
.separator{width:1px;height:22px;background:#2a2e39;margin:0 3px;flex:0 0 auto}
.brand{font-weight:800;color:#fff;letter-spacing:.4px;padding:6px 9px;flex:0 0 auto;font-size:13px}
.search{position:relative;width:238px;height:32px;display:flex;align-items:center;background:#1e222d;border:1px solid #2a2e39;border-radius:4px;flex:0 0 auto;transition:border-color .15s,background .15s}
.search:focus-within{border-color:#4a5568;background:#202532}.search input{width:100%;height:100%;padding:0 10px;background:transparent;border:0;color:var(--text);direction:rtl;font-size:12px}
.search input::placeholder{color:#5f636d}
.results{position:absolute;left:0;right:0;top:34px;display:none;max-height:340px;overflow:auto;background:#1e222d;border:1px solid var(--border);border-radius:3px;z-index:10000;direction:rtl;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.results.open{display:block}
.result{padding:9px 11px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.03)}
.result:last-child{border-bottom:0}
.result:hover,.result.selected{background:#2a2e39}
.result .name{font-weight:700;color:#e6e8eb}
.result .id{font-size:10px;color:var(--muted);direction:ltr}
.pair{display:flex;align-items:center;gap:1px;background:transparent;border:0;border-radius:4px;height:32px;flex:0 0 auto;padding:1px}
.pair-slot{min-width:82px;max-width:128px;height:30px;padding:0 10px;display:flex;align-items:center;justify-content:center;color:#d1d4dc;font-weight:700;cursor:pointer;overflow:hidden;text-overflow:ellipsis;direction:rtl;border-radius:4px;font-size:12px}
.pair-slot:hover{background:#1e222d;color:#fff}
.pair-slot.active{background:#1e222d;color:#fff;outline:1px solid #2962ff}
.pair-sep{color:#787b86;padding:0 3px;font-size:11px}
.go{height:30px;padding:0 12px;background:#2962ff;color:#fff!important;font-weight:700;margin-left:2px;border-radius:4px}
.go:hover{background:#1f55e5}
.control,select{height:32px;padding:0 9px;background:transparent;border:1px solid transparent;color:#d1d4dc;border-radius:4px;cursor:pointer;outline:none;font-size:12px}.control:hover,select:hover{background:#1e222d;border-color:#2a2e39}
select{direction:rtl}
.tool{height:32px;padding:0 9px;border:1px solid transparent;border-radius:4px;font-size:12px}.tool:hover{background:#1e222d;border-color:#2a2e39}.tool.active{background:#2962ff;color:#fff}
.status{margin-left:auto;height:32px;display:flex;align-items:center;padding:0 8px;color:#787b86;direction:rtl;max-width:280px;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.main{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
#chartWrap{position:absolute;inset:0}
#chart{width:100%;height:100%;direction:rtl;touch-action:none;overscroll-behavior:contain}
#loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(19,23,34,.82);z-index:9000;color:#aed581;font-family:monospace;font-size:13px;direction:rtl}
#loading.on{display:flex}
#error{position:absolute;left:10px;right:10px;bottom:10px;display:none;padding:10px 12px;border-radius:3px;background:var(--danger);color:#fff;z-index:9500;direction:rtl;white-space:pre-wrap;word-break:break-word}
#error.on{display:block}
@media(max-width:900px){.brand{display:none}.search{width:190px}.status{display:none}.pair-slot{min-width:68px;max-width:100px}.topbar{gap:2px;padding:0 5px}}

.icon-btn{height:32px;min-width:32px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;color:#d1d4dc;border-radius:4px;font-size:12px;cursor:pointer;flex:0 0 auto}
.icon-btn:hover{background:#1e222d;border-color:#2a2e39;color:#fff}
.save-state{height:32px;display:flex;align-items:center;padding:0 5px;color:#26a69a;font-size:10px;white-space:nowrap;flex:0 0 auto}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20000;display:flex;align-items:flex-start;justify-content:flex-end;padding:56px 12px 12px;direction:rtl}
.modal-backdrop[hidden]{display:none}
.modal{width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:#1e222d;border:1px solid #2a2e39;border-radius:7px;box-shadow:0 18px 50px rgba(0,0,0,.5);color:#d1d4dc}
.modal[hidden]{display:none}
.modal-head{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid #2a2e39;font-size:13px}
.modal-close{width:30px;height:30px;color:#9ca3af;font-size:22px;border-radius:4px}.modal-close:hover{background:#2a2e39;color:#fff}
.modal-search{padding:10px;border-bottom:1px solid #2a2e39}.modal-search input{width:100%;height:34px;border:1px solid #2a2e39;border-radius:4px;background:#131722;color:#d1d4dc;padding:0 10px;direction:rtl;outline:none}.modal-search input:focus{border-color:#2962ff}
.indicator-list{padding:8px}.indicator-row{width:100%;min-height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;margin-bottom:4px;background:#131722;border:1px solid #2a2e39;border-radius:4px;color:#d1d4dc;cursor:pointer;text-align:right}.indicator-row:hover{background:#2a2e39;color:#fff}.indicator-row.current{cursor:default}.indicator-row.current button{background:#ef5350;color:#fff;border:0;border-radius:3px;padding:4px 8px;cursor:pointer}.indicator-subhead{font-size:10px;color:#787b86;padding:7px 4px}.empty{padding:20px 10px;color:#787b86;text-align:center}.modal-foot{padding:10px 12px;border-top:1px solid #2a2e39;color:#787b86;font-size:10px;line-height:1.7}
.settings-copy{padding:14px;display:grid;gap:10px}.settings-copy p{color:#9ca3af;line-height:1.8;font-size:11px}.danger-btn{min-height:36px;border:1px solid #3a2b2b;background:#241818;color:#ef9a98;border-radius:4px;cursor:pointer}.danger-btn:hover{background:#321c1c}
@media(max-width:900px){.save-state{display:none}.modal-backdrop{padding-top:50px}.modal{width:min(420px,calc(100vw - 16px))}}

/* Light theme for the host chrome; Vela itself is switched with chart.setTheme(). */

body.theme-light .app,body.theme-light .main{background:#f5f7fa}
body.theme-light .topbar{background:#ffffff;border-bottom-color:#dfe3e8}
body.theme-light .brand{color:#202124}
body.theme-light .separator{background:#dfe3e8}
body.theme-light .search{background:#f8f9fb;border-color:#d9dde3}
body.theme-light .search:focus-within{background:#ffffff;border-color:#9aa4b2}
body.theme-light .search input{color:#202124}
body.theme-light .search input::placeholder{color:#7a818c}
body.theme-light .results{background:#ffffff;border-color:#d9dde3;box-shadow:0 8px 24px rgba(0,0,0,.10)}
body.theme-light .result{border-bottom-color:#edf0f3}
body.theme-light .result:hover,body.theme-light .result.selected{background:#eef2f7}
body.theme-light .result .name{color:#202124}
body.theme-light .pair-slot{color:#202124}
body.theme-light .pair-slot:hover{background:#eef2f7;color:#111827}
body.theme-light .pair-slot.active{background:#eef2f7;outline-color:#2962ff}
body.theme-light .pair-sep{color:#69717d}
body.theme-light .control,body.theme-light select,body.theme-light .icon-btn,body.theme-light .tool{color:#374151}
body.theme-light .control:hover,body.theme-light select:hover,body.theme-light .icon-btn:hover,body.theme-light .tool:hover{background:#eef2f7;border-color:#d9dde3;color:#111827}
body.theme-light .tool.active{color:#fff;background:#2962ff}
body.theme-light .status{color:#6b7280}
body.theme-light .save-state{color:#0f8d7e}
body.theme-light #loading{background:rgba(245,247,250,.88);color:#16755f}
body.theme-light #pairTitle{background:rgba(255,255,255,.82);border-color:#e1e5ea;color:#202124}
body.theme-light #pairTitle b{color:#111827}
body.theme-light .modal{background:#ffffff;border-color:#d9dde3;color:#202124;box-shadow:0 18px 50px rgba(0,0,0,.16)}
body.theme-light .modal-head{border-bottom-color:#e5e7eb}
body.theme-light .modal-search{border-bottom-color:#e5e7eb}
body.theme-light .modal-search input{background:#f8f9fb;color:#202124;border-color:#d9dde3}
body.theme-light .indicator-row{background:#f8f9fb;border-color:#e1e5ea;color:#202124}
body.theme-light .indicator-row:hover{background:#eef2f7;color:#111827}
body.theme-light .indicator-subhead,body.theme-light .empty,body.theme-light .modal-foot{color:#6b7280}
body.theme-light .settings-copy p{color:#5f6670}
body.theme-light .danger-btn{background:#fff3f3;border-color:#f0cccc;color:#b42318}
body.theme-light .danger-btn:hover{background:#ffe7e7}
.theme-toggle{height:32px;min-width:58px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid transparent;background:transparent;color:#d1d4dc;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;flex:0 0 auto}
.theme-toggle:hover{background:#1e222d;border-color:#2a2e39;color:#fff}
.theme-toggle .theme-icon{font-size:13px;line-height:1}
body.theme-light .theme-toggle{color:#374151}
body.theme-light .theme-toggle:hover{background:#eef2f7;border-color:#d9dde3;color:#111827}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">MHDI</div>

    <div class="search" id="searchBox">
      <input id="searchInput" type="text" autocomplete="off" spellcheck="false" placeholder="جستجوی نماد...">
      <div id="results" class="results"></div>
    </div>

    <div class="pair" aria-label="انتخاب نسبت">
      <button id="slotA" class="pair-slot active" title="انتخاب نماد اول">—</button>
      <span class="pair-sep">به</span>
      <button id="slotB" class="pair-slot" title="انتخاب نماد دوم">—</button>
      <button id="swapBtn" class="icon-btn" title="جابه‌جایی دو نماد" aria-label="جابه‌جایی دو نماد">⇄</button>
      <button id="analyzeBtn" class="go" title="نمایش نسبت">تحلیل</button>
    </div>

    <div class="separator"></div>

    <select id="timeframe" title="تایم‌فریم">
      <option value="1D">روزانه</option>
      <option value="1W" selected>هفتگی</option>
      <option value="1M">ماهانه</option>
    </select>

    <select id="range" title="بازه نمایش">
      <option value="30">۱ ماه</option>
      <option value="90">۳ ماه</option>
      <option value="180">۶ ماه</option>
      <option value="365">۱ سال</option>
      <option value="1825">۵ سال</option>
      <option value="0" selected>همه</option>
    </select>

    <select id="style" title="نوع نمودار">
      <option value="candles" selected>کندل</option>
      <option value="bars">میله‌ای</option>
      <option value="line">خط</option>
      <option value="area">ناحیه</option>
      <option value="baseline">مبنا</option>
    </select>

    <button id="indicatorBtn" class="tool" title="اندیکاتورها">اندیکاتورها</button>
    <button id="adjustedBtn" class="tool" title="نمایش عملکردی؛ RAW دست‌نخورده می‌ماند">عملکردی</button>
    <button id="rawBtn" class="tool active" title="نمایش RAW">خام</button>
    <button id="logBtn" class="tool" title="مقیاس لگاریتمی">Log</button>
    <button id="themeBtn" class="theme-toggle" title="تغییر تم روشن / مشکی" aria-label="تغییر تم"> <span class="theme-icon">☾</span><span class="theme-label">مشکی</span></button>
    <button id="saveBtn" class="tool" title="ذخیره دستی تنظیمات و ترسیمات">ذخیره</button>
    <button id="resetBtn" class="tool" title="بازنشانی فقط نمای چارت">بازنشانی</button>
    <button id="settingsBtn" class="icon-btn" title="تنظیمات ذخیره‌سازی">⚙</button>
    <button id="shareBtn" class="tool" title="کپی لینک همین چارت">اشتراک</button>
    <button id="shotBtn" class="icon-btn" title="تصویر نمودار">PNG</button>
    <button id="fullscreenBtn" class="icon-btn" title="تمام صفحه">⛶</button>

    <div id="saveState" class="save-state">—</div>
    <div id="status" class="status">در حال آماده‌سازی...</div>
  </div>

  <main class="main">
    <div id="chartWrap"><div id="chart"></div></div>
    <div id="loading"><span>در حال بارگذاری...</span></div>
    <div id="error"></div>
  </main>
</div>

<div id="modalBackdrop" class="modal-backdrop" hidden>
  <section id="indicatorModal" class="modal" hidden aria-modal="true" role="dialog">
    <div class="modal-head"><strong>اندیکاتورها</strong><button class="modal-close" data-close="1">×</button></div>
    <div class="modal-search"><input id="indicatorSearch" placeholder="جستجوی اندیکاتور..." autocomplete="off"></div>
    <div id="indicatorList" class="indicator-list"></div>
    <div class="modal-foot">اندیکاتورهای محاسباتی سنگین، در Worker اجرا می‌شوند.</div>
  </section>

  <section id="settingsModal" class="modal" hidden aria-modal="true" role="dialog">
    <div class="modal-head"><strong>تنظیمات ذخیره‌سازی</strong><button class="modal-close" data-close="1">×</button></div>
    <div class="settings-copy">
      <p>تنظیمات این مرورگر به‌صورت خودکار ذخیره می‌شوند؛ چارت‌ها، ترسیمات، نمای فعلی و تنظیمات ظاهری دوباره برمی‌گردند.</p>
      <button id="resetCurrentBtn" class="danger-btn">پاک‌کردن ذخیره همین نمودار</button>
      <button id="resetAllBtn" class="danger-btn">پاک‌کردن همه ذخیره‌های این مرورگر</button>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@luxalgo/vela@0.8.3/dist/vela.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@luxalgo/vela-pinets@0.2.15/dist/vela-pinets.global.min.js"></script>
<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const BASE = '/';
  const SYMBOLS_URL = BASE + 'data/symbols.json';
  const VELA = window.Vela && (window.Vela.Vela || window.Vela);
  const STORAGE_KEY = 'mhdi-bors-vela-v16';
  const APP_VERSION = 'v16';
  const FETCH_TIMEOUT = 20000;
  const WORKER_TIMEOUT = 15000;

  const state = {
    symbols: [],
    symbolIndex: new Map(),
    targetSlot: 'A',
    a: null,
    b: null,
    timeframe: '1W',
    rangeDays: 0,
    priceStyle: 'candles',
    adjusted: false,
    logScale: false,
    theme: 'dark',
    lastRatioBars: [],
    rawCache: new Map(),
    ratioCache: new Map(),
    adjustedCache: new Map(),
    chart: null,
    saveTimer: null,
    worker: null,
    workerSeq: 0,
    pendingWorker: new Map(),
    searchResults: [],
    searchCursor: -1,
    restoring: false,
    pineEngine: null,
    userIndicators: new Map()
  };

  function safeStorageGet(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; } }
  function safeStorageSet(data){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; } catch { return false; } }
  function setSaveState(text){ $('saveState').textContent = text || '—'; }
  function setStatus(text){ $('status').textContent = text || ''; }
  function setLoading(on, text){ $('loading').classList.toggle('on', !!on); if(on) $('loading').firstElementChild.textContent = text || 'در حال بارگذاری...'; }
  function clearError(){ $('error').textContent=''; $('error').classList.remove('on'); }
  function showError(message){ $('error').textContent='خطا: ' + message; $('error').classList.add('on'); console.error(message); }

  function normalizeText(value){
    return String(value ?? '')
      .replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/ۀ/g,'ه')
      .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
      .replace(/[\u200c\u200f\u200e]/g,'').trim().toLowerCase();
  }
  function toNumber(v){ const n=Number(v); return Number.isFinite(n)?n:null; }
  function toEpochMs(v){
    if(typeof v==='number' && Number.isFinite(v)) return v<100000000000?v*1000:v;
    if(typeof v==='string'){
      const n=Number(v); if(Number.isFinite(n)) return n<100000000000?n*1000:n;
      const d=Date.parse(v); if(Number.isFinite(d)) return d;
    }
    return null;
  }

  async function fetchJSON(url, timeoutMs=FETCH_TIMEOUT){
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), timeoutMs);
    try{
      const response = await fetch(url, { cache:'no-cache', signal:controller.signal });
      if(!response.ok) throw new Error('HTTP ' + response.status);
      return await response.json();
    }catch(e){
      if(e?.name === 'AbortError') throw new Error('TIMEOUT پس از ' + Math.round(timeoutMs/1000) + ' ثانیه: ' + url);
      throw e;
    }finally{ clearTimeout(timer); }
  }

  function normalizeBars(data){
    if(!Array.isArray(data)) throw new Error('ساختار فایل RAW معتبر نیست.');
    const map=new Map();
    for(const row of data){
      if(!row || typeof row!=='object') continue;
      const time=toEpochMs(row.time ?? row.timestamp ?? row.t ?? row.date);
      const open=toNumber(row.open), high=toNumber(row.high), low=toNumber(row.low), close=toNumber(row.close), volume=toNumber(row.volume)??0;
      if(time===null || open===null || high===null || low===null || close===null) continue;
      if(open<=0 || high<=0 || low<=0 || close<=0 || high<low) continue;
      map.set(time,{time,open,high,low,close,volume});
    }
    return [...map.values()].sort((a,b)=>a.time-b.time);
  }

  function findGaps(bars){
    const gaps=[];
    for(let i=1;i<bars.length;i++){
      const p=bars[i-1].close, c=bars[i].close;
      if(p>0 && c>0){ const r=c/p; if(r>1.4 || r<0.7) gaps.push({idx:i,ratio:r}); }
    }
    return gaps;
  }
  function adjustedBars(id,bars){
    const key=String(id);
    if(state.adjustedCache.has(key)) return state.adjustedCache.get(key);
    const out=bars.map(b=>({...b}));
    for(let pass=0;pass<5;pass++){
      const gaps=findGaps(out); if(!gaps.length) break;
      for(let g=gaps.length-1;g>=0;g--){
        const {idx,ratio}=gaps[g];
        for(let j=0;j<idx;j++){ out[j].open*=ratio; out[j].high*=ratio; out[j].low*=ratio; out[j].close*=ratio; }
      }
    }
    state.adjustedCache.set(key,out); return out;
  }

  function aggregate(bars,tf){
    if(tf==='1D') return bars;
    const out=[]; let bucket=null;
    for(const b of bars){
      const d=new Date(b.time);
      let key;
      if(tf==='1W'){
        // Iranian trading-week bucket: Saturday -> Friday.
        const day=d.getUTCDay();
        const daysSinceSat=(day+1)%7;
        key=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-daysSinceSat);
      }else key=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1);
      if(!bucket || bucket.time!==key){
        if(bucket) out.push(bucket);
        bucket={time:key,open:b.open,high:b.high,low:b.low,close:b.close,volume:b.volume||0};
      }else{
        bucket.high=Math.max(bucket.high,b.high); bucket.low=Math.min(bucket.low,b.low); bucket.close=b.close; bucket.volume+=(b.volume||0);
      }
    }
    if(bucket) out.push(bucket); return out;
  }

  function buildRatio(a,b){
    const key=[state.a.id,state.b.id,state.timeframe,state.adjusted?'A':'R'].join('|');
    if(state.ratioCache.has(key)) return state.ratioCache.get(key);
    const m1=new Map(a.map(x=>[x.time,x])); const m2=new Map(b.map(x=>[x.time,x])); const out=[];
    for(const [time,x1] of m1){
      const x2=m2.get(time); if(!x2) continue;
      const vals=[x1.open,x1.high,x1.low,x1.close,x2.open,x2.high,x2.low,x2.close];
      if(!vals.every(v=>Number.isFinite(v)&&v>0)) continue;
      const open=x1.open/x2.open, close=x1.close/x2.close;
      const high=Math.max(x1.high/x2.low,x1.high/x2.high,x1.open/x2.low,x1.close/x2.low,open,close);
      const low=Math.min(x1.low/x2.high,x1.low/x2.low,x1.open/x2.high,x1.close/x2.high,open,close);
      out.push({time,open,high,low,close,volume:0});
    }

  function ensureWorker(){
    if(state.worker) return state.worker;
    const workerSource = `
      const finite=(v)=>Number.isFinite(Number(v));
      const norm=(data)=>{ const m=new Map(); for(const row of (Array.isArray(data)?data:[])){ if(!row||typeof row!=='object')continue; const n=(v)=>{const x=Number(v);return Number.isFinite(x)?x:null}; const time=(()=>{const v=row.time??row.timestamp??row.t??row.date; if(typeof v==='number'&&Number.isFinite(v))return v<100000000000?v*1000:v; if(typeof v==='string'){const x=Number(v);if(Number.isFinite(x))return x<100000000000?x*1000:x;const d=Date.parse(v);if(Number.isFinite(d))return d} return null})(); const o=n(row.open),h=n(row.high),l=n(row.low),c=n(row.close),vol=n(row.volume)??0; if(time===null||o===null||h===null||l===null||c===null||o<=0||h<=0||l<=0||c<=0||h<l)continue; m.set(time,{time,open:o,high:h,low:l,close:c,volume:vol}) } return [...m.values()].sort((a,b)=>a.time-b.time)};
      const adjust=(bars)=>{const out=bars.map(b=>({...b})); const gaps=()=>{const g=[];for(let i=1;i<out.length;i++){const p=out[i-1].close,c=out[i].close,r=c/p;if(p>0&&c>0&&(r>1.4||r<0.7))g.push({idx:i,ratio:r})}return g};for(let pass=0;pass<5;pass++){const gs=gaps();if(!gs.length)break;for(let g=gs.length-1;g>=0;g--){const {idx,ratio}=gs[g];for(let j=0;j<idx;j++){out[j].open*=ratio;out[j].high*=ratio;out[j].low*=ratio;out[j].close*=ratio}}}return out};
      const agg=(bars,tf)=>{if(tf==='1D')return bars;const out=[];let bucket=null;for(const b of bars){const d=new Date(b.time);const day=d.getUTCDay();const daysSinceSat=(day+1)%7;const key=tf==='1W'?Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-daysSinceSat):Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1);if(!bucket||bucket.time!==key){if(bucket)out.push(bucket);bucket={time:key,open:b.open,high:b.high,low:b.low,close:b.close,volume:b.volume||0}}else{bucket.high=Math.max(bucket.high,b.high);bucket.low=Math.min(bucket.low,b.low);bucket.close=b.close;bucket.volume+=(b.volume||0)}}if(bucket)out.push(bucket);return out};
      const ratio=(a,b)=>{const m1=new Map(a.map(x=>[x.time,x])),m2=new Map(b.map(x=>[x.time,x])),out=[];for(const [time,x1] of m1){const x2=m2.get(time);if(!x2)continue;const open=x1.open/x2.open,close=x1.close/x2.close,high=Math.max(x1.high/x2.low,x1.high/x2.high,x1.open/x2.low,x1.close/x2.low,open,close),low=Math.min(x1.low/x2.high,x1.low/x2.low,x1.open/x2.high,x1.close/x2.high,open,close);out.push({time,open,high,low,close,volume:0})}return out};
      self.onmessage=(e)=>{try{const {id,a,b,tf,adjusted}=e.data;let aa=norm(a),bb=norm(b);if(adjusted){aa=adjust(aa);bb=adjust(bb)}aa=agg(aa,tf);bb=agg(bb,tf);self.postMessage({id,ok:true,bars:ratio(aa,bb)})}catch(err){self.postMessage({id,ok:false,error:String(err&&err.message||err)})}};`;
    const blob=new Blob([workerSource],{type:'application/javascript'});
    state.worker=new Worker(URL.createObjectURL(blob));
    state.worker.onmessage=(e)=>{const p=state.pendingWorker.get(e.data.id);if(!p)return;state.pendingWorker.delete(e.data.id);clearTimeout(p.timer);e.data.ok?p.resolve(e.data.bars):p.reject(new Error(e.data.error||'Worker error'))};
    state.worker.onerror=()=>{for(const p of state.pendingWorker.values()){clearTimeout(p.timer);p.reject(new Error('WORKER_FAILED'))}state.pendingWorker.clear()};
    return state.worker;
  }

  function transformInWorker(rawA,rawB){
    const worker=ensureWorker(); const id=++state.workerSeq;
    return new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>{state.pendingWorker.delete(id);reject(new Error('PROCESS_TIMEOUT'))},WORKER_TIMEOUT);
      state.pendingWorker.set(id,{resolve,reject,timer});
      worker.postMessage({id,a:rawA,b:rawB,tf:state.timeframe,adjusted:state.adjusted});
    });
  }

    try{ views[viewKey()]=state.chart.getVisibleRange?.()||views[viewKey()]||null; }catch{}
    charts[pairKey()]=pair; all.charts=charts; all.views=views; all.version=1; all.savedAt=Date.now();

  function currentVisibleRange(bars){

    const from=bars[bars.length-1].time-state.rangeDays*86400000; const first=bars.find(b=>b.time>=from)||bars[0];

  }

      data:bars,timeframe:state.timeframe,theme:state.theme,timezone:'Asia/Tehran',priceStyle:state.priceStyle,logScale:state.logScale,
      currentPriceLine:true,nativeBackend:'auto',animZoom:true,animPan:true,zoomAnchor:'cursor',axisDrag:true,paneResize:true,keyboard:true,historyChords:true,gridlines:true,axisLabels:true,priceLabel:true,autoScale:true,settings:true,

      const persistEvents=['viewport:changed','drawing:created','drawing:edited','drawing:removed','theme:changed','indicator:added','indicator:removed'];

  async function buildAndRender(reason='manual'){
    if(!state.a||!state.b) throw new Error('دو نماد را انتخاب کنید.');
    if(String(state.a.id)===String(state.b.id)) throw new Error('دو نماد باید متفاوت باشند.');
    clearError(); setLoading(true,'دریافت داده‌های '+state.a.name+' و '+state.b.name+'...');
    try{
      const [rawA,rawB]=await Promise.all([loadRaw(state.a),loadRaw(state.b)]);
      setLoading(true,'پردازش نسبت '+state.a.name+' به '+state.b.name+'...');
      const cacheKey=[state.a.id,state.b.id,state.timeframe,state.adjusted?'A':'R'].join('|');
      let ratio=state.ratioCache.get(cacheKey);
      if(!ratio){
        try{ ratio=await transformInWorker(rawA,rawB); }
        catch{
          const a=aggregate(state.adjusted?adjustedBars(state.a.id,rawA):rawA,state.timeframe); const b=aggregate(state.adjusted?adjustedBars(state.b.id,rawB):rawB,state.timeframe); ratio=buildRatio(a,b);
        }
        state.ratioCache.set(cacheKey,ratio);
      }
      if(ratio.length<2) throw new Error('تقاطع زمانی دو نماد داده کافی ندارد.');
      state.lastRatioBars=ratio;
      await ensureChart(ratio);
      if(state.chart?.renderer?.set) state.chart.renderer.set({priceStyle:state.priceStyle,logScale:state.logScale});
      restoreChartSnapshot();
      updatePairUI(); syncToolbarState(); setStatus(ratio.length.toLocaleString('fa-IR')+' کندل نسبت'); setLoading(false); saveUiOnly(); scheduleSave();
    }catch(e){setLoading(false);showError(e?.message||String(e));setStatus('نیاز به بررسی داده یا مسیر فایل‌ها');throw e}
  }

  $('swapBtn').addEventListener('click',swapSymbols); $('analyzeBtn').addEventListener('click',()=>buildAndRender('manual').catch(()=>{}));
  $('searchInput').addEventListener('input',e=>renderSearch(e.target.value)); $('searchInput').addEventListener('focus',e=>renderSearch(e.target.value));
  $('searchInput').addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();return} if(e.key==='ArrowDown'){e.preventDefault();if(state.searchResults.length){state.searchCursor=Math.min(state.searchCursor+1,state.searchResults.length-1);highlightSearch()}} if(e.key==='ArrowUp'){e.preventDefault();if(state.searchResults.length){state.searchCursor=Math.max(state.searchCursor-1,0);highlightSearch()}} if(e.key==='Enter'){e.preventDefault();const s=state.searchResults[state.searchCursor];if(s)chooseSymbolById(s.id)}});
  $('results').addEventListener('mousedown',e=>e.preventDefault()); $('results').addEventListener('click',e=>{const row=e.target.closest('.result[data-id]');if(row)chooseSymbolById(row.dataset.id)}); document.addEventListener('click',e=>{if(!$('searchBox').contains(e.target))closeSearch()});
  $('timeframe').addEventListener('change',e=>changeTimeframe(e.target.value));
  $('range').addEventListener('change',e=>{state.rangeDays=Number(e.target.value);if(state.chart&&state.lastRatioBars.length){const r=currentVisibleRange(state.lastRatioBars);if(r)state.chart.setVisibleRange?.(r)}saveUiOnly();scheduleSave()});
  $('style').addEventListener('change',e=>{state.priceStyle=e.target.value;applyRendererChange();saveUiOnly()}); $('adjustedBtn').addEventListener('click',()=>changeMode(true)); $('rawBtn').addEventListener('click',()=>changeMode(false));
  $('logBtn').addEventListener('click',()=>{state.logScale=!state.logScale;$('logBtn').classList.toggle('active',state.logScale);applyRendererChange();saveUiOnly()});
  $('themeBtn').addEventListener('click',()=>applyTheme(state.theme==='dark'?'light':'dark'));
  $('saveBtn').addEventListener('click',()=>storeSnapshot('manual')); $('resetBtn').addEventListener('click',resetView); $('shareBtn').addEventListener('click',shareChart); $('shotBtn').addEventListener('click',takeScreenshot); $('fullscreenBtn').addEventListener('click',toggleFullscreen); $('indicatorBtn').addEventListener('click',()=>openModal('indicatorModal')); $('settingsBtn').addEventListener('click',()=>openModal('settingsModal'));
  $('indicatorSearch').addEventListener('input',()=>renderActiveIndicators()); document.querySelectorAll('.modal-close').forEach(b=>b.addEventListener('click',closeModal)); $('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});
  $('resetCurrentBtn').addEventListener('click',()=>{const all=getStored();if(all.charts)delete all.charts[pairKey()];safeStorageSet(all);closeModal();clearChartDrawings();resetView();setSaveState('ذخیره این نمودار پاک شد')});
  $('resetAllBtn').addEventListener('click',()=>{try{localStorage.removeItem(STORAGE_KEY)}catch{};closeModal();setSaveState('همه ذخیره‌ها پاک شد')});
  window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();storeSnapshot('manual')} if(e.key==='Escape'&&!$('modalBackdrop').hidden)closeModal()});
  window.addEventListener('beforeunload',()=>storeSnapshot('unload')); window.addEventListener('resize',()=>state.chart?.resize?.());

  (async function boot(){
    try{
      if(!VELA)throw new Error('Vela بارگذاری نشده است.');
      setLoading(true,'در حال بارگذاری فهرست نمادها...'); const data=await fetchJSON(SYMBOLS_URL); if(!Array.isArray(data)||!data.length)throw new Error('symbols.json خالی یا نامعتبر است.');
      state.symbols=data.filter(s=>s&&s.name!==undefined&&s.id!==undefined).map(s=>({name:String(s.name),id:String(s.id),key:normalizeText(s.name)})); state.symbols.forEach((s,i)=>state.symbolIndex.set(s.id,{...s,index:i}));
      const find=n=>state.symbols.find(s=>s.name===n); state.a=find('فولاد')||state.symbols[0]; state.b=find('فملی')||state.symbols[1]||state.symbols[0];
      applyUrlAndPrefs(); applyTheme(state.theme,false); setStatus(state.symbols.length.toLocaleString('fa-IR')+' نماد آماده'); await buildAndRender('boot');
    }catch(e){setLoading(false);showError(e.message||String(e));setStatus('خطا در راه‌اندازی نمودار')}
  })();
})();
</script>
</body>
</html>
