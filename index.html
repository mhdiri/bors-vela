<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>نسبت‌سنجی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#131722;color:#d1d4dc;font-family:-apple-system,Tahoma,Arial,sans-serif;font-size:12px}
button{background:none;border:none;color:#787b86;cursor:pointer;font-family:inherit;font-size:12px;padding:6px 10px;border-radius:2px}
button:hover{background:rgba(255,255,255,.06);color:#d1d4dc}
button.on{color:#2962FF}
input[type=text]{background:transparent;border:none;color:inherit;outline:none;font-family:inherit;font-size:12px}

.app{display:grid;grid-template-rows:42px 1fr;height:100vh}
.topbar{display:flex;align-items:center;padding:0 6px;background:#131722;border-bottom:1px solid #2a2e39;height:42px;gap:4px;direction:ltr}
.div{width:1px;height:22px;background:#2a2e39;margin:0 4px}

.search-wrap{position:relative;display:flex;align-items:center;background:#2a2e39;border-radius:2px;height:28px;padding:0 8px}
.search-wrap input{width:140px}
.search-results{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#1e222d;border:1px solid #2a2e39;border-radius:2px;max-height:300px;overflow-y:auto;z-index:9999;display:none;direction:rtl}
.search-results.on{display:block}
.search-item{padding:8px 12px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;gap:12px;color:#d1d4dc}
.search-item:hover{background:#2a2e39}

.symbox{display:flex;align-items:center;background:#2a2e39;border-radius:2px;height:28px;padding:0 2px}
.sym-pick{padding:0 10px;height:28px;display:flex;align-items:center;font-weight:600;cursor:pointer;color:#d1d4dc;white-space:nowrap}
.sym-pick:hover{background:rgba(255,255,255,.06)}
.sym-pick.active{outline:1px solid #2962FF}
.symbox .vs{color:#787b86;padding:0 3px}
.symbox .go{background:#2962FF;color:#fff;padding:0 12px;height:22px;font-weight:600;font-size:11px;border-radius:2px;margin-left:2px}
.symbox .go:hover{background:#1e4fd8;color:#fff}

select{background:#2a2e39;border:none;color:#d1d4dc;padding:4px 8px;border-radius:2px;font-family:inherit;font-size:12px;cursor:pointer;outline:none;height:28px}

.main{position:relative;overflow:hidden;background:#131722}
#chartWrap{position:absolute;inset:0;background:#131722}
#chart{width:100%;height:100%}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(19,23,34,.85);color:#aed581;font-size:13px;z-index:200;font-family:monospace}
#load.off{display:none}
#err{position:absolute;bottom:10px;left:10px;right:10px;background:#ef5350;color:#fff;padding:10px 14px;border-radius:3px;font-family:monospace;font-size:12px;z-index:300;display:none}
#err.on{display:block}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="جستجو..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="symbox">
      <div class="sym-pick" id="sym1Pick">—</div>
      <span class="vs">/</span>
      <div class="sym-pick" id="sym2Pick">—</div>
      <button class="go" id="btnAnalyze">تحلیل</button>
    </div>

    <div class="div"></div>

    <select id="tfSelect">
      <option value="1D">روزانه</option>
      <option value="1W" selected>هفتگی</option>
      <option value="1M">ماهانه</option>
    </select>

    <select id="rangeSelect">
      <option value="30">۱ ماه</option>
      <option value="90">۳ ماه</option>
      <option value="180">۶ ماه</option>
      <option value="365">۱ سال</option>
      <option value="1825">۵ سال</option>
      <option value="0" selected>همه</option>
    </select>

    <select id="typeSelect">
      <option value="candles">کندل</option>
      <option value="line">خط</option>
      <option value="area">ناحیه</option>
      <option value="bars">میله‌ای</option>
    </select>
  </div>

  <div class="main">
    <div id="chartWrap"><div id="chart"></div></div>
    <div id="load" class="off">در حال بارگذاری...</div>
    <div id="err"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@luxalgo/vela@latest/dist/vela.global.min.js"></script>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var BASE = 'https://raw.githubusercontent.com/mhdiri/bors-vela/main/';
  var SYMBOLS = [];
  var raw1 = null, raw2 = null;
  var allBars = [], curBars = [];
  var sym1Idx = 0, sym2Idx = 1;
  var curTF = '1W', curRange = 0, chartType = 'candles';
  var velaChart = null;
  var editingSlot = 0;

  function setLoad(msg){
    var el = $('load');
    if(msg === false){ el.classList.add('off'); return; }
    el.classList.remove('off');
    el.textContent = msg || 'در حال بارگذاری...';
  }
  function showErr(msg){
    var e = $('err');
    e.textContent = '❌ ' + msg;
    e.classList.add('on');
    setTimeout(function(){ e.classList.remove('on'); }, 5000);
    console.error(msg);
  }

  // ===== لود لیست نمادها =====
  fetch(BASE + 'data/symbols.json?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(data){
      SYMBOLS = data;
      console.log('[symbols] loaded:', SYMBOLS.length);
      updateSymLabels();
      setTimeout(analyze, 100);
    })
    .catch(function(e){
      showErr('خطا در لیست نمادها: ' + e.message);
    });

  function updateSymLabels(){
    if(SYMBOLS.length){
      $('sym1Pick').textContent = SYMBOLS[sym1Idx] ? SYMBOLS[sym1Idx].name : '—';
      $('sym2Pick').textContent = SYMBOLS[sym2Idx] ? SYMBOLS[sym2Idx].name : '—';
    }
  }

  function aggregate(bars, tf){
    if(!bars.length || tf === '1D') return bars.slice();
    var out = [], bucket = null;
    for(var i = 0; i < bars.length; i++){
      var b = bars[i];
      var d = new Date(b.time);
      var key;
      if(tf === '1W'){
        var day = d.getUTCDay() || 7;
        var mon = new Date(d);
        mon.setUTCDate(d.getUTCDate() - day + 1);
        mon.setUTCHours(0,0,0,0);
        key = mon.getTime();
      } else { key = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1); }
      if(!bucket || bucket.time !== key){
        if(bucket) out.push(bucket);
        bucket = { time: key, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume };
      } else {
        if(b.high > bucket.high) bucket.high = b.high;
        if(b.low < bucket.low) bucket.low = b.low;
        bucket.close = b.close; bucket.volume += b.volume;
      }
    }
    if(bucket) out.push(bucket);
    return out;
  }

  function buildRatio(b1, b2){
    var m1 = {}, m2 = {};
    b1.forEach(function(x){ m1[x.time] = x; });
    b2.forEach(function(x){ m2[x.time] = x; });
    var ts = Object.keys(m1).filter(function(t){ return m2[t]; }).map(Number).sort(function(a,b){ return a-b; });
    var out = [], pc = null;
    ts.forEach(function(t){
      var x1 = m1[t], x2 = m2[t];
      if(!x1 || !x2 || x1.close <= 0 || x2.close <= 0) return;
      var rOpen = pc !== null ? pc : (x1.open / x2.open);
      var rClose = x1.close / x2.close;
      var rHigh = Math.max(x1.high/x2.low, x1.high/x2.close, x1.close/x2.low, rOpen, rClose);
      var rLow = Math.min(x1.low/x2.high, x1.low/x2.close, x1.close/x2.high, rOpen, rClose);
      out.push({ time: t, open: rOpen, high: rHigh, low: rLow, close: rClose, volume: 0 });
      pc = rClose;
    });
    return out;
  }

  function renderVela(){
    try {
      if(velaChart){
        try { if(velaChart.destroy) velaChart.destroy(); else if(velaChart.dispose) velaChart.dispose(); } catch(e){}
        velaChart = null;
      }
      var wrap = $('chartWrap');
      wrap.innerHTML = '<div id="chart"></div>';

      if(typeof window.Vela === 'undefined'){ showErr('Vela لود نشد'); return; }
      var VC = window.Vela.Vela || window.Vela;

      velaChart = new VC('#chart', {
        data: curBars,
        theme: 'dark',
        priceStyle: chartType
      });
    } catch(e){
      console.error('Vela error:', e);
      showErr('خطا: ' + e.message);
    }
  }

  function analyze(){
    if(!SYMBOLS.length){ showErr('لیست نمادها آماده نیست'); return; }
    setLoad('دریافت داده...');
    Promise.all([
      fetch(BASE + SYMBOLS[sym1Idx].file + '?v=' + Date.now()).then(function(r){ return r.json(); }),
      fetch(BASE + SYMBOLS[sym2Idx].file + '?v=' + Date.now()).then(function(r){ return r.json(); })
    ]).then(function(res){
      raw1 = res[0]; raw2 = res[1];
      var a1 = aggregate(raw1, curTF), a2 = aggregate(raw2, curTF);
      allBars = buildRatio(a1, a2);
      if(!allBars.length){ showErr('داده کافی نیست'); setLoad(false); return; }
      applyRange();
      setTimeout(function(){
        renderVela();
        setLoad(false);
      }, 50);
    }).catch(function(e){
      showErr('خطا: ' + e.message);
      setLoad(false);
    });
  }

  function applyRange(){
    if(!allBars.length){ curBars = []; return; }
    if(curRange === 0){ curBars = allBars.slice(); return; }
    var lastT = allBars[allBars.length-1].time;
    curBars = allBars.filter(function(b){ return b.time >= lastT - curRange*86400000; });
  }

  // ===== جستجو =====
  var sInput = $('searchInput');
  var sResults = $('searchResults');

  sInput.addEventListener('input', function(){
    var q = this.value.trim();
    if(!q){ sResults.classList.remove('on'); sResults.innerHTML = ''; return; }
    if(!SYMBOLS.length){ 
      sResults.innerHTML = '<div class="search-item">در حال بارگذاری نمادها...</div>';
      sResults.classList.add('on');
      return;
    }
    var matches = SYMBOLS.filter(function(s){ return s.name.indexOf(q) > -1; }).slice(0, 20);
    if(!matches.length){
      sResults.innerHTML = '<div class="search-item">یافت نشد</div>';
      sResults.classList.add('on');
      return;
    }
    sResults.innerHTML = matches.map(function(s){
      var idx = SYMBOLS.findIndex(function(x){ return x.name === s.name; });
      return '<div class="search-item" data-idx="' + idx + '"><span>' + s.name + '</span></div>';
    }).join('');
    sResults.classList.add('on');
  });

  sResults.addEventListener('mousedown', function(e){ e.preventDefault(); });

  sResults.addEventListener('click', function(e){
    var item = e.target.closest('.search-item[data-idx]');
    if(!item) return;
    var idx = +item.dataset.idx;
    if(editingSlot === 1) sym1Idx = idx;
    else if(editingSlot === 2) sym2Idx = idx;
    else sym1Idx = idx;
    updateSymLabels();
    editingSlot = 0;
    $('sym1Pick').classList.remove('active');
    $('sym2Pick').classList.remove('active');
    sInput.value = '';
    sResults.classList.remove('on');
    sInput.blur();
    analyze();
  });

  sInput.addEventListener('blur', function(){
    setTimeout(function(){
      sResults.classList.remove('on');
      editingSlot = 0;
      $('sym1Pick').classList.remove('active');
      $('sym2Pick').classList.remove('active');
    }, 200);
  });

  $('sym1Pick').addEventListener('click', function(){
    editingSlot = 1;
    $('sym1Pick').classList.add('active');
    $('sym2Pick').classList.remove('active');
    sInput.placeholder = 'جستجوی نماد ۱...';
    sInput.focus();
  });
  $('sym2Pick').addEventListener('click', function(){
    editingSlot = 2;
    $('sym2Pick').classList.add('active');
    $('sym1Pick').classList.remove('active');
    sInput.placeholder = 'جستجوی نماد ۲...';
    sInput.focus();
  });

  // ===== رویدادها =====
  $('btnAnalyze').addEventListener('click', analyze);

  $('tfSelect').addEventListener('change', function(){
    curTF = this.value;
    if(!raw1) return;
    var a1 = aggregate(raw1, curTF), a2 = aggregate(raw2, curTF);
    allBars = buildRatio(a1, a2);
    applyRange(); renderVela();
  });

  $('rangeSelect').addEventListener('change', function(){
    curRange = +this.value;
    if(!allBars.length) return;
    applyRange(); renderVela();
  });

  $('typeSelect').addEventListener('change', function(){
    chartType = this.value;
    if(allBars.length) renderVela();
  });

})();
</script>
</body>
</html>
