<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131722">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<title>MHDI Ratio V20 — Vela Workspace</title>
<style>
:root{color-scheme:dark;--bg:#131722;--panel:#1e222d;--border:#2a2e39;--text:#d1d4dc;--muted:#787b86;--accent:#2962ff;--danger:#ef5350}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;font-size:12px}
body{touch-action:none;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:3px}
button:hover{background:rgba(255,255,255,.06);color:var(--text)}
button.active{background:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
input{outline:none}
.app{height:100vh;display:grid;grid-template-rows:42px 1fr;background:var(--bg)}
.app.toolbar-mounted{grid-template-rows:1fr}.app.toolbar-mounted .hostbar{display:none}
.hostbar{height:42px;display:flex;align-items:center;gap:5px;padding:0 7px;border-bottom:1px solid var(--border);background:var(--bg);direction:ltr;white-space:nowrap;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;z-index:32000}
.hostbar::-webkit-scrollbar{display:none}
.mdhi-controls{display:flex;align-items:center;gap:5px;min-width:0;max-width:100%;flex:0 1 auto;white-space:nowrap;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none;direction:ltr}
.mdhi-controls::-webkit-scrollbar{display:none}
.mdhi-controls.mounted{max-width:min(76vw,980px);flex:0 1 auto;padding:1px 4px;overflow-x:auto;border-radius:3px}
#pairMeta{position:absolute;top:47px;left:54px;right:auto;z-index:11900;max-width:min(520px,calc(100% - 120px));padding:4px 7px;border-radius:3px;background:rgba(19,23,34,.58);border:1px solid rgba(255,255,255,.04);pointer-events:none;direction:rtl;color:#a8adb8;font-size:10px;backdrop-filter:blur(4px);user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:760px){.mdhi-controls.mounted{max-width:calc(100vw - 150px);gap:4px;padding:0 2px}#pairMeta{left:48px;top:46px;max-width:calc(100% - 95px)}}
.separator{width:1px;height:24px;background:var(--border);margin:0 3px;flex:0 0 auto}
.brand{font-weight:800;color:#fff;letter-spacing:.5px;padding:5px 7px;flex:0 0 auto;user-select:none}
.search{position:relative;width:170px;height:30px;display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:3px;flex:0 0 auto}
.search:focus-within{border-color:#3f6cff;box-shadow:0 0 0 1px rgba(41,98,255,.18)}
.search input{width:100%;height:100%;padding:0 10px;background:transparent;border:0;color:var(--text);direction:rtl}
.search input::placeholder{color:#5f636d}
.results{position:fixed;display:none;max-height:min(56vh,420px);overflow:auto;background:#1e222d;border:1px solid var(--border);border-radius:4px;z-index:50000;direction:rtl;box-shadow:0 12px 30px rgba(0,0,0,.48);overscroll-behavior:contain}
.results.open{display:block}
.result{min-height:36px;padding:8px 11px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04)}
.result:last-child{border-bottom:0}.result:hover,.result.selected{background:#2a2e39}.result .name{font-weight:700;color:#e6e8eb;overflow:hidden;text-overflow:ellipsis}.result .code{font-size:10px;color:var(--muted);direction:ltr;flex:0 0 auto}.result.empty{cursor:default;color:var(--muted)}
.pair{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:3px;height:30px;flex:0 0 auto}.pair-slot{min-width:76px;max-width:116px;height:28px;padding:0 9px;display:flex;align-items:center;justify-content:center;color:#e5e7eb;font-weight:700;cursor:pointer;overflow:hidden;text-overflow:ellipsis;direction:rtl}.pair-slot:hover{background:rgba(255,255,255,.05)}.pair-slot.active{background:rgba(41,98,255,.18);outline:1px solid var(--accent)}.pair-sep{color:var(--text);padding:0 4px;font-size:14px;font-weight:800;line-height:1}.go{height:24px;padding:0 11px;background:var(--accent);color:#fff!important;font-weight:700;margin-left:3px}.go:hover{background:#1f55e5}
.control,select{height:30px;padding:0 8px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:3px;cursor:pointer;outline:none}select{direction:rtl}.tool{height:30px;padding:0 9px;flex:0 0 auto}.status{margin-left:auto;flex:0 1 auto;height:30px;display:flex;align-items:center;padding:0 8px;color:var(--muted);direction:rtl;max-width:330px;overflow:hidden;text-overflow:ellipsis;min-width:100px}
.main{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg);direction:ltr}#chartWrap{position:absolute;inset:0;direction:ltr;unicode-bidi:isolate}#chart{width:100%;height:100%;min-width:0;min-height:0;contain:layout paint size;direction:ltr;unicode-bidi:isolate}
#error{position:absolute;left:10px;right:10px;bottom:10px;display:none;padding:10px 12px;border-radius:4px;background:var(--danger);color:#fff;z-index:45000;direction:rtl;white-space:pre-wrap;word-break:break-word;box-shadow:0 8px 20px rgba(0,0,0,.3)}#error.on{display:block}
@media(max-width:1050px){.brand{display:none}.search{width:150px}.status{max-width:220px}.pair-slot{min-width:64px}}
@media(max-width:760px){.hostbar{gap:4px}.status{display:none}.search{width:150px}.tool{padding:0 8px}.pair-slot{min-width:58px;max-width:86px}.control,select,.tool,.pair,.search{height:32px}.pair-slot{height:30px}.go{height:26px}.pair{height:32px}}
</style>
</head>
<body>
<div class="app">
  <div class="hostbar" id="hostbar">
    <div id="hostControls" class="mdhi-controls">
      <div class="brand">MHDI</div>
      <div class="search" id="searchBox">
        <input id="searchInput" type="text" autocomplete="off" spellcheck="false" placeholder="جستجوی نماد..." aria-label="جستجوی نماد">
      </div>
      <div class="pair">
        <button id="slotA" class="pair-slot active" title="انتخاب نماد اول">—</button>
        <span class="pair-sep">به</span>
        <button id="slotB" class="pair-slot" title="انتخاب نماد دوم">—</button>
        <button id="swapBtn" class="control" title="جابه‌جایی دو نماد">⇄</button>
        <button id="analyzeBtn" class="go" title="نمایش نسبت">تحلیل</button>
      </div>
      <div class="separator"></div>
      <select id="timeframe" title="تایم‌فریم">
        <option value="1D">روزانه</option>
        <option value="1W" selected>هفتگی</option>
        <option value="1M">ماهانه</option>
      </select>
      <button id="customTfBtn" class="tool" title="افزودن تایم‌فریم سفارشی بالاتر از روزانه">بازه دلخواه</button>
      <button id="adjustedBtn" class="tool" title="نمایش عملکردی؛ داده RAW تغییر نمی‌کند">عملکردی</button>
      <button id="rawBtn" class="tool active" title="نمایش داده خام">خام</button>
      <button id="fullscreenBtn" class="tool" title="تمام صفحه">⛶</button>
      <button id="themeBtn" class="tool" title="تغییر تم روشن / مشکی">تم: مشکی</button>
      <div id="status" class="status"></div>
    </div>
  </div>
  <main class="main">
    <div id="chartWrap"><div id="chart"></div></div>
    <div id="pairMeta">—</div>
    <div id="error" role="alert" aria-live="polite"></div>
  </main>
</div>
<div id="results" class="results" role="listbox" aria-label="نتایج جستجو"></div>

<script type="module">
(async () => {
  'use strict';
  let VelaWorkspace = null;
  let velaImportTimer = null;
  try{
    const importPromise = import('https://cdn.jsdelivr.net/npm/@luxalgo/vela@0.8.3/workspace/+esm');
    const importTimeout = new Promise((_, reject) => {
      velaImportTimer = setTimeout(() => reject(new Error('بارگذاری کتابخانه نمودار بیش از ۲۰ ثانیه طول کشید. اتصال اینترنت یا CDN را بررسی کنید.')), 20000);
    });
    ({VelaWorkspace} = await Promise.race([importPromise, importTimeout]));
  }catch(e){
    const box=document.getElementById('error');
    if(box){ box.textContent='خطا: ' + String(e?.message || 'کتابخانه Vela Workspace بارگذاری نشد. اتصال اینترنت یا CDN را بررسی کنید.'); box.classList.add('on'); }
    console.error(e);
    return;
  }finally{
    if(velaImportTimer) clearTimeout(velaImportTimer);
  }


  const $ = (id) => document.getElementById(id);
  const BASE = '/';
  const SYMBOLS_URL = BASE + 'data/symbols.json';
  const VERSION_URL = BASE + 'data/version.json';
  const STORAGE_KEY = 'MHDI_RATIO_STATE_V2';
  const STYLE_VALUES = new Set(['candles','bars','line','area','baseline']);
  const CHART_STORAGE_PREFIX = 'MHDI_RATIO_CHART_V2|';
  const DATA_FETCH_TIMEOUT_MS = 20000;
  const DATA_WORKER_TIMEOUT_MS = 35000;
  const CHART_OPERATION_TIMEOUT_MS = 45000;

  function withTimeout(promise, ms, message){
    let timer;
    const timeout = new Promise((_, reject) => { timer = setTimeout(() => reject(Object.assign(new Error(message),{code:'OPERATION_TIMEOUT'})), ms); });
    return Promise.race([Promise.resolve(promise), timeout]).finally(() => clearTimeout(timer));
  }

  const state = {
    symbols: [],
    symbolIndex: new Map(),
    targetSlot: 'A',
    a: null,
    b: null,
    timeframe: '1W',
    priceStyle: 'candles',
    adjusted: false,
    logScale: false,
    theme: 'dark',
    dataVersion: '',
    rawCache: new Map(),
    adjustedCache: new Map(),
    ratioCache: new Map(),
    chart: null,
    workspace: null,
    searchResults: [],
    searchCursor: -1,
    buildSerial: 0,
    lastRatioBars: [],
    lastRenderedKey: '',
    searchOpen: false,
    activeChartKey: '',
    defaultRendererConfig: null,
    defaultWorkspaceChart: null,
    isRestoring: false,
    controlsObserver: null,
    wheelAttached: false
  };

  function invalidateWorkspaceAfterTimeout(){
    try{state.controlsObserver?.disconnect?.();}catch(e){}
    state.controlsObserver = null;
    const root=$('chart'), controls=$('hostControls'), hostbar=$('hostbar'), app=document.querySelector('.app');
    if(root && controls && controls.isConnected && root.contains(controls) && hostbar) hostbar.appendChild(controls);
    controls?.classList?.remove('mounted');
    if(controls) controls.style.maxWidth='';
    app?.classList?.remove('toolbar-mounted');
    try{state.workspace?.destroy?.();}catch(e){}
    try{root?.replaceChildren?.();}catch(e){}
    state.workspace = null;
    state.chart = null;
    state.defaultRendererConfig = null;
    state.defaultWorkspaceChart = null;
  }

  function withChartTimeout(promise, message){
    return withTimeout(promise,CHART_OPERATION_TIMEOUT_MS,message).catch(error=>{
      if(error?.code==='OPERATION_TIMEOUT') invalidateWorkspaceAfterTimeout();
      throw error;
    });
  }

  // ------------------------------------------------------------
  // DATA WORKER: keeps JSON parsing, adjustment, aggregation and
  // ratio construction off the main UI thread so the chart stays responsive.
  // ------------------------------------------------------------
  let dataWorker = null;
  let dataWorkerURL = '';
  let dataWorkerRequest = 0;
  const dataWorkerPending = new Map();

  function ensureDataWorker(){
    if(dataWorker) return dataWorker;
    if(!window.Worker || !window.Blob || !window.URL?.createObjectURL) return null;

    const source = `
      'use strict';
      const rawCache = new Map();
      const adjustedCache = new Map();
      const aggregateCache = new Map();
      const ratioCache = new Map();
      let activeController = null;

      function num(v){
        const n = Number(v);
        return Number.isFinite(n) ? n : null;
      }
      function epoch(v){
        if(typeof v === 'number' && Number.isFinite(v)) return v < 100000000000 ? v * 1000 : v;
        if(typeof v === 'string'){
          const n = Number(v);
          if(Number.isFinite(n)) return n < 100000000000 ? n * 1000 : n;
          const t = Date.parse(v);
          return Number.isFinite(t) ? t : null;
        }
        return null;
      }
      function normalize(data){
        if(!Array.isArray(data)) throw new Error('ساختار فایل RAW معتبر نیست.');
        const map = new Map();
        for(const row of data){
          if(!row || typeof row !== 'object') continue;
          const time = epoch(row.time ?? row.timestamp ?? row.t ?? row.date);
          const open = num(row.open), high = num(row.high), low = num(row.low), close = num(row.close);
          const volume = num(row.volume) ?? 0;
          if(time===null || open===null || high===null || low===null || close===null) continue;
          if(![open,high,low,close].every(x=>Number.isFinite(x) && x>0)) continue;
          if(high < low || high < open || high < close || low > open || low > close) continue;
          map.set(time,{time,open,high,low,close,volume:Number.isFinite(volume)&&volume>=0?volume:0});
        }
        const bars=[...map.values()].sort((a,b)=>a.time-b.time);
        if(bars.length<2) throw new Error('داده قابل استفاده کافی نیست.');
        return bars;
      }
      function parseBuffer(buffer){
        let data;
        try{
          const text=new TextDecoder('utf-8').decode(new Uint8Array(buffer));
          data=JSON.parse(text);
        }catch(e){
          throw new Error('پاسخ JSON نامعتبر است.');
        }
        return normalize(data);
      }
      function findGaps(bars){
        const gaps=[];
        for(let i=1;i<bars.length;i++){
          const prev=bars[i-1].close, curr=bars[i].close;
          if(prev>0 && curr>0){const ratio=curr/prev;if(ratio>1.4 || ratio<0.7) gaps.push({idx:i,ratio});}
        }
        return gaps;
      }
      function adjusted(id,bars){
        if(adjustedCache.has(id)) return adjustedCache.get(id);
        const out=bars.map((b)=>({...b}));
        for(let pass=0;pass<8;pass++){
          const gaps=findGaps(out); if(!gaps.length) break;
          for(let i=gaps.length-1;i>=0;i--){
            const {idx,ratio}=gaps[i];
            for(let j=0;j<idx;j++){out[j].open*=ratio;out[j].high*=ratio;out[j].low*=ratio;out[j].close*=ratio;}
          }
        }
        adjustedCache.set(id,out); return out;
      }
      function aggregate(bars,tf){
        const match=/^([0-9]{1,2})(D|W|M)$/.exec(String(tf||''));
        if(!match) throw new Error('تایم‌فریم معتبر نیست: '+tf);
        const count=Number(match[1]), unit=match[2];
        if(unit==='D' && count===1) return bars;
        const out=[];let bucket=null;const DAY=86400000;const anchorSaturday=Date.UTC(1970,0,3);
        for(const b of bars){
          const d=new Date(b.time);let key;
          if(unit==='D'){
            const day=Math.floor(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())/DAY);
            const anchorDay=Math.floor(anchorSaturday/DAY);
            key=(anchorDay+Math.floor((day-anchorDay)/count)*count)*DAY;
          }else if(unit==='W'){
            const offset=(d.getUTCDay()+1)%7;
            const weekStart=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-offset);
            const width=count*7*DAY;
            key=anchorSaturday+Math.floor((weekStart-anchorSaturday)/width)*width;
          }else{
            const monthIndex=(d.getUTCFullYear()-1970)*12+d.getUTCMonth();
            const groupIndex=Math.floor(monthIndex/count)*count;
            key=Date.UTC(1970+Math.floor(groupIndex/12),((groupIndex%12)+12)%12,1);
          }
          if(!bucket || bucket.time!==key){if(bucket)out.push(bucket);bucket={time:key,open:b.open,high:b.high,low:b.low,close:b.close,volume:b.volume||0};}
          else{if(b.high>bucket.high)bucket.high=b.high;if(b.low<bucket.low)bucket.low=b.low;bucket.close=b.close;bucket.volume+=b.volume||0;}
        }
        if(bucket)out.push(bucket);return out;
      }
      function ratio(a,b,key){
        if(ratioCache.has(key)) return ratioCache.get(key);
        const right=new Map(b.map((x)=>[x.time,x]));const out=[];
        for(const x1 of a){
          const x2=right.get(x1.time);if(!x2)continue;
          if([x1.open,x1.high,x1.low,x1.close,x2.open,x2.high,x2.low,x2.close].some((v)=>!Number.isFinite(v)||v<=0))continue;
          const open=x1.open/x2.open, close=x1.close/x2.close;
          const high=Math.max(x1.high/x2.low,x1.high/x2.close,x1.close/x2.low,open,close);
          const low=Math.min(x1.low/x2.high,x1.low/x2.close,x1.close/x2.high,open,close);
          if(!(high>0)||!(low>0)||!Number.isFinite(high)||!Number.isFinite(low))continue;
          out.push({time:x1.time,open,high,low,close,volume:0});
        }
        ratioCache.set(key,out);return out;
      }
      function processBuffers(bufferA,bufferB,m){
        const a=parseBuffer(bufferA);
        const b=parseBuffer(bufferB);
        const wa=m.adjusted?adjusted(m.idA,a):a;
        const wb=m.adjusted?adjusted(m.idB,b):b;
        const aa=aggregate(wa,m.timeframe);
        const bb=aggregate(wb,m.timeframe);
        const key=[m.idA,m.idB,m.timeframe,m.adjusted?'A':'R',m.version||''].join('|');
        return ratio(aa,bb,key);
      }
      self.onmessage=async(e)=>{
        const m=e.data||{};
        if(m.type==='cancel'){
          try{activeController?.abort();}catch(_e){}
          return;
        }
        if(m.type!=='build') return;
        try{activeController?.abort();}catch(_e){}
        const controller=new AbortController();
        activeController=controller;
        try{
          self.postMessage({type:'progress',request:m.request,stage:'PARSE'});
          if(controller.signal.aborted) return;
          const out=processBuffers(m.bufferA,m.bufferB,m);
          if(controller.signal.aborted) return;
          self.postMessage({type:'result',request:m.request,data:out});
        }catch(error){
          if(controller.signal.aborted) return;
          self.postMessage({type:'error',request:m.request,message:String(error?.message||error||'خطای Worker')});
        }
      };
    `;
    try{
      const blob = new Blob([source], {type:'application/javascript'});
      dataWorkerURL = URL.createObjectURL(blob);
      dataWorker = new Worker(dataWorkerURL);
    }catch(error){
      if(dataWorkerURL){ try{URL.revokeObjectURL(dataWorkerURL);}catch(_e){} dataWorkerURL=''; }
      dataWorker = null;
      throw error;
    }
    const workerInstance = dataWorker;
    workerInstance.onmessage = (event) => {
      if(dataWorker !== workerInstance) return;
      const msg = event.data || {};
      const pending = dataWorkerPending.get(msg.request);
      if(!pending) return;
      if(msg.type === 'progress') return;
      if(msg.type === 'error'){
        dataWorkerPending.delete(msg.request);
        pending.reject(new Error(msg.message || 'خطا در پردازش Worker داده.'));
        return;
      }
      if(msg.type !== 'result') return;
      dataWorkerPending.delete(msg.request);
      pending.resolve(msg.data);
    };
    workerInstance.onerror = (event) => {
      if(dataWorker !== workerInstance) return;
      for(const [id,pending] of dataWorkerPending){
        dataWorkerPending.delete(id);
        pending.reject(new Error(event?.message || 'خطا در پردازش Worker داده.'));
      }
      try{workerInstance.terminate();}catch(e){}
      if(dataWorker === workerInstance) dataWorker = null;
      if(dataWorkerURL){ try{URL.revokeObjectURL(dataWorkerURL);}catch(e){} dataWorkerURL=''; }
    };
    return dataWorker;
  }

  let activeFetchController = null;

  async function fetchBuffer(url, signal=null){
    const controller = new AbortController();
    let timer = null;
    const relay = () => controller.abort();
    if(signal){
      if(signal.aborted) controller.abort();
      else signal.addEventListener('abort', relay, {once:true});
    }
    try{
      timer=setTimeout(()=>controller.abort(),DATA_FETCH_TIMEOUT_MS);
      let response;
      try{
        response=await fetch(url,{cache:'default',signal:controller.signal});
        if(!response.ok) throw new Error('HTTP ' + response.status + ' — ' + url);
        return await response.arrayBuffer();
      }catch(e){
        if(controller.signal.aborted && !signal?.aborted) throw new Error('TIMEOUT: دریافت داده بیش از ۲۰ ثانیه طول کشید.');
        throw e;
      }
    }finally{
      if(timer) clearTimeout(timer);
      signal?.removeEventListener('abort',relay);
    }
  }

  function workerBuildRatio(a,b,timeframe,adjusted,version){
    let worker;
    try{worker=ensureDataWorker();}
    catch(error){console.warn('Worker is unavailable; using safe fallback.',error);return null;}
    if(!worker) return null;
    const request=++dataWorkerRequest;
    const addVersion=(url)=>version ? url + (url.includes('?')?'&':'?') + 'v=' + encodeURIComponent(version) : url;

    if(dataWorkerPending.size){
      if(activeFetchController){try{activeFetchController.abort();}catch(e){}}
      for(const [id,p] of dataWorkerPending){
        dataWorkerPending.delete(id);
        p.reject(Object.assign(new Error('درخواست قبلی جایگزین شد.'),{name:'AbortError'}));
      }
      try{worker.terminate();}catch(e){}
      if(dataWorker===worker) dataWorker=null;
      if(dataWorkerURL){try{URL.revokeObjectURL(dataWorkerURL);}catch(e){} dataWorkerURL='';}
      try{worker=ensureDataWorker();}
      catch(error){console.warn('Worker restart failed; using safe fallback.',error);return null;}
      if(!worker) return null;
    }

    activeFetchController=new AbortController();
    const fetchSignal=activeFetchController.signal;

    return new Promise((resolve,reject)=>{
      const timeout=setTimeout(()=>{
        const pending=dataWorkerPending.get(request);
        if(!pending) return;
        dataWorkerPending.delete(request);
        if(activeFetchController?.signal===fetchSignal){try{activeFetchController.abort();}catch(e){} activeFetchController=null;}
        const error=Object.assign(new Error('پردازش داده بیش از ۳۵ ثانیه طول کشید؛ برای جلوگیری از هنگ‌کردن، عملیات متوقف شد. صفحه را تازه‌سازی کنید و دوباره تلاش کنید.'),{code:'WORKER_TIMEOUT'});
        pending.reject(error);
        try{worker.terminate();}catch(e){}
        if(dataWorker===worker) dataWorker=null;
        if(dataWorkerURL){try{URL.revokeObjectURL(dataWorkerURL);}catch(e){} dataWorkerURL='';}
      },DATA_WORKER_TIMEOUT_MS);
      dataWorkerPending.set(request,{
        resolve(value){clearTimeout(timeout);resolve(value);},
        reject(error){clearTimeout(timeout);reject(error);}
      });
      (async()=>{
        try{
          const [bufferA,bufferB]=await Promise.all([
            fetchBuffer(addVersion(BASE+'data/raw/'+encodeURIComponent(a.id)+'.json'),fetchSignal),
            fetchBuffer(addVersion(BASE+'data/raw/'+encodeURIComponent(b.id)+'.json'),fetchSignal)
          ]);
          if(fetchSignal.aborted || !dataWorkerPending.has(request)) return;
          worker.postMessage({type:'build',request,bufferA,bufferB,idA:String(a.id),idB:String(b.id),timeframe,adjusted,version:version||''},[bufferA,bufferB]);
        }catch(e){
          if(e?.name==='AbortError' || fetchSignal.aborted) {
            if(dataWorkerPending.has(request)){const pending=dataWorkerPending.get(request);dataWorkerPending.delete(request);pending.reject(Object.assign(new Error('درخواست لغو شد.'),{name:'AbortError'}));}
            return;
          }
          if(dataWorkerPending.has(request)){const pending=dataWorkerPending.get(request);dataWorkerPending.delete(request);pending.reject(e);}
        }finally{
          if(activeFetchController?.signal===fetchSignal) activeFetchController=null;
        }
      })();
    });
  }

  async function loadRatioData(a,b,timeframe,adjusted,version){
    const fast=workerBuildRatio(a,b,timeframe,adjusted,version);
    if(fast) return await fast;
    // Main-thread fallback is used only where Web Workers are unavailable/blocked.
    const [rawA,rawB]=await Promise.all([loadRaw(a),loadRaw(b)]);
    const barsA=aggregate(getWorkingBars(a,rawA),timeframe);
    const barsB=aggregate(getWorkingBars(b,rawB),timeframe);
    return buildRatio(barsA,barsB);
  }
  function setStatus(text){ const node=$('status'); if(node) node.textContent = text || ''; }

  function clearError(){
    $('error').textContent = '';
    $('error').classList.remove('on');
  }

  function showError(message){
    const safe = String(message || 'خطای نامشخص');
    $('error').textContent = 'خطا: ' + safe;
    $('error').classList.add('on');
    console.error(safe);
  }

  function normalizeText(value){
    return String(value ?? '')
      .replace(/[يى]/g, 'ی')
      .replace(/ك/g, 'ک')
      .replace(/ۀ/g, 'ه')
      .replace(/[\u0660-\u0669]/g, (d) => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))
      .replace(/[۰-۹]/g, (d) => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))
      .replace(/[\u200c\u200f\u200e]/g, '')
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  }

  function toNumber(v){
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  function toEpochMs(v){
    if(typeof v === 'number' && Number.isFinite(v)) return v < 100000000000 ? v * 1000 : v;
    if(typeof v === 'string'){
      const numeric = Number(v);
      if(Number.isFinite(numeric)) return numeric < 100000000000 ? numeric * 1000 : numeric;
      const parsed = Date.parse(v);
      if(Number.isFinite(parsed)) return parsed;
    }
    return null;
  }

  function escapeHTML(value){
    return String(value).replace(/[&<>'"]/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'
    }[c]));
  }

  function symbolSearchText(s){
    return [s.name,s.symbol,s.ticker,s.code,s.shortName,s.key].filter(Boolean).join(' ');
  }

  function buildSymbolRecord(s){
    const name = String(s.name ?? s.title ?? s.label ?? '').trim();
    const id = String(s.id ?? s.instrumentId ?? s.code ?? '').trim();
    const ticker = String(s.symbol ?? s.ticker ?? s.shortName ?? '').trim();
    return {
      name: name || id,
      id,
      symbol: ticker,
      ticker,
      code: String(s.code ?? id),
      key: normalizeText(name),
      searchKey: normalizeText(symbolSearchText({name,id,symbol:ticker,ticker,code:String(s.code ?? id)}))
    };
  }

  function validateBars(data){
    if(!Array.isArray(data)) throw new Error('ساختار فایل داده معتبر نیست.');
    const map = new Map();
    for(const row of data){
      if(!row || typeof row !== 'object') continue;
      const time = toEpochMs(row.time ?? row.timestamp ?? row.t ?? row.date);
      const open = toNumber(row.open);
      const high = toNumber(row.high);
      const low = toNumber(row.low);
      const close = toNumber(row.close);
      const volume = toNumber(row.volume) ?? 0;
      if(time === null || open === null || high === null || low === null || close === null) continue;
      if(![open,high,low,close].every((n) => Number.isFinite(n) && n > 0)) continue;
      if(high < low || high < open || high < close || low > open || low > close) continue;
      map.set(time, { time, open, high, low, close, volume:Number.isFinite(volume) && volume >= 0 ? volume : 0 });
    }
    const bars = [...map.values()].sort((a,b) => a.time - b.time);
    if(bars.length < 2) throw new Error('داده قابل استفاده کافی نیست.');
    return bars;
  }

  async function fetchJSON(url, options={}){
    const controller = new AbortController();
    const externalSignal = options.signal;
    let timer = null;
    const onAbort = () => controller.abort();
    if(externalSignal){
      if(externalSignal.aborted) controller.abort();
      else externalSignal.addEventListener('abort', onAbort, {once:true});
    }
    try{
      timer = setTimeout(() => controller.abort(), DATA_FETCH_TIMEOUT_MS);
      const fetchOptions = {...options, cache:options.cache ?? 'default', signal:controller.signal};
      let response;
      try{
        response = await fetch(url, fetchOptions);
      }catch(e){
        if(controller.signal.aborted && !(externalSignal?.aborted)) throw new Error('TIMEOUT: دریافت داده بیش از ۲۰ ثانیه طول کشید.');
        throw e;
      }
      if(!response.ok) throw new Error('HTTP ' + response.status + ' — ' + url);
      try{return await response.json();}
      catch(e){
        if(controller.signal.aborted && !(externalSignal?.aborted)) throw new Error('TIMEOUT: دریافت داده بیش از ۲۰ ثانیه طول کشید.');
        if(e instanceof SyntaxError) throw new Error('پاسخ JSON نامعتبر است.');
        throw e;
      }
    } finally {
      if(timer) clearTimeout(timer);
      externalSignal?.removeEventListener('abort', onAbort);
    }
  }

  async function loadDataVersion(){

  async function loadSymbols(){
    const data = await fetchJSON(SYMBOLS_URL);

    state.symbols = data
      .map(buildSymbolRecord)

    if(state.symbols.length < 2) throw new Error('حداقل دو نماد برای نسبت لازم است.');

  function parseTimeframe(value){
    const tf = String(value || '').trim().toUpperCase();
    const match = /^(\d{1,2})(D|W|M)$/.exec(tf);
    if(!match) return null;
    const count = Number(match[1]);
    if(!Number.isInteger(count) || count < 1 || count > 99) return null;
    if(match[2] === 'D' && count === 1) return {count,unit:'D',value:tf};
    if((match[2] === 'W' || match[2] === 'M') && count === 1) return {count,unit:match[2],value:tf};
    if(count < 2) return null;
    return {count,unit:match[2],value:tf};
  }

  function isValidTimeframe(value){ return !!parseTimeframe(value); }

  function timeframeLabel(value){
    const parsed = parseTimeframe(value);
    if(!parsed) return String(value || '');
    if(value === '1D') return 'روزانه';
    if(value === '1W') return 'هفتگی';
    if(value === '1M') return 'ماهانه';
    const n = parsed.count.toLocaleString('fa-IR');
    if(parsed.unit === 'D') return n + ' روزه';
    if(parsed.unit === 'W') return n + ' هفته';
    return n + ' ماهه';
  }

  function syncTimeframeControl(){
    const select = $('timeframe');
    if(!select) return;
    const value = state.timeframe;
    let option = [...select.options].find((item)=>item.value===value);
    if(!option){
      option = document.createElement('option');
      option.value = value;
      option.textContent = 'دلخواه: ' + timeframeLabel(value);
      select.appendChild(option);
    }
    select.value = value;
  }

  function chartStorageKey(a=state.a,b=state.b,tf=state.timeframe,adjusted=state.adjusted){

  function readSavedState(){
    let saved = {};
    try{saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {};}catch(e){}

    const params = new URLSearchParams(location.search);
    const aId = params.get('a') || saved.a;
    const bId = params.get('b') || saved.b;
    const tf = params.get('tf') || saved.tf;
    const style = params.get('style') || saved.style;
    const mode = params.get('mode') || saved.mode;
    const log = params.get('log');
    const theme = params.get('theme');

    const byId = (id) => id ? state.symbolIndex.get(String(id)) : null;
    const first = state.symbols.find((s) => s.name === 'فولاد') || state.symbols[0];
    const second = state.symbols.find((s) => s.name === 'فملی') || state.symbols.find((s) => s.id !== first?.id) || state.symbols[1];

    state.a = byId(aId) || first;
    state.b = byId(bId) || second;
    if(state.a?.id === state.b?.id) state.b = state.symbols.find((s) => s.id !== state.a.id) || second;

    if(isValidTimeframe(tf)) state.timeframe = tf;
    if(STYLE_VALUES.has(style)) state.priceStyle = style;
    if(mode === 'adjusted' || mode === 'raw') state.adjusted = mode === 'adjusted';
    if(log === '1' || log === '0') state.logScale = log === '1';
    else if(typeof saved.log === 'boolean') state.logScale = saved.log;
    if(theme === 'light' || theme === 'dark') state.theme = theme;
    else if(saved.theme === 'light' || saved.theme === 'dark') state.theme = saved.theme;

    syncControls();
    syncThemeButton();
  }

  function formatValue(value){
    if(!Number.isFinite(value)) return '—';
    const abs = Math.abs(value);
    if(abs >= 1000) return value.toLocaleString('en-US',{maximumFractionDigits:2});
    if(abs >= 1) return value.toLocaleString('en-US',{maximumFractionDigits:4});
    return value.toLocaleString('en-US',{maximumFractionDigits:8});
  }

  function renderSearch(query){
    const q = normalizeText(query);
    let matches;
    if(!q){
      matches = state.symbols.slice(0,24);
    }else{
      matches = state.symbols
        .map((s) => {
          const name = s.key;
          const full = s.searchKey;
          const exact = normalizeText(s.name) === q || normalizeText(s.ticker) === q || normalizeText(s.id) === q;
          const starts = name.startsWith(q) || full.startsWith(q);
          const includes = full.includes(q);
          return {s,score:exact?0:(starts?1:(includes?2:99))};
        })
        .filter((x) => x.score < 99)
        .sort((a,b) => a.score - b.score || a.s.name.localeCompare(b.s.name,'fa'))
        .slice(0,40)
        .map((x) => x.s);
    }

    state.searchResults = matches;
    state.searchCursor = matches.length ? 0 : -1;
    const box = $('results');
    if(!matches.length){
      box.innerHTML = '<div class="result empty"><span class="name">نمادی با این مشخصات پیدا نشد</span></div>';
      box.classList.add('open');
      positionResults();
      return;
    }

    box.innerHTML = matches.map((s,i) =>
      '<div class="result' + (i===0?' selected':'') + '" role="option" aria-selected="' + (i===0?'true':'false') + '" data-id="' + escapeHTML(s.id) + '" data-i="' + i + '">' +
      '<span class="name">' + escapeHTML(s.name) + '</span>' +
      '<span class="code">' + escapeHTML(s.ticker || s.id) + '</span>' +
      '</div>'
    ).join('');
    box.classList.add('open');
    positionResults();
  }

    return BASE + 'data/raw/' + encodeURIComponent(id) + '.json' + version;

  async function loadRaw(symbol){
    const id = String(symbol.id);
    if(state.rawCache.has(id)) return state.rawCache.get(id);

    const promise = fetchJSON(dataUrlFor(id))
      .then(validateBars)
      .then((bars) => bars);

    state.rawCache.set(id,promise);
    try{
      const bars = await promise;
      state.rawCache.set(id,bars);
      return bars;
    }catch(e){
      state.rawCache.delete(id);
      throw new Error('داده نماد «' + symbol.name + '» دریافت نشد: ' + (e?.message || 'خطای نامشخص'));
    }
  }

  function clearDataCaches(){
    state.rawCache.clear();
    state.adjustedCache.clear();
    state.ratioCache.clear();
  }

  function findGaps(bars){
    const gaps = [];
    for(let i=1;i<bars.length;i++){
      const prev = bars[i-1].close;
      const curr = bars[i].close;
      if(prev>0 && curr>0){
        const ratio = curr/prev;
        if(ratio>1.4 || ratio<0.7) gaps.push({idx:i,ratio});
      }
    }
    return gaps;
  }

  function adjustedBars(id,bars){
    if(state.adjustedCache.has(id)) return state.adjustedCache.get(id);
    const out = bars.map((b) => ({...b}));
    for(let pass=0;pass<8;pass++){
      const gaps = findGaps(out);
      if(!gaps.length) break;
      for(let i=gaps.length-1;i>=0;i--){
        const {idx,ratio} = gaps[i];
        for(let j=0;j<idx;j++){
          out[j].open *= ratio;
          out[j].high *= ratio;
          out[j].low *= ratio;
          out[j].close *= ratio;
        }
      }
    }
    state.adjustedCache.set(id,out);
    return out;
  }

  function getWorkingBars(symbol,raw){
    return state.adjusted ? adjustedBars(String(symbol.id),raw) : raw;
  }

  function aggregate(bars,tf){
    const parsed = parseTimeframe(tf);
    if(!parsed) throw new Error('تایم‌فریم معتبر نیست: ' + tf);
    if(tf === '1D') return bars;
    const out=[];
    let bucket=null;
    const DAY = 86400000;
    const anchorSaturday = Date.UTC(1970,0,3);
    for(const b of bars){
      const d = new Date(b.time);
      let key;
      if(parsed.unit === 'D'){
        // Calendar-day groups anchored to Saturday, the Iranian market week start.
        const day = Math.floor(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()) / DAY);
        const anchorDay = Math.floor(anchorSaturday / DAY);
        key = (anchorDay + Math.floor((day - anchorDay) / parsed.count) * parsed.count) * DAY;
      }else if(parsed.unit === 'W'){
        const offset = (d.getUTCDay() + 1) % 7; // Saturday = first day
        const weekStart = Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-offset);
        const groupWidth = parsed.count * 7 * DAY;
        key = anchorSaturday + Math.floor((weekStart - anchorSaturday) / groupWidth) * groupWidth;
      }else{
        const monthIndex = (d.getUTCFullYear()-1970)*12 + d.getUTCMonth();
        const groupIndex = Math.floor(monthIndex / parsed.count) * parsed.count;
        key = Date.UTC(1970 + Math.floor(groupIndex/12), ((groupIndex%12)+12)%12, 1);
      }
      if(!bucket || bucket.time!==key){
        if(bucket) out.push(bucket);
        bucket = {time:key,open:b.open,high:b.high,low:b.low,close:b.close,volume:b.volume||0};
      }else{
        if(b.high>bucket.high) bucket.high=b.high;
        if(b.low<bucket.low) bucket.low=b.low;
        bucket.close=b.close;
        bucket.volume += b.volume||0;
      }
    }
    if(bucket) out.push(bucket);
    return out;
  }

  function ratioKey(){
    return [state.a?.id,state.b?.id,state.timeframe,state.adjusted?'A':'R'].join('|');
  }

  function buildRatio(a,b){
    const key = ratioKey();
    if(state.ratioCache.has(key)) return state.ratioCache.get(key);

    const left = new Map(a.map((x) => [x.time,x]));
    const right = new Map(b.map((x) => [x.time,x]));
    const out=[];

    for(const [time,x1] of left){
      const x2 = right.get(time);
      if(!x2) continue;
      if([x1.open,x1.high,x1.low,x1.close,x2.open,x2.high,x2.low,x2.close].some((v) => !Number.isFinite(v) || v<=0)) continue;

      // Ratio OHLC from the two synchronized OHLC bars. Open is the current period's
      // open ratio, not the previous close. High/low are conservative ratio envelopes.
      const open = x1.open / x2.open;
      const close = x1.close / x2.close;
      const high = Math.max(x1.high/x2.low, x1.high/x2.close, x1.close/x2.low, open, close);
      const low = Math.min(x1.low/x2.high, x1.low/x2.close, x1.close/x2.high, open, close);
      if(!(high>0) || !(low>0) || !Number.isFinite(high) || !Number.isFinite(low)) continue;
      out.push({time,open,high,low,close,volume:0});
    }

    state.ratioCache.set(key,out);
    return out;
  }

  function currentVisibleRange(bars){
    if(!bars.length) return undefined;
    return {from:bars[0].time,to:bars[bars.length-1].time};
  }

  let chartMutationQueue = Promise.resolve();

  async function ensureChart(bars,serial){
    const task = chartMutationQueue.catch(()=>{}).then(()=>ensureChartInner(bars,serial));
    chartMutationQueue = task.catch(()=>{});
    return task;
  }

  async function ensureChartInner(bars,serial){
    if(typeof VelaWorkspace !== 'function') throw new Error('کتابخانه Vela Workspace بارگذاری نشده است.');
    if(serial !== state.buildSerial) return false;
    if(!bars.length) throw new Error('داده‌ای برای نمودار وجود ندارد.');

    const targetKey = chartStorageKey(state.a,state.b,state.timeframe,state.adjusted);
    if(state.activeChartKey && state.activeChartKey !== targetKey) saveCurrentChartState();
    state.isRestoring = true;
    try{
      const chartOptions = {
        layout:false,
        data:bars,
        timeframe:state.timeframe,
        theme:state.theme,
        priceStyle:state.priceStyle,
        logScale:state.logScale,
        currentPriceLine:true,
        upColor:'#089981',
        downColor:'#f23645',
        nativeBackend:'auto',
        animations:{zoom:true,pan:false},
        animZoom:true,
        animPan:false,
        zoomAnchor:'cursor',
        axisDrag:true,
        paneResize:true,
        autoScale:true,
        gridlines:true,
        axisLabels:true,
        priceLabel:true,
        countdown:false,
        timezone:'Asia/Tehran',
        scaleMode:'price',
        drawings:{toolbar:true},
        drawingToolbar:true,
        statusline:true,
        watermark:true,
        bottombar:true,
        autofocus:true,
        topbar:{left:['style','indicators','undo-redo'],right:['panels','screenshot']},
        persist:false
      };

      if(!state.workspace){
        state.workspace = new VelaWorkspace('#chart',chartOptions);
        state.chart = state.workspace.chart;
        await withChartTimeout(state.chart.ready(),'آماده‌سازی نمودار بیش از ۴۵ ثانیه طول کشید.');
        state.defaultRendererConfig = cloneJSON(state.chart?.renderer?.getConfig?.());
        const freshDoc = safeWorkspaceState();
        state.defaultWorkspaceChart = extractWorkspaceChart(freshDoc?.charts?.[0] || null);
        try{ state.workspace.setTheme(state.theme); }catch(e){}
        attachChartPersistence();
        try{
          state.workspace.on('state:changed',() => {
            if(state.isRestoring) return;
            syncRendererStateFromWorkspace();
            scheduleChartSave();
          });
          state.workspace.on('theme:changed',(resolvedTheme) => {
            if(state.isRestoring) return;
            if(resolvedTheme === 'light' || resolvedTheme === 'dark') state.theme = resolvedTheme;
            else if(resolvedTheme && typeof resolvedTheme === 'object'){
              const bg=String(resolvedTheme.background || resolvedTheme.backgroundColor || '').trim();
              const hex=bg.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
              const rgb=bg.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
              let brightness=null;
              if(hex){let value=hex[1];if(value.length===3)value=value.split('').map((c)=>c+c).join('');brightness=(parseInt(value.slice(0,2),16)*299+parseInt(value.slice(2,4),16)*587+parseInt(value.slice(4,6),16)*114)/1000;}
              else if(rgb)brightness=(Number(rgb[1])*299+Number(rgb[2])*587+Number(rgb[3])*114)/1000;
              if(brightness!==null) state.theme=brightness>=128?'light':'dark';
            }
            syncThemeButton();
            scheduleChartSave();
          });
        }catch(e){}
        mountHostControlsIntoVelaTopbar();
        attachSlowWheelZoom();
        if(!state.controlsObserver && window.MutationObserver){
          state.controlsObserver = new MutationObserver(() => {
            if(!$('hostControls').isConnected || !$('chart').contains($('hostControls'))) mountHostControlsIntoVelaTopbar();
          });
          state.controlsObserver.observe($('chart'),{childList:true,subtree:true});
        }
      }else{
        await withChartTimeout(Promise.resolve(state.workspace.chart.setMarket({data:bars,timeframe:state.timeframe,visibleRange:currentVisibleRange(bars)})),'تعویض داده‌های نمودار بیش از ۴۵ ثانیه طول کشید.');
        state.chart = state.workspace.chart;
        await withChartTimeout(state.chart.ready(),'آماده‌سازی نمودار بیش از ۴۵ ثانیه طول کشید.');
      }

      if(serial !== state.buildSerial) return false;
      restoreChartState(targetKey,bars);
      state.activeChartKey = targetKey;
      applyRendererChange();
      try{ state.workspace.setTheme(state.theme); }catch(e){}
      syncControls();
      syncThemeButton();
      mountHostControlsIntoVelaTopbar();
      return true;
    }finally{
      state.isRestoring = false;
    }
  }

  async function buildAndRender(){
    const serial = ++state.buildSerial;
    clearError();
    if(!state.a || !state.b) throw new Error('دو نماد را انتخاب کنید.');
    if(String(state.a.id)===String(state.b.id)) throw new Error('دو نماد باید متفاوت باشند.');

    try{
      const ratio = await loadRatioData(state.a,state.b,state.timeframe,state.adjusted,state.dataVersion);
      if(serial !== state.buildSerial) return;
      if(ratio.length<2) throw new Error('هم‌پوشانی زمانی دو نماد برای این تایم‌فریم کافی نیست.');
      if(!(await ensureChart(ratio,serial))) return;
      state.lastRatioBars = ratio;
      state.lastRenderedKey = [state.a.id,state.b.id,state.timeframe,state.adjusted?'A':'R',state.priceStyle,state.logScale].join('|');
      updatePairUI();
      updatePairMeta(ratio);
      setStatus(ratio.length.toLocaleString('fa-IR') + ' کندل نسبت');
      persistState();
      requestAnimationFrame(() => state.chart?.resize?.());
    }catch(e){
      if(serial !== state.buildSerial || e?.name === 'AbortError') return;
      const message = e?.message || 'خطای نامشخص';
      showError(message);
      setStatus('');
    }
  }

  function syncRendererStateFromWorkspace(){
    try{
      const cfg = state.chart?.renderer?.getConfig?.();
      if(!cfg || typeof cfg !== 'object') return;
      if(STYLE_VALUES.has(String(cfg.priceStyle))) state.priceStyle = String(cfg.priceStyle);
      if(typeof cfg.logScale === 'boolean') state.logScale = cfg.logScale;
    }catch(e){}
  }

  function applyRendererChange(){
    if(!state.chart?.renderer?.set) return;
    const patch = {};
    if(state.chart.renderer.supports?.('priceStyle') !== false) patch.priceStyle = state.priceStyle;
    if(state.chart.renderer.supports?.('logScale') !== false) patch.logScale = state.logScale;
    if(state.chart.renderer.supports?.('upColor') !== false) patch.upColor = '#089981';
    if(state.chart.renderer.supports?.('downColor') !== false) patch.downColor = '#f23645';
    state.chart.renderer.set(patch);
  }


  async function changeTimeframe(value){
    if(!isValidTimeframe(value)) return;
    saveCurrentChartState();
    state.timeframe = value;
    state.ratioCache.clear();
    persistState();
    await buildAndRender();
  }

  async function changeMode(adjusted){
    if(state.adjusted === adjusted) return;
    saveCurrentChartState();
    state.adjusted = adjusted;
    state.ratioCache.clear();
    syncControls();
    persistState();
    await buildAndRender();
  }

  function swapSymbols(){
    if(!state.a || !state.b) return;
    saveCurrentChartState();
    const temp = state.a; state.a = state.b; state.b = temp;
    state.ratioCache.clear();
    updatePairUI();
    persistState();
    buildAndRender();
  }

  async function toggleFullscreen(){
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
      setTimeout(() => state.chart?.resize?.(),80);
    }catch(e){showError('تمام‌صفحه در این مرورگر در دسترس نیست.');}
  }

  $('slotA').addEventListener('click',() => openSearch('A'));
  $('slotB').addEventListener('click',() => openSearch('B'));
  $('swapBtn').addEventListener('click',swapSymbols);
  $('analyzeBtn').addEventListener('click',buildAndRender);
  $('searchInput').addEventListener('input',(e) => renderSearch(e.target.value));
  $('searchInput').addEventListener('focus',(e) => {if(!state.searchOpen) openSearch(state.targetSlot); else renderSearch(e.target.value);});
  $('searchInput').addEventListener('keydown',(e) => {
    if(e.key==='Escape'){closeSearch();return;}
    if(e.key==='ArrowDown'){
      e.preventDefault();
      if(state.searchResults.length){state.searchCursor=Math.min(state.searchCursor+1,state.searchResults.length-1);highlightSearch();}
      return;
    }
    if(e.key==='ArrowUp'){
      e.preventDefault();
      if(state.searchResults.length){state.searchCursor=Math.max(state.searchCursor-1,0);highlightSearch();}
      return;
    }
    if(e.key==='Enter'){
      e.preventDefault();
      const sym = state.searchResults[state.searchCursor];
      if(sym) chooseSymbolById(sym.id);
    }
  });

  $('results').addEventListener('mousedown',(e) => e.preventDefault());
  $('results').addEventListener('click',(e) => {
    const row = e.target.closest('.result[data-id]');
    if(row) chooseSymbolById(row.dataset.id);
  });

  document.addEventListener('click',(e) => {
    const target=e.target;
    if($('searchBox').contains(target) || $('results').contains(target) || $('slotA').contains(target) || $('slotB').contains(target)) return;
    closeSearch();
  });

  $('timeframe').addEventListener('change',(e) => changeTimeframe(e.target.value));
  $('customTfBtn').addEventListener('click',async()=>{
    const raw = window.prompt('تایم‌فریم دلخواه را وارد کنید؛ نمونه: 2D، 3D، 10D، 2W یا 3M. بازه‌ها فقط از داده روزانه و بالاتر ساخته می‌شوند.','2D');
    if(raw === null) return;
    const value = normalizeText(raw).replace(/\s+/g,'').toUpperCase();
    if(!isValidTimeframe(value)){
      showError('تایم‌فریم نامعتبر است. از 1D، 1W، 1M یا بازه‌هایی مانند 2D، 3D، 2W، 3M با عدد حداکثر 99 استفاده کنید.');
      return;
    }
    clearError();
    await changeTimeframe(value);
  });
  $('adjustedBtn').addEventListener('click',() => changeMode(true));
  $('rawBtn').addEventListener('click',() => changeMode(false));
  $('fullscreenBtn').addEventListener('click',toggleFullscreen);
  $('themeBtn').addEventListener('click',()=>applyTheme(state.theme==='dark'?'light':'dark'));
  window.addEventListener('resize',() => {positionResults();state.chart?.resize?.();});
  document.addEventListener('visibilitychange',() => { if(document.visibilityState==='hidden') saveCurrentChartState(); });
  window.addEventListener('beforeunload',() => {saveCurrentChartState();try{dataWorker?.terminate();}catch(e){}});
  window.addEventListener('scroll',positionResults,{passive:true});

  document.addEventListener('keydown',(e) => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='k'){
      e.preventDefault(); openSearch(state.targetSlot);
    }
    if(e.key==='Escape' && state.searchOpen) closeSearch();
  });

  // ------------------------------------------------------------
  // Per-chart persistence: drawing document, renderer settings,
  // indicators, theme, and viewport are keyed independently.
  // ------------------------------------------------------------
  let chartSaveTimer = null;

  function cloneJSON(value){
    if(value === undefined || value === null) return value ?? null;
    try{return JSON.parse(JSON.stringify(value));}catch(e){return null;}
  }

  function safeWorkspaceState(){
    try{return state.workspace?.getState?.() || null;}catch(e){return null;}
  }

  function extractWorkspaceChart(chartState){
    if(!chartState || typeof chartState!=='object') return null;
    const copy={};
    for(const key of ['priceStyle','watermark','indicatorTitles','indicators','rendererConfig','drawings','ext']){
      if(Object.prototype.hasOwnProperty.call(chartState,key)) copy[key]=cloneJSON(chartState[key]);
    }
    return copy;
  }

  function saveCurrentChartState(){
    if(state.isRestoring || !state.chart || !state.activeChartKey) return;
    try{
      const workspaceState = safeWorkspaceState();
      const workspaceChart = extractWorkspaceChart(workspaceState?.charts?.[0] || null);
      const drawings = cloneJSON(state.chart?.drawings?.toJSON?.());
      const rendererConfig = cloneJSON(state.chart?.renderer?.getConfig?.());
      const visibleRange = cloneJSON(state.chart?.getVisibleRange?.());
      const snapshot = {
        version:2,
        savedAt:Date.now(),
        settings:{priceStyle:state.priceStyle,logScale:state.logScale,theme:state.theme},
        visibleRange,
        drawings,
        rendererConfig,
        workspaceChart
      };
      localStorage.setItem(state.activeChartKey,JSON.stringify(snapshot));
      // Keep the general state key for the next visit's initial chart selection.
      persistState();
    }catch(e){console.warn('Chart state could not be saved.',e);}
  }

  function scheduleChartSave(){
    if(state.isRestoring) return;
    clearTimeout(chartSaveTimer);
    chartSaveTimer=setTimeout(saveCurrentChartState,350);
  }

  function applyWorkspaceChartFields(savedChart){
    if(!savedChart || !state.workspace?.applyState) return;
    try{
      const doc=safeWorkspaceState();
      const current=doc?.charts?.[0];
      if(!doc || !current) return;
      for(const key of ['priceStyle','watermark','indicatorTitles','indicators','rendererConfig','drawings','ext']){
        if(Object.prototype.hasOwnProperty.call(savedChart,key)) current[key]=cloneJSON(savedChart[key]);
      }
      state.workspace.applyState(doc);
      state.chart=state.workspace.chart;
    }catch(e){console.warn('Vela chart settings could not be restored.',e);}
  }

  function clearChartDrawings(){
    try{
      const drawings=state.chart?.drawings?.all?.() || [];
      for(const drawing of drawings){if(drawing?.id) state.chart.drawings.remove(drawing.id);}
    }catch(e){}
  }

  function restoreChartState(key,bars){
    let saved=null;
    try{saved=JSON.parse(localStorage.getItem(key)||'null');}catch(e){}

    if(saved?.settings){
      if(STYLE_VALUES.has(saved.settings.priceStyle)) state.priceStyle=saved.settings.priceStyle;
      if(typeof saved.settings.logScale==='boolean') state.logScale=saved.settings.logScale;
      if(saved.settings.theme==='light' || saved.settings.theme==='dark') state.theme=saved.settings.theme;
    }

    const wasRestoring=state.isRestoring;
    state.isRestoring=true;
    try{
      if(saved?.workspaceChart) applyWorkspaceChartFields(saved.workspaceChart);
      else if(state.defaultWorkspaceChart) applyWorkspaceChartFields(state.defaultWorkspaceChart);

      const config=saved?.rendererConfig || state.defaultRendererConfig;
      if(config && state.chart?.renderer?.applyConfig){
        try{state.chart.renderer.applyConfig(cloneJSON(config));}catch(e){}
      }

      clearChartDrawings();
      const drawingDoc=saved?.drawings ?? saved?.workspaceChart?.drawings;
      if(drawingDoc && state.chart?.drawings?.fromJSON){
        try{state.chart.drawings.fromJSON(cloneJSON(drawingDoc));}catch(e){console.warn('Drawings could not be restored.',e);}
      }

      if(!saved && state.defaultRendererConfig && state.chart?.renderer?.applyConfig){
        try{state.chart.renderer.applyConfig(cloneJSON(state.defaultRendererConfig));}catch(e){}
      }
      applyRendererChange();
      try{state.workspace?.setTheme?.(state.theme);}catch(e){}

      const range=saved?.visibleRange;
      const first=bars?.[0]?.time, last=bars?.[bars.length-1]?.time;
      if(range && Number.isFinite(range.from) && Number.isFinite(range.to) && range.from < range.to && Number.isFinite(first) && Number.isFinite(last) && range.to >= first && range.from <= last){
        try{state.chart?.setVisibleRange?.({from:range.from,to:range.to});}catch(e){}
      }else if(first!==undefined && last!==undefined){
        try{state.chart?.setVisibleRange?.({from:first,to:last});}catch(e){}
      }
    }finally{
      state.isRestoring=wasRestoring;
    }
  }

  function attachChartPersistence(){
    if(!state.chart) return;
    const onChange=()=>scheduleChartSave();
    for(const event of ['drawing:created','drawing:edited','drawing:removed','drawing:settings','viewport:changed','indicator:added','indicator:removed']){
      try{state.chart.on?.(event,onChange);}catch(e){}
    }
    try{state.chart.renderer?.onConfigChanged?.(()=>{if(state.isRestoring)return;syncRendererStateFromWorkspace();scheduleChartSave();});}catch(e){}
  }

  function mountHostControlsIntoVelaTopbar(){
    const root=$('chart'), controls=$('hostControls'), app=document.querySelector('.app');
    if(!root || !controls || !app) return false;
    if(controls.isConnected && root.contains(controls)){
      app.classList.add('toolbar-mounted');
      return true;
    }

    const elements=[...root.querySelectorAll('button,[role="button"], [title], [aria-label]')];
    const textOf=(el)=>((el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')+' '+(el.textContent||'')+' '+(el.className?.baseVal||el.className||'')).toLowerCase();
    const indicator=elements.find((el)=>/indicator/.test(textOf(el)));
    const screenshot=elements.find((el)=>/screenshot|camera|capture/.test(textOf(el)));
    if(screenshot){screenshot.title='گرفتن تصویر نمودار (PNG)';screenshot.setAttribute('aria-label','گرفتن تصویر نمودار (PNG)');}
    let target=[...root.querySelectorAll('.vela-topbar,[data-vela-topbar],[class*="topbar"]')]
      .find((el)=>/indicator/.test(textOf(el)) || el.contains(indicator||document.createElement('i')));

    if(!target && indicator){
      for(let node=indicator.parentElement;node && node!==root;node=node.parentElement){
        const rect=node.getBoundingClientRect();
        if((!screenshot || node.contains(screenshot)) && rect.height>=22 && rect.height<=100 && getComputedStyle(node).display.includes('flex')){target=node;break;}
      }
    }
    if(!target){
      target=[...root.querySelectorAll('.vela-topbar,[data-vela-topbar],[class*="topbar"]')]
        .find((el)=>el.getBoundingClientRect().height>=22 && el.getBoundingClientRect().height<=100);
    }
    if(!target || target===controls || controls.contains(target)) return false;

    controls.classList.add('mounted');
    controls.style.maxWidth='min(76vw, 980px)';
    target.appendChild(controls);
    app.classList.add('toolbar-mounted');
    try{requestAnimationFrame(()=>state.chart?.resize?.());}catch(e){}
    positionResults();
    return true;
  }

  function attachSlowWheelZoom(){
    if(state.wheelAttached) return;
    const root=$('chart');
    if(!root) return;
    state.wheelAttached=true;
    root.addEventListener('wheel',(event)=>{
      if(event.ctrlKey || event.metaKey || event.shiftKey || Math.abs(event.deltaX)>Math.abs(event.deltaY) || event.deltaY===0) return;
      if(event.target?.closest?.('button,input,select,[role="dialog"],[class*="toolbar"],[class*="panel"],[class*="menu"]')) return;
      const rect=root.getBoundingClientRect();
      const x=event.clientX-rect.left, y=event.clientY-rect.top;
      if(x<52 || x>rect.width-84 || y<38 || y>rect.height-34) return;
      const range=state.chart?.getVisibleRange?.();
      if(!range || !Number.isFinite(range.from) || !Number.isFinite(range.to) || range.to<=range.from) return;
      const delta=event.deltaMode===1?event.deltaY*18:(event.deltaMode===2?event.deltaY*120:event.deltaY);
      const step=Math.max(-2,Math.min(2,delta/100));
      const factor=Math.exp(step*0.055);
      const anchorFraction=Math.max(0.05,Math.min(0.95,(x-52)/Math.max(1,rect.width-136)));
      const anchor=range.from+(range.to-range.from)*anchorFraction;
      const from=anchor-(anchor-range.from)*factor;
      const to=anchor+(range.to-anchor)*factor;
      if(!(to>from)) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      try{state.chart.setVisibleRange({from,to});scheduleChartSave();}catch(e){}
    },{capture:true,passive:false});
  }

  (async function boot(){
    try{
      if(typeof VelaWorkspace !== 'function') throw new Error('کتابخانه Vela Workspace بارگذاری نشده است.');
      await loadDataVersion();
      await loadSymbols();
      readSavedState();
      await buildAndRender();
    }catch(e){
      showError(e.message || 'خطای نامشخص');
      setStatus('');
    }
  })();
})();
</script>
</body>
</html>
