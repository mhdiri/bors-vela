<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نسبت‌سنجی بورس ایران</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#131722;--panel:#1e222d;--panel2:#2a2e39;--border:#2a2e39;--text:#d1d4dc;--text2:#787b86;--accent:#2962FF;--green:#26a69a;--red:#ef5350;--yellow:#f7b600}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Tahoma,Arial;font-size:12px}
button{background:none;border:none;color:inherit;cursor:pointer;font-family:inherit;font-size:11px;padding:5px 8px;border-radius:3px}
button:hover{background:var(--panel2)}
button.on{background:var(--accent);color:#fff}
select{background:var(--panel2);border:none;color:var(--text);padding:5px 8px;border-radius:3px;font-family:inherit;font-size:11px;cursor:pointer;outline:none}
input{background:var(--panel2);border:none;color:var(--text);padding:5px 8px;border-radius:3px;font-family:inherit;font-size:11px;outline:none}
.app{display:grid;grid-template-rows:44px 1fr 26px;height:100vh}
.top{display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap}
.top::-webkit-scrollbar{height:0}
.logo{font-weight:700;font-size:14px}
.symbox{display:flex;align-items:center;gap:4px;padding:3px 8px;background:var(--panel2);border-radius:4px}
.symbox select{background:transparent;padding:3px 6px;font-weight:600}
.symbox .vs{color:var(--text2);padding:0 3px}
.symbox .go{background:var(--accent);color:#fff;padding:4px 12px;font-weight:600}
.divider{width:1px;height:20px;background:var(--border);margin:0 4px;flex-shrink:0}
.main{display:grid;grid-template-columns:44px 1fr 240px;overflow:hidden}
.side{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:1px;overflow-y:auto}
.side::-webkit-scrollbar{width:0}
.tool{width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:14px;padding:0;position:relative}
.tool:hover{background:var(--panel2);color:var(--text)}
.tool.on{background:var(--accent);color:#fff}
.tool .tip{position:absolute;right:42px;top:50%;transform:translateY(-50%);background:#000;color:#fff;padding:4px 8px;border-radius:3px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:100}
.tool:hover .tip{opacity:1}
.watchlist{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.wl-head{padding:10px;border-bottom:1px solid var(--border)}
.wl-head input{width:100%;font-size:12px}
.wl-list{flex:1;overflow-y:auto}
.wl-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;transition:background .15s}
.wl-item:hover{background:var(--panel2)}
.wl-item.on{background:rgba(41,98,255,.15);border-right:3px solid var(--accent)}
.wl-item .name{font-weight:600}
.wl-item .price{font-size:11px;color:var(--text2);font-family:monospace}
.chart-wrap{position:relative;background:var(--bg);overflow:hidden}
#chart{width:100%;height:100%}
#rsiWrap{position:absolute;bottom:0;left:0;right:0;height:120px;background:var(--bg);border-top:1px solid var(--border);display:none;z-index:3}
#rsiWrap.on{display:block}
#rsiChart{width:100%;height:100%}
#drawSvg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none}
#drawSvg.drawing{pointer-events:auto;cursor:crosshair}
.legend{position:absolute;top:10px;left:10px;background:rgba(30,34,45,.9);padding:8px 12px;border-radius:4px;font-size:11px;display:none;z-index:9;font-family:monospace;backdrop-filter:blur(6px)}
.legend.on{display:block}
.legend .p{color:var(--accent);font-weight:700;font-size:13px}
.legend .c{font-weight:700}
.legend .c.up{color:var(--green)}
.legend .c.dn{color:var(--red)}
.stats{position:absolute;top:10px;right:12px;background:rgba(30,34,45,.92);padding:10px 14px;border-radius:6px;font-size:11px;min-width:220px;z-index:9;display:none;backdrop-filter:blur(6px);font-family:monospace;border:1px solid var(--border)}
.stats.on{display:block}
.stats .h{font-weight:700;font-size:12px;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.stats .r{display:flex;justify-content:space-between;padding:2px 0;gap:14px}
.stats .k{color:var(--text2)}
.stats .v{font-weight:700}
#sig{position:absolute;bottom:135px;right:12px;padding:6px 12px;border-radius:4px;font-size:11px;font-weight:700;font-family:monospace;display:none;z-index:8}
#sig.on{display:block}
#sig.buy{background:rgba(38,166,154,.2);color:var(--green);border:1px solid var(--green)}
#sig.sell{background:rgba(239,83,80,.2);color:var(--red);border:1px solid var(--red)}
#sig.neu{background:rgba(247,182,0,.15);color:var(--yellow);border:1px solid var(--yellow)}
#xh{position:absolute;bottom:8px;left:10px;background:var(--panel2);padding:3px 8px;border-radius:3px;font-size:11px;font-family:monospace;display:none;z-index:10}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(19,23,34,.95);color:var(--text2);font-size:13px;z-index:20;gap:12px}
#load.off{display:none}
.spin{width:28px;height:28px;border:2px solid var(--panel2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bot{display:flex;align-items:center;padding:0 12px;background:var(--panel);border-top:1px solid var(--border);font-size:11px;color:var(--text2);gap:12px}
.bot .st{margin-left:auto}
.dd{position:relative;display:inline-block}
.ddm{position:absolute;top:100%;right:0;margin-top:4px;background:#1e222d;border:1px solid var(--border);border-radius:6px;padding:6px;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:100;display:none}
.ddm.on{display:block}
.ddm .h{font-size:10px;color:var(--text2);padding:6px 10px 4px;font-weight:600}
.ddm label{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:11px;gap:12px}
.ddm label:hover{background:var(--panel2)}
.ddm input[type=checkbox]{accent-color:var(--accent);cursor:pointer}
.ddm input[type=color]{width:26px;height:20px;border:1px solid var(--border);border-radius:3px;padding:0;cursor:pointer;background:transparent}
@media(max-width:768px){.main{grid-template-columns:44px 1fr}.watchlist{display:none}}
</style>
</head>
<body>

<div class="app">

<div class="top">
  <span class="logo">📊 نسبت‌سنجی</span>
  <div class="symbox">
    <select id="sym1"></select>
    <span class="vs">÷</span>
    <select id="sym2"></select>
    <button class="go" onclick="analyze()">تحلیل</button>
  </div>
  <div class="divider"></div>
  <div class="tf" id="tfBar">
    <button onclick="setTF('1D',this)">روزانه</button>
    <button onclick="setTF('1W',this)" class="on">هفتگی</button>
    <button onclick="setTF('1M',this)">ماهانه</button>
  </div>
  <div class="divider"></div>
  <button onclick="setRange(30,this)">۱م</button>
  <button onclick="setRange(90,this)">۳م</button>
  <button onclick="setRange(180,this)">۶م</button>
  <button onclick="setRange(365,this)">۱س</button>
  <button onclick="setRange(1825,this)">۵س</button>
  <button onclick="setRange(0,this)" class="on">همه</button>
  <div class="divider"></div>
  <div class="dd">
    <button onclick="dd('ddInd',event)">اندیکاتور ▾</button>
    <div class="ddm" id="ddInd">
      <div class="h">میانگین متحرک</div>
      <label><span style="color:#FF6D00">MA 20</span><input type="checkbox" id="tMA20" checked onchange="redraw()"></label>
      <label><span style="color:#9C27B0">MA 50</span><input type="checkbox" id="tMA50" checked onchange="redraw()"></label>
      <label><span style="color:#E91E63">MA 200</span><input type="checkbox" id="tMA200" onchange="redraw()"></label>
      <label><span style="color:#00BCD4">EMA 12</span><input type="checkbox" id="tEMA12" onchange="redraw()"></label>
      <label><span style="color:#FFB300">EMA 26</span><input type="checkbox" id="tEMA26" onchange="redraw()"></label>
      <div class="h">اندیکاتورهای نسبت</div>
      <label><span style="color:#00BCD4">باندهای بولینگر</span><input type="checkbox" id="tBB" checked onchange="redraw()"></label>
      <label><span>خطوط حد بالا/پایین</span><input type="checkbox" id="tMinMax" onchange="redraw()"></label>
      <label><span>کانال رگرسیون</span><input type="checkbox" id="tReg" onchange="redraw()"></label>
      <div class="h">اوسیلاتور</div>
      <label><span>RSI (14)</span><input type="checkbox" id="tRSI" checked onchange="toggleRSI()"></label>
      <label><span>MACD</span><input type="checkbox" id="tMACD" onchange="toggleMACD()"></label>
    </div>
  </div>
  <button onclick="toggleLog(this)" id="logBtn">لگاریتمی</button>
  <button onclick="toggleStats(this)" id="statsBtn">📊 آمار</button>
  <button onclick="exportCSV()">📥 CSV</button>
  <button onclick="toggleTheme()" id="themeBtn">☀️</button>
</div>

<div class="main">
  <div class="side">
    <button class="tool on" onclick="setTool('cursor',this)">✛<span class="tip">کراس‌هیر</span></button>
    <button class="tool" onclick="setTool('trend',this)">╱<span class="tip">خط روند</span></button>
    <button class="tool" onclick="setTool('ray',this)">→<span class="tip">خط پرتو</span></button>
    <button class="tool" onclick="setTool('hline',this)">─<span class="tip">خط افقی</span></button>
    <button class="tool" onclick="setTool('vline',this)">│<span class="tip">خط عمودی</span></button>
    <button class="tool" onclick="setTool('fib',this)">f<span class="tip">فیبوناچی</span></button>
    <button class="tool" onclick="setTool('rect',this)">▭<span class="tip">مستطیل</span></button>
    <button class="tool" onclick="setTool('text',this)">T<span class="tip">متن</span></button>
    <button class="tool" onclick="undoDraw()">↶<span class="tip">حذف آخرین</span></button>
    <button class="tool" onclick="clearDraw()">🗑<span class="tip">پاک کردن همه</span></button>
  </div>

  <div class="chart-wrap">
    <div id="chart"></div>
    <svg id="drawSvg"></svg>
    <div id="rsiWrap"><div id="rsiChart"></div></div>

    <div class="legend" id="legend">
      <div><span id="lgSym">-</span> <span class="p" id="lgPrice">-</span> <span class="c" id="lgChg">-</span></div>
    </div>

    <div class="stats" id="stats">
      <div class="h">📊 تحلیل نسبت</div>
      <div class="r"><span class="k">نسبت فعلی</span><span class="v" id="vCur" style="color:var(--accent)">-</span></div>
      <div class="r"><span class="k">تغییر کل</span><span class="v" id="vChg">-</span></div>
      <div class="r"><span class="k">میانگین</span><span class="v" id="vMean">-</span></div>
      <div class="r"><span class="k">انحراف معیار</span><span class="v" id="vStd">-</span></div>
      <div class="r"><span class="k">Z-Score</span><span class="v" id="vZ" style="color:var(--yellow)">-</span></div>
      <div class="r"><span class="k">صدک</span><span class="v" id="vPct">-</span></div>
      <div class="r"><span class="k">نیمه‌عمر</span><span class="v" id="vHl" style="color:#9C27B0">-</span></div>
      <div class="r"><span class="k">Hurst</span><span class="v" id="vHurst">-</span></div>
      <div class="r"><span class="k">تعداد</span><span class="v" id="vN">-</span></div>
    </div>

    <div id="sig"></div>
    <div id="xh"></div>
    <div id="load" class="off"></div>
  </div>

  <div class="watchlist">
    <div class="wl-head">
      <input type="text" id="wlSearch" placeholder="🔍 جستجوی نماد..." oninput="filterWL()">
    </div>
    <div class="wl-list" id="wlList"></div>
  </div>
</div>

<div class="bot">
  <span id="status">آماده</span>
  <span class="st" id="toolStatus">ابزار: کراس‌هیر</span>
</div>

</div>

<script>
var $ = function(id){ return document.getElementById(id); };
var setStatus = function(m){ $('status').textContent = m; };

var SYMBOLS = [
  { name: 'خساپا', file: 'khasapa.csv' },
  { name: 'خودرو', file: 'khodro.csv' }
];
var BASE = 'https://raw.githubusercontent.com/mhdiri/bors-vela/main/';

/* ============ پارس CSV ============ */
function parseCSV(text){
  var lines = text.trim().split(/\r?\n/);
  var out = [];
  for(var i = 1; i < lines.length; i++){
    var p = lines[i].split(',');
    if(p.length < 7) continue;
    var ds = p[2].trim().split(' ')[0];
    var ts = new Date(ds).getTime();
    if(isNaN(ts)) continue;
    var c = parseFloat(p[6]);
    if(c <= 0) continue;
    out.push({
      time: ts,
      open: parseFloat(p[3]),
      high: parseFloat(p[4]),
      low: parseFloat(p[5]),
      close: c,
      volume: p[7] ? parseFloat(p[7]) : 0
    });
  }
  return out;
}

/* ============ تجمیع ============ */
function aggregate(bars, tf){
  if(!bars.length || tf === '1D') return bars.slice();
  if(bars.length > 2){
    var gap = (bars[bars.length-1].time - bars[0].time) / (bars.length-1) / 86400000;
    if(tf === '1W' && gap >= 5) return bars.slice();
    if(tf === '1M' && gap >= 25) return bars.slice();
  }
  var out = [], bucket = null;
  for(var i = 0; i < bars.length; i++){
    var b = bars[i];
    var d = new Date(b.time);
    var key;
    if(tf === '1W'){
      var day = d.getUTCDay() || 7;
      var mon = new Date(d);
      mon.setUTCDate(d.getUTCDate() - day + 1);
      mon.setUTCHours(0,0,0,0);
      key = mon.getTime();
    } else {
      key = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
    }
    if(!bucket || bucket.time !== key){
      if(bucket) out.push(bucket);
      bucket = { time: key, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume };
    } else {
      if(b.high > bucket.high) bucket.high = b.high;
      if(b.low < bucket.low) bucket.low = b.low;
      bucket.close = b.close;
      bucket.volume += b.volume;
    }
  }
  if(bucket) out.push(bucket);
  return out;
}

/* ============ ساخت نسبت ============ */
function buildRatio(b1, b2){
  var m1 = {}, m2 = {};
  b1.forEach(function(x){ m1[x.time] = x; });
  b2.forEach(function(x){ m2[x.time] = x; });
  var ts = Object.keys(m1).filter(function(t){ return m2[t]; }).map(Number).sort(function(a,b){ return a-b; });
  var out = [], pc = null;
  ts.forEach(function(t){
    var x1 = m1[t], x2 = m2[t];
    if(!x1 || !x2 || x1.close <= 0 || x2.close <= 0) return;
    var rOpen = pc !== null ? pc : (x1.open / x2.open);
    var rClose = x1.close / x2.close;
    var rHigh = Math.max(x1.high/x2.low, x1.high/x2.close, x1.close/x2.low, rOpen, rClose);
    var rLow = Math.min(x1.low/x2.high, x1.low/x2.close, x1.close/x2.high, rOpen, rClose);
    out.push({ time: t, open: rOpen, high: rHigh, low: rLow, close: rClose, volume: 0 });
    pc = rClose;
  });
  return out;
}

/* ============ اندیکاتورها ============ */
function calcMA(d, p){
  var o = [];
  for(var i = p-1; i < d.length; i++){
    var s = 0;
    for(var j = 0; j < p; j++) s += d[i-j].close;
    o.push({ time: d[i].time, value: s/p });
  }
  return o;
}
function calcEMA(d, p){
  if(!d.length) return [];
  var k = 2/(p+1);
  var prev = d[0].close;
  var o = [];
  for(var i = 0; i < d.length; i++){
    if(i === 0){ prev = d[i].close; }
    else { prev = d[i].close * k + prev * (1-k); }
    o.push({ time: d[i].time, value: prev });
  }
  return o;
}
function calcBB(d, p, m){
  p = p||20; m = m||2;
  var up = [], dn = [], mid = [];
  for(var i = p-1; i < d.length; i++){
    var s = 0;
    for(var j = 0; j < p; j++) s += d[i-j].close;
    var mean = s/p;
    var v = 0;
    for(var j = 0; j < p; j++) v += Math.pow(d[i-j].close - mean, 2);
    var sd = Math.sqrt(v/p);
    up.push({ time: d[i].time, value: mean + m*sd });
    mid.push({ time: d[i].time, value: mean });
    dn.push({ time: d[i].time, value: mean - m*sd });
  }
  return { up: up, mid: mid, dn: dn };
}
function calcRSI(d, p){
  p = p||14;
  if(d.length < p+1) return [];
  var o = [];
  var g = 0, l = 0;
  for(var i = 1; i <= p; i++){
    var df = d[i].close - d[i-1].close;
    if(df >= 0) g += df; else l -= df;
  }
  var ag = g/p, al = l/p;
  o.push({ time: d[p].time, value: 100 - 100/(1 + ag/(al||0.0001)) });
  for(var i = p+1; i < d.length; i++){
    var df = d[i].close - d[i-1].close;
    var gg = df > 0 ? df : 0, ll = df < 0 ? -df : 0;
    ag = (ag*(p-1) + gg)/p;
    al = (al*(p-1) + ll)/p;
    o.push({ time: d[i].time, value: 100 - 100/(1 + ag/(al||0.0001)) });
  }
  return o;
}
function calcReg(d){
  var n = d.length;
  if(n < 2) return null;
  var sx=0, sy=0, sxy=0, sxx=0;
  for(var i=0; i<n; i++){ sx+=i; sy+=d[i].close; sxy+=i*d[i].close; sxx+=i*i; }
  var sl = (n*sxy - sx*sy)/(n*sxx - sx*sx);
  var ic = (sy - sl*sx)/n;
  var maxDev = 0;
  for(var i=0; i<n; i++){
    var dev = Math.abs(d[i].close - (ic + sl*i));
    if(dev > maxDev) maxDev = dev;
  }
  var mid = [], up = [], dn = [];
  for(var i=0; i<n; i++){
    var p = ic + sl*i;
    mid.push({ time: d[i].time, value: p });
    up.push({ time: d[i].time, value: p + maxDev });
    dn.push({ time: d[i].time, value: p - maxDev });
  }
  return { mid: mid, up: up, dn: dn };
}
function calcStats(d){
  var v = d.map(function(b){ return b.close; });
  var n = v.length;
  if(!n) return null;
  var mean = 0;
  for(var i = 0; i < n; i++) mean += v[i];
  mean /= n;
  var vp = 0;
  for(var i = 0; i < n; i++) vp += Math.pow(v[i]-mean, 2);
  var sd = Math.sqrt(vp/n);
  var sorted = v.slice().sort(function(a,b){ return a-b; });
  var cur = v[n-1];
  var z = sd > 0 ? (cur-mean)/sd : 0;
  var pct = (sorted.filter(function(x){ return x <= cur; }).length / n * 100).toFixed(1);
  return { mean: mean, std: sd, cur: cur, z: z, pct: pct, n: n, first: v[0] };
}
function calcHalfLife(d){
  var n = d.length;
  if(n < 10) return null;
  var dr = [], rl = [];
  for(var i = 1; i < n; i++){ dr.push(d[i].close - d[i-1].close); rl.push(d[i-1].close); }
  var m = dr.length;
  var mx = 0, my = 0;
  for(var i = 0; i < m; i++){ mx += rl[i]; my += dr[i]; }
  mx /= m; my /= m;
  var sxy = 0, sxx = 0;
  for(var i = 0; i < m; i++){ sxy += (rl[i]-mx)*(dr[i]-my); sxx += Math.pow(rl[i]-mx, 2); }
  var beta = sxx > 0 ? sxy/sxx : 0;
  if(beta >= 0) return { hl: Infinity };
  return { hl: -Math.log(2)/Math.log(1+beta) };
}
function calcHurst(d){
  var v = d.map(function(b){ return b.close; });
  var n = v.length;
  if(n < 20) return null;
  var sizes = [];
  for(var s = 8; s <= Math.floor(n/2); s *= 2) sizes.push(s);
  if(sizes.length < 2) return null;
  var logRS = [], logN = [];
  for(var si = 0; si < sizes.length; si++){
    var size = sizes[si];
    var chunks = Math.floor(n/size);
    var rsSum = 0, cnt = 0;
    for(var c = 0; c < chunks; c++){
      var ch = v.slice(c*size, (c+1)*size);
      var mn = 0;
      for(var i = 0; i < size; i++) mn += ch[i];
      mn /= size;
      var cum = 0, mnC = 0, mxC = 0;
      for(var i = 0; i < size; i++){
        cum += ch[i] - mn;
        if(cum < mnC) mnC = cum;
        if(cum > mxC) mxC = cum;
      }
      var R = mxC - mnC;
      var vv = 0;
      for(var i = 0; i < size; i++) vv += Math.pow(ch[i]-mn, 2);
      var S = Math.sqrt(vv/size);
      if(S > 0){ rsSum += R/S; cnt++; }
    }
    if(cnt > 0){ logRS.push(Math.log(rsSum/cnt)); logN.push(Math.log(size)); }
  }
  if(logN.length < 2) return null;
  var m = logN.length;
  var mx = 0, my = 0;
  for(var i = 0; i < m; i++){ mx += logN[i]; my += logRS[i]; }
  mx /= m; my /= m;
  var sxy = 0, sxx = 0;
  for(var i = 0; i < m; i++){ sxy += (logN[i]-mx)*(logRS[i]-my); sxx += Math.pow(logN[i]-mx, 2); }
  return sxx > 0 ? sxy/sxx : null;
}

function redraw(){
  if(!curBars.length || !chart) return;

  S.ma50.setData($('tMA50').checked ? calcMA(curBars, 50) : []);
  S.ma200.setData($('tMA200').checked ? calcMA(curBars, 200) : []);
  S.ema12.setData($('tEMA12').checked ? calcEMA(curBars, 12) : []);
  S.ema26.setData($('tEMA26').checked ? calcEMA(curBars, 26) : []);
  if($('tBB').checked){
    var bb = calcBB(curBars, 20, 2);
    S.bbU.setData(bb.up); S.bbL.setData(bb.dn);
  } else { S.bbU.setData([]); S.bbL.setData([]); }
  if($('tMinMax').checked){
    var mx = 0, mn = Infinity;
    curBars.forEach(function(b){ if(b.high > mx) mx = b.high; if(b.low < mn) mn = b.low; });
    var t1 = curBars[0].time, t2 = curBars[curBars.length-1].time;
    S.maxL.setData([{time:t1,value:mx},{time:t2,value:mx}]);
    S.minL.setData([{time:t1,value:mn},{time:t2,value:mn}]);
  } else { S.maxL.setData([]); S.minL.setData([]); }
  if($('tReg').checked){
    var r = calcReg(curBars);
    if(r){ S.regMid.setData(r.mid); S.regUp.setData(r.up); S.regDn.setData(r.dn); }
  } else { S.regMid.setData([]); S.regUp.setData([]); S.regDn.setData([]); }
  if($('tRSI').checked){

      $('rsiWrap').classList.add('on');
      S.rsi.setData(rr);
      S.rsi70.setData(rr.map(function(x){ return {time:x.time, value:70}; }));

    }
  } else {
    $('rsiWrap').classList.remove('on');
  }

  if(rsiChart) rsiChart.timeScale().fitContent();

  setTimeout(drawAll, 100);
}

/* ============ آمار ============ */
function updateStats(){
  var st = calcStats(curBars);
  if(!st) return;
  var chg = ((st.cur - st.first) / st.first * 100).toFixed(2);
  var s1 = SYMBOLS[+$('sym1').value].name;
  var s2 = SYMBOLS[+$('sym2').value].name;
  $('legend').classList.add('on');
  $('lgSym').textContent = s1 + ' / ' + s2;
  $('lgPrice').textContent = st.cur.toFixed(4);
  var ce = $('lgChg');
  ce.textContent = (chg >= 0 ? '+' : '') + chg + '%';
  ce.className = 'c ' + (chg >= 0 ? 'up' : 'dn');
  $('vCur').textContent = st.cur.toFixed(4);
  var vc = $('vChg');
  vc.textContent = (chg >= 0 ? '+' : '') + chg + '%';
  vc.style.color = chg >= 0 ? 'var(--green)' : 'var(--red)';
  $('vMean').textContent = st.mean.toFixed(4);
  $('vStd').textContent = st.std.toFixed(4);
  $('vZ').textContent = st.z.toFixed(2);
  $('vPct').textContent = st.pct + '%';
  $('vN').textContent = st.n;
  var hl = calcHalfLife(curBars);
  if(hl) $('vHl').textContent = hl.hl === Infinity ? '∞' : hl.hl.toFixed(1);
  var h = calcHurst(curBars);
  if(h !== null){
    var lbl = h.toFixed(3);
    if(h > 0.55) lbl += ' (روند)';
    else if(h < 0.45) lbl += ' (بازگشت)';
    else lbl += ' (تصادفی)';
    $('vHurst').textContent = lbl;
  }
  var sig = $('sig');
  sig.classList.add('on');
  var t, c;
  if(st.z > 2){ t = '🔴 اشباع خرید | Z=' + st.z.toFixed(2); c = 'sell'; }
  else if(st.z < -2){ t = '🟢 اشباع فروش | Z=' + st.z.toFixed(2); c = 'buy'; }
  else if(st.z > 1){ t = '🟠 بالاتر از میانگین'; c = 'neu'; }
  else if(st.z < -1){ t = '🟡 پایین‌تر از میانگین'; c = 'neu'; }
  else { t = '⚪ نرمال | Z=' + st.z.toFixed(2); c = 'neu'; }
  sig.textContent = t;
  sig.className = 'on ' + c;
}

/* ============ بازه ============ */
function applyRange(){
  if(!allBars.length){ curBars = []; return; }
  if(curRange === 0){ curBars = allBars.slice(); return; }
  var lastT = allBars[allBars.length-1].time;
  curBars = allBars.filter(function(b){ return b.time >= lastT - curRange*86400000; });
}
function setRange(days, btn){
  curRange = days;
  document.querySelectorAll('.top > button').forEach(function(b){ if(b.onclick && b.onclick.toString().indexOf('setRange') > -1) b.classList.remove('on'); });
  if(btn) btn.classList.add('on');
  if(!allBars.length) return;
  applyRange();
  if(chart){ redraw(); }
}

/* ============ تایم‌فریم ============ */
function setTF(tf, btn){
  curTF = tf;
  document.querySelectorAll('#tfBar button').forEach(function(b){ b.classList.remove('on'); });
  if(btn) btn.classList.add('on');
  if(!raw1 || !raw2) return;
  var a1 = aggregate(raw1, tf);
  var a2 = aggregate(raw2, tf);
  allBars = buildRatio(a1, a2);
  applyRange();
  if(chart){ initChart(); redraw(); }
}

/* ============ تحلیل ============ */
function analyze(){
  $('load').classList.remove('off');
  $('load').innerHTML = '<div class="spin"></div><span>در حال دریافت داده...</span>';
  setStatus('در حال دریافت...');
  var f1 = SYMBOLS[+$('sym1').value].file;
  var f2 = SYMBOLS[+$('sym2').value].file;
  Promise.all([
    fetch(BASE + f1).then(function(r){ return r.text(); }),
    fetch(BASE + f2).then(function(r){ return r.text(); })
  ]).then(function(res){
    raw1 = parseCSV(res[0]);
    raw2 = parseCSV(res[1]);
    if(!raw1.length || !raw2.length) throw new Error('داده خالی');
    var a1 = aggregate(raw1, curTF);
    var a2 = aggregate(raw2, curTF);
    allBars = buildRatio(a1, a2);
    if(allBars.length < 2) throw new Error('داده کافی نیست');
    applyRange();
    initChart();
    redraw();
    $('load').classList.add('off');
    setStatus('✓ ' + curBars.length + ' کندل بارگذاری شد');
    $('stats').classList.add('on');
    $('statsBtn').classList.add('on');
  }).catch(function(e){
    $('load').innerHTML = '<span style="color:#ef5350">خطا: ' + e.message + '</span>';
    setStatus('✗ خطا');
  });
}

var curTool = 'cursor';
var drawings = [], activeDraw = null;
var NS = 'http://www.w3.org/2000/svg';

function setTool(t, btn){
  curTool = t;
  document.querySelectorAll('.tool').forEach(function(b){ b.classList.remove('on'); });
  if(btn) btn.classList.add('on');
  var svg = $('drawSvg');
  if(t === 'cursor') svg.classList.remove('drawing');
  else svg.classList.add('drawing');
  var tips = { cursor:'کراس‌هیر', trend:'خط روند', ray:'خط پرتو', hline:'خط افقی', vline:'خط عمودی', fib:'فیبوناچی', rect:'مستطیل', text:'متن' };
  $('toolStatus').textContent = 'ابزار: ' + (tips[t] || t);
}

function px2d(x, y){
  var r = $('chart').getBoundingClientRect();
  return {
    time: chart.timeScale().coordinateToTime(x - r.left),
    price: S.candle.coordinateToPrice(y - r.top)
  };
}
function d2px(t, p){
  var x = chart.timeScale().timeToCoordinate(t);
  var y = S.candle.priceToCoordinate(p);
  if(x === null || y === null) return null;
  return { x: x, y: y };
}

$('drawSvg').addEventListener('mousedown', function(e){
  if(curTool === 'cursor' || !curBars.length) return;
  var pt = px2d(e.clientX, e.clientY);
  if(!pt.time || pt.price === null) return;
  if(curTool === 'hline'){ drawings.push({ type:'hline', p1: pt }); drawAll(); return; }
  if(curTool === 'vline'){ drawings.push({ type:'vline', p1: pt }); drawAll(); return; }
  if(curTool === 'text'){ var t = prompt('متن:'); if(t) drawings.push({ type:'text', p1: pt, text: t }); drawAll(); return; }
  activeDraw = { type: curTool, p1: pt, p2: pt };
});
$('drawSvg').addEventListener('mousemove', function(e){
  if(!activeDraw) return;
  var pt = px2d(e.clientX, e.clientY);
  if(!pt.time) return;
  activeDraw.p2 = pt;
  drawAll();
});
document.addEventListener('mouseup', function(){
  if(!activeDraw) return;
  drawings.push(activeDraw);
  activeDraw = null;
  drawAll();
});

function clip(x1, y1, x2, y2, w, h){
  var dx = x2-x1, dy = y2-y1, t0 = 0, t1 = 1;
  var p = [-dx, dx, -dy, dy], q = [x1, w-x1, y1, h-y1];
  for(var i = 0; i < 4; i++){
    if(p[i] === 0){ if(q[i] < 0) return null; }
    else {
      var t = q[i]/p[i];
      if(p[i] < 0){ if(t > t1) return null; if(t > t0) t0 = t; }
      else { if(t < t0) return null; if(t < t1) t1 = t; }
    }
  }
  return { x1: x1+t0*dx, y1: y1+t0*dy, x2: x1+t1*dx, y2: y1+t1*dy };
}

function drawAll(){
  var svg = $('drawSvg');
  svg.innerHTML = '';
  if(!chart) return;
  var r = $('chart').getBoundingClientRect();
  svg.setAttribute('viewBox', '0 0 ' + r.width + ' ' + r.height);
  svg.style.width = r.width + 'px';
  svg.style.height = r.height + 'px';
  var all = activeDraw ? drawings.concat([activeDraw]) : drawings;
  all.forEach(function(d){
    var p1 = d2px(d.p1.time, d.p1.price);
    if(!p1) return;
    if(d.type === 'hline'){
      var l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', 0); l.setAttribute('y1', p1.y);
      l.setAttribute('x2', r.width); l.setAttribute('y2', p1.y);
      l.setAttribute('stroke', '#f7b600'); l.setAttribute('stroke-width', '1.5');
      l.setAttribute('stroke-dasharray', '6,4');
      svg.appendChild(l);
    } else if(d.type === 'vline'){
      var l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', p1.x); l.setAttribute('y1', 0);
      l.setAttribute('x2', p1.x); l.setAttribute('y2', r.height);
      l.setAttribute('stroke', '#f7b600'); l.setAttribute('stroke-width', '1.5');
      l.setAttribute('stroke-dasharray', '6,4');
      svg.appendChild(l);
    } else if(d.type === 'trend' || d.type === 'ray'){
      var p2 = d2px(d.p2.time, d.p2.price);
      if(!p2) return;
      var x1 = p1.x, y1 = p1.y, x2 = p2.x, y2 = p2.y;
      var ddx = x2-x1, ddy = y2-y1, dist = Math.sqrt(ddx*ddx+ddy*ddy);
      if(dist < 1) return;
      var ux = ddx/dist, uy = ddy/dist;
      var ext = Math.max(r.width, r.height)*3;
      if(d.type === 'ray'){ x2 = x1 + ux*ext; y2 = y1 + uy*ext; }
      var c = clip(x1, y1, x2, y2, r.width, r.height);
      if(!c) return;
      var l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', c.x1); l.setAttribute('y1', c.y1);
      l.setAttribute('x2', c.x2); l.setAttribute('y2', c.y2);
      l.setAttribute('stroke', '#2962FF'); l.setAttribute('stroke-width', '2');
      svg.appendChild(l);
    } else if(d.type === 'rect'){
      var p2 = d2px(d.p2.time, d.p2.price);
      if(!p2) return;
      var rc = document.createElementNS(NS, 'rect');
      rc.setAttribute('x', Math.min(p1.x, p2.x));
      rc.setAttribute('y', Math.min(p1.y, p2.y));
      rc.setAttribute('width', Math.abs(p2.x - p1.x));
      rc.setAttribute('height', Math.abs(p2.y - p1.y));
      rc.setAttribute('fill', 'rgba(38,166,154,.15)');
      rc.setAttribute('stroke', '#26a69a');
      rc.setAttribute('stroke-width', '1.5');
      svg.appendChild(rc);
    } else if(d.type === 'fib'){
      var p2 = d2px(d.p2.time, d.p2.price);
      if(!p2) return;
      var lv = [0, .236, .382, .5, .618, .786, 1];
      var cl = ['#787b86','#ef5350','#f7b600','#26a69a','#2962FF','#9C27B0','#787b86'];
      var x1 = Math.min(p1.x, p2.x), x2 = Math.max(p1.x, p2.x);
      for(var i = 0; i < lv.length; i++){
        var y = p1.y + (p2.y - p1.y) * lv[i];
        var l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', x1); l.setAttribute('y1', y);
        l.setAttribute('x2', x2); l.setAttribute('y2', y);
        l.setAttribute('stroke', cl[i]); l.setAttribute('stroke-width', '1');
        svg.appendChild(l);
        var t = document.createElementNS(NS, 'text');
        t.setAttribute('x', x1-4); t.setAttribute('y', y+4);
        t.setAttribute('fill', cl[i]); t.setAttribute('font-size', '10');
        t.setAttribute('text-anchor', 'end'); t.setAttribute('font-family', 'monospace');
        t.textContent = (lv[i]*100).toFixed(1) + '%';
        svg.appendChild(t);
      }
    } else if(d.type === 'text'){
      var t = document.createElementNS(NS, 'text');
      t.setAttribute('x', p1.x); t.setAttribute('y', p1.y);
      t.setAttribute('fill', '#f7b600'); t.setAttribute('font-size', '13');
      t.setAttribute('font-weight', '600');
      t.textContent = d.text;
      svg.appendChild(t);
    }
  });
}

window.addEventListener('resize', function(){
  clearTimeout(rt);
  rt = setTimeout(function(){
    if(chart) chart.applyOptions({ width: $('chart').clientWidth, height: $('chart').clientHeight });
    if(rsiChart) rsiChart.applyOptions({ width: $('rsiChart').clientWidth, height: $('rsiChart').clientHeight });
    drawAll();
  }, 100);
});

/* ============ شروع ============ */
(function init(){
  var s1 = $('sym1'), s2 = $('sym2');
  SYMBOLS.forEach(function(s, i){
    s1.innerHTML += '<option value="' + i + '">' + s.name + '</option>';
    s2.innerHTML += '<option value="' + i + '">' + s.name + '</option>';
  });
  s1.value = 0;
  s2.value = 1;
  renderWL();
  setTimeout(analyze, 500);
})();
</script>
