name: Download Rahavard Data

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run download
        env:
          RV_TOKEN: ${{ secrets.RV_TOKEN }}
        run: python scripts/download.py
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Update data" || exit 0
          git push
