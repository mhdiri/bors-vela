name: Update bors-vela data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "نوع اجرا"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - full

  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

concurrency:
  group: bors-vela-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Rahavard update
        env:
          RV_TOKEN: ${{ secrets.RV_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/update.py --full
          elif [ "${{ inputs.mode }}" = "full" ]; then
            python scripts/update.py --full
          else
            python scripts/update.py --test
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw data/update_report.json data/update_errors.json data/symbol_status.json data/version.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update Rahavard market data"
          git push
